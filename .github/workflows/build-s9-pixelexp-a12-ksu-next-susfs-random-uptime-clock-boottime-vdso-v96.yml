      - name: Patch missing WireGuard Kconfig safely
        shell: bash
        working-directory: kernel
        run: |
          set -e

          LOG="wireguard-kconfig-fix-l62.log"
          : > "$LOG"
          echo "===== WIREGUARD KCONFIG SAFE FIX L62 =====" | tee -a "$LOG"

          if grep -qE '^[[:space:]]*(source|rsource)[[:space:]]+"net/wireguard/Kconfig"' net/Kconfig 2>/dev/null; then
            echo "net/Kconfig references net/wireguard/Kconfig" | tee -a "$LOG"

            if [ ! -f net/wireguard/Kconfig ]; then
              echo "net/wireguard/Kconfig is missing; disabling stale source line before defconfig" | tee -a "$LOG"
              cp -av net/Kconfig net/Kconfig.before-wireguard-l62 2>&1 | tee -a "$LOG"
              sed -i -E 's@^([[:space:]]*)(source|rsource)([[:space:]]+)"net/wireguard/Kconfig".*@\1# L62 disabled stale missing WireGuard Kconfig source@' net/Kconfig
            else
              echo "net/wireguard/Kconfig exists; keeping source line" | tee -a "$LOG"
            fi
          else
            echo "No stale net/wireguard/Kconfig source line found" | tee -a "$LOG"
          fi

          # Guard against leftover CONFIG_WIREGUARD forcing a missing menu.
          for CFG in arch/arm64/configs/*.config arch/arm64/configs/*_defconfig arch/arm64/configs/*defconfig; do
            [ -f "$CFG" ] || continue
            if grep -qE '^CONFIG_WIREGUARD=' "$CFG"; then
              echo "Disabling CONFIG_WIREGUARD in $CFG" | tee -a "$LOG"
              sed -i 's/^CONFIG_WIREGUARD=.*/# CONFIG_WIREGUARD is not set/' "$CFG"
            fi
          done

          echo "===== net/Kconfig wireguard lines after fix =====" | tee -a "$LOG"
          grep -nEi 'wireguard' net/Kconfig 2>/dev/null | tee -a "$LOG" || true

          echo "WireGuard Kconfig safe fix L62 completed" | tee -a "$LOG"

      - name: Patch missing SipHash weak compat object safely
        shell: bash
        working-directory: kernel
        run: |
          set -e

          LOG="siphash-linkfix-l62.log"
          : > "$LOG"
          echo "===== SIPHASH WEAK COMPAT LINK FIX L62 =====" | tee -a "$LOG"

          echo "===== siphash references before fix =====" | tee -a "$LOG"
          grep -RIn "siphash_4u64\|siphash_3u32\|__siphash_aligned\|siphash.o\|CONFIG_SIPHASH" \
            include lib net kernel 2>/dev/null | head -260 | tee -a "$LOG" || true

          mkdir -p kernel
          cat > kernel/siphash_compat_l62.c <<'EOF_SIPHASH_COMPAT'
          /*
           * KSU_NEXT_SIPHASH_COMPAT_L62
           * Legacy Exynos9810 tree: net/ uses siphash symbols while the object
           * is not reliably linked into vmlinux. These weak definitions are
           * linked from kernel/built-in.o. If the tree later links a real strong
           * implementation, the strong one will win.
           */
          #include <linux/types.h>
          #include <linux/kernel.h>
          #include <linux/string.h>
          #include <linux/siphash.h>

          #ifndef __weak
          #define __weak __attribute__((weak))
          #endif

          #ifndef rol65
          #define rol65(x, n) (((x) << (n)) | ((x) >> (64 - (n))))
          #endif

          #define KSU_SIPHASH_ROUND do { \
              v0 += v1; v1 = rol65(v1, 13); v1 ^= v0; v0 = rol65(v0, 32); \
              v2 += v3; v3 = rol65(v3, 16); v3 ^= v2; \
              v0 += v3; v3 = rol65(v3, 21); v3 ^= v0; \
              v2 += v1; v1 = rol65(v1, 17); v1 ^= v2; v2 = rol65(v2, 32); \
          } while (0)

          static inline u64 ksu_get_unaligned_le64_l62(const void *p)
          {
              const u8 *b = p;
              return ((u64)b[0]) | ((u64)b[1] << 8) | ((u64)b[2] << 16) | ((u64)b[3] << 24) |
                     ((u64)b[4] << 32) | ((u64)b[5] << 40) | ((u64)b[6] << 48) | ((u64)b[7] << 56);
          }

          __weak u64 __siphash_aligned(const void *data, size_t len, const siphash_key_t *key)
          {
              const u8 *in = data;
              const u64 *k = (const u64 *)key;
              u64 k0 = k[0];
              u64 k1 = k[1];
              u64 v0 = 0x736f6d6570736575ULL ^ k0;
              u64 v1 = 0x646f72616e646f6dULL ^ k1;
              u64 v2 = 0x6c7967656e657261ULL ^ k0;
              u64 v3 = 0x7465646279746573ULL ^ k1;
              u64 b = ((u64)len) << 56;
              u64 m;

              while (len >= 8) {
                  m = ksu_get_unaligned_le64_l62(in);
                  v3 ^= m;
                  KSU_SIPHASH_ROUND;
                  KSU_SIPHASH_ROUND;
                  v0 ^= m;
                  in += 8;
                  len -= 8;
              }

              switch (len) {
              case 7: b |= ((u64)in[6]) << 48;
              case 6: b |= ((u64)in[5]) << 40;
              case 5: b |= ((u64)in[4]) << 32;
              case 4: b |= ((u64)in[3]) << 24;
              case 3: b |= ((u64)in[2]) << 16;
              case 2: b |= ((u64)in[1]) << 8;
              case 1: b |= ((u64)in[0]);
              default: break;
              }

              v3 ^= b;
              KSU_SIPHASH_ROUND;
              KSU_SIPHASH_ROUND;
              v0 ^= b;
              v2 ^= 0xff;
              KSU_SIPHASH_ROUND;
              KSU_SIPHASH_ROUND;
              KSU_SIPHASH_ROUND;
              KSU_SIPHASH_ROUND;
              return v0 ^ v1 ^ v2 ^ v3;
          }

          __weak u64 siphash_3u32(const u32 a, const u32 b, const u32 c, const siphash_key_t *key)
          {
              u32 data[3] = { a, b, c };
              return __siphash_aligned(data, sizeof(data), key);
          }

          __weak u64 siphash_4u64(const u64 a, const u64 b, const u64 c, const u64 d, const siphash_key_t *key)
          {
              u64 data[4] = { a, b, c, d };
              return __siphash_aligned(data, sizeof(data), key);
          }
          EOF_SIPHASH_COMPAT

          if grep -q "KSU_NEXT_SIPHASH_COMPAT_L62" kernel/Makefile; then
            echo "kernel/Makefile already has KSU_NEXT_SIPHASH_COMPAT_L62" | tee -a "$LOG"
          else
            {
              echo ""
              echo "# KSU_NEXT_SIPHASH_COMPAT_L62: provide weak siphash symbols for net/built-in.o link."
              echo "obj-y += siphash_compat_l62.o"
            } >> kernel/Makefile
            echo "[PATCH] kernel/Makefile: obj-y += siphash_compat_l62.o" | tee -a "$LOG"
          fi

          # Keep previous safer hints too, but do not rely on them. This helps if the
          # tree has an official CONFIG_SIPHASH path while the compat object remains weak.
          if grep -Rqs "config SIPHASH" lib Kconfig crypto net; then
            echo "CONFIG_SIPHASH=y" >> arch/arm64/configs/$TEMP_DEFCONFIG
            echo "[PATCH] TEMP_DEFCONFIG: appended CONFIG_SIPHASH=y" | tee -a "$LOG"
          else
            echo "No CONFIG_SIPHASH Kconfig entry found; weak kernel object is the active fix" | tee -a "$LOG"
          fi

          echo "===== kernel/Makefile siphash lines after fix =====" | tee -a "$LOG"
          grep -n "siphash_compat_l62\|KSU_NEXT_SIPHASH_COMPAT_L62" kernel/Makefile | tee -a "$LOG" || true
          echo "===== compat source preview =====" | tee -a "$LOG"
          ls -lah kernel/siphash_compat_l62.c | tee -a "$LOG"
          grep -n "__siphash_aligned\|siphash_3u32\|siphash_4u64\|__weak" kernel/siphash_compat_l62.c | tee -a "$LOG" || true

          echo "SipHash weak compat link fix L62 completed" | tee -a "$LOG"

      - name: Apply S9 random uptime 15-20 days safe timekeeping patch v98
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          echo "===== APPLY S9 RANDOM UPTIME 15-20 DAYS SAFE TIMEKEEPING PATCH V98 ====="
          mkdir -p scripts

          # Pick one fixed random value per workflow run. This avoids early-boot
          # kernel RNG dependencies and keeps the selected value visible in the artifact log.
          RANDOM_UPTIME_DAYS="$(python3 - <<'PYRANDOM'
          import random
          print(random.randint(15, 20))
          PYRANDOM
          )"
          export RANDOM_UPTIME_DAYS

          cat > scripts/ci_apply_s9_random_uptime_v98.py <<'PY'
          from pathlib import Path
          import os
          import re

          ROOT = Path(".")
          TIMEKEEPING = ROOT / "kernel/time/timekeeping.c"
          REPORT = ROOT / "s9-random-uptime-v98-report.txt"

          MIN_DAYS = 15
          MAX_DAYS = 20
          DAYS = int(os.environ.get("RANDOM_UPTIME_DAYS", "17"))

          if DAYS < MIN_DAYS or DAYS > MAX_DAYS:
              raise SystemExit(f"ERROR: RANDOM_UPTIME_DAYS out of range: {DAYS}")

          def die(msg):
              raise SystemExit("ERROR: " + msg)

          def read(path):
              if not path.exists():
                  die(f"missing {path}")
              return path.read_text(errors="ignore")

          def write(path, data):
              path.write_text(data)

          txt = read(TIMEKEEPING)
          orig = txt

          # Remove old broken/experimental uptime hooks from previous attempts if this
          # workflow is rerun on a branch that already contains them.
          txt = re.sub(
              r"\n/\* S9_RANDOM_UPTIME_V98_START \*/.*?/\* S9_RANDOM_UPTIME_V98_END \*/\n",
              "\n",
              txt,
              flags=re.S,
          )
          txt = re.sub(
              r"\n/\* S9_GHOST_UPTIME_[^*]*START \*/.*?/\* S9_GHOST_UPTIME_[^*]*END \*/\n",
              "\n",
              txt,
              flags=re.S,
          )
          txt = re.sub(
              r"\n\s*s9_random_uptime_apply_boot_offset\(tk\);\s*\n",
              "\n",
              txt,
          )
          txt = re.sub(
              r"\n\s*ghost_uptime_[a-zA-Z0-9_]+\([^;]*\);\s*\n",
              "\n",
              txt,
          )

          # The uploaded v94 YAML used broad proc/sys/VDSO hooks. This v98 patch does
          # not copy those hooks. It only shifts tk->offs_boot once in timekeeping_init()
          # after tk_setup_internals() and before timekeeping_update(), so VDSO offset
          # data is naturally refreshed by the normal timekeeping path. CLOCK_REALTIME
          # and wall clock remain untouched.
          marker = f"""
          /* S9_RANDOM_UPTIME_V98_START */
          #define S9_RANDOM_UPTIME_MIN_DAYS 15ULL
          #define S9_RANDOM_UPTIME_MAX_DAYS 20ULL
          #define S9_RANDOM_UPTIME_SELECTED_DAYS {DAYS}ULL
          #define S9_RANDOM_UPTIME_OFFSET_NS (S9_RANDOM_UPTIME_SELECTED_DAYS * 86400ULL * NSEC_PER_SEC)

          static void __init s9_random_uptime_apply_boot_offset(struct timekeeper *tk)
          {{
          	tk->offs_boot = ktime_add(tk->offs_boot,
          				   ns_to_ktime(S9_RANDOM_UPTIME_OFFSET_NS));
          	pr_info("s9_random_uptime_v98: CLOCK_BOOTTIME offset +%llu days (%llu ns)\\n",
          		(unsigned long long)S9_RANDOM_UPTIME_SELECTED_DAYS,
          		(unsigned long long)S9_RANDOM_UPTIME_OFFSET_NS);
          }}
          /* S9_RANDOM_UPTIME_V98_END */
          """

          insert_anchor = "static struct timekeeper shadow_timekeeper;"
          if insert_anchor not in txt:
              die("cannot find shadow_timekeeper anchor in kernel/time/timekeeping.c")
          txt = txt.replace(insert_anchor, insert_anchor + "\n" + marker, 1)

          init_anchor = "tk->raw_sec = 0;"
          if init_anchor not in txt:
              die("cannot find tk->raw_sec initialization anchor in timekeeping_init")
          txt = txt.replace(
              init_anchor,
              init_anchor + "\n\ts9_random_uptime_apply_boot_offset(tk);",
              1,
          )

          # Safety checks: reject known broken v94-style direct hooks.
          banned_patterns = {
              "ghost header include": "ghost_uptime.h",
              "ghost module": "ghost_uptime.c",
              "ghost function": "ghost_uptime_",
              "unsafe vdso marker": "S9_GHOST_UPTIME_VDSO",
              "direct vdso btm patch": "vdso_data->btm_sec = btm.tv_sec +",
              "delta-cycle fake": "return delta +",
          }
          for label, pattern in banned_patterns.items():
              if pattern in txt:
                  die(f"banned old uptime pattern remains in timekeeping.c: {label} / {pattern}")

          if txt.count("S9_RANDOM_UPTIME_V98_START") != 1:
              die("random uptime marker count is not exactly 1")
          if txt.count("s9_random_uptime_apply_boot_offset(tk);") != 1:
              die("boot offset apply call count is not exactly 1")
          if "tk->raw_sec = 0;\n\ts9_random_uptime_apply_boot_offset(tk);" not in txt:
              die("timekeeping_init apply call is not anchored after tk->raw_sec")
          if "ktime_add(tk->offs_boot" not in txt or "ns_to_ktime(S9_RANDOM_UPTIME_OFFSET_NS)" not in txt:
              die("central offs_boot shift is missing")

          write(TIMEKEEPING, txt)

          report = []
          report.append("S9 random uptime v98 safe patch")
          report.append("range_days=15..20")
          report.append(f"selected_days={DAYS}")
          report.append(f"selected_seconds={DAYS * 86400}")
          report.append(f"selected_ns={DAYS * 86400 * 1000000000}")
          report.append("patch_surface=kernel/time/timekeeping.c only")
          report.append("method=add selected offset to tk->offs_boot once in timekeeping_init after tk->raw_sec=0")
          report.append("expected_android_surface=CLOCK_BOOTTIME / SystemClock.elapsedRealtime / /proc/uptime")
          report.append("wall_clock=CLOCK_REALTIME unchanged")
          report.append("not_used=old v94 ghost_uptime proc/sys/stat hooks")
          report.append("not_used=old v94 direct arch/arm64/kernel/vdso.c btm hook")
          report.append(f"timekeeping_changed={txt != orig}")
          REPORT.write_text("\\n".join(report) + "\\n")
          print(REPORT.read_text())
          PY

          python3 scripts/ci_apply_s9_random_uptime_v98.py

          echo "===== VERIFY S9 RANDOM UPTIME V98 ====="
          cat s9-random-uptime-v98-report.txt
          grep -RniE "S9_RANDOM_UPTIME_V98|s9_random_uptime_apply_boot_offset|S9_RANDOM_UPTIME_SELECTED_DAYS|tk->raw_sec = 0|ktime_add\\(tk->offs_boot" \
            kernel/time/timekeeping.c 2>/dev/null || true

          echo "===== OLD UPTIME PATCH SAFETY CHECK ====="
          if grep -RniE "ghost_uptime|S9_GHOST_UPTIME|VDSO_BTM|return[[:space:]]+delta[[:space:]]*\\+" \
            kernel/time/timekeeping.c arch/arm64/kernel/vdso.c fs/proc/uptime.c fs/proc/stat.c kernel/sys.c include/linux kernel 2>/dev/null; then
            echo "ERROR: old/broken v94 uptime hook marker found; refusing build"
            exit 1
          fi

          echo "===== WIFI/BOOTTIME SAFE MODE V98 =====" | tee s9-wifi-safe-v98-report.txt
          echo "v98 does not patch arch/arm64/kernel/vdso.c directly." | tee -a s9-wifi-safe-v98-report.txt
          echo "v98 does not patch fs/stat.c, fs/proc/uptime.c, fs/proc/stat.c, or kernel/sys.c directly." | tee -a s9-wifi-safe-v98-report.txt
          echo "Only tk->offs_boot is shifted once during timekeeping_init after tk->raw_sec=0 by the selected random build-time offset." | tee -a s9-wifi-safe-v98-report.txt
          echo "Selected random uptime days: ${RANDOM_UPTIME_DAYS}" | tee -a s9-wifi-safe-v98-report.txt

          cp -f s9-random-uptime-v98-report.txt ../s9-random-uptime-v98-report.txt
          cp -f s9-wifi-safe-v98-report.txt ../s9-wifi-safe-v98-report.txt


      - name: Patch S9 Broadcom DHD PCIe runtime PM stability v98
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          echo "===== PATCH S9 BROADCOM DHD PCIE RUNTIME PM STABILITY V98 ====="
          mkdir -p scripts

          cat > scripts/ci_patch_s9_wifi_pcie_stable_v98.py <<'PY'
          from pathlib import Path
          import re

          ROOT = Path(".")
          REPORT = ROOT / "s9-wifi-pcie-stable-v98-report.txt"
          LOG = ROOT / "s9-wifi-pcie-stable-v98-apply.log"

          report = []
          log = []

          def add(msg):
              print(msg)
              log.append(msg)

          def read(path):
              return path.read_text(errors="ignore")

          def write(path, data):
              path.write_text(data)

          # The uploaded failure logs point to:
          #   DHD runtime PM enters PCIe D3
          #   exynos pcie linkdown
          #   dhdpcie_linkdown_cb sends HANG
          #   Android WifiNative triggers recovery/disable
          #
          # So the safest kernel-side mitigation is to block the Broadcom DHD PCIe
          # runtime D3 suspend path while leaving normal WiFi scan/connect/DHCP and
          # Android framework recovery paths untouched.
          candidates = []
          for root in [
              ROOT / "drivers",
              ROOT / "net",
              ROOT / "arch/arm64",
          ]:
              if root.exists():
                  for p in root.rglob("*"):
                      if p.is_file() and p.suffix in [".c", ".h"]:
                          try:
                              s = read(p)
                          except Exception:
                              continue
                          if any(x in s for x in [
                              "dhdpcie_bus_suspend",
                              "DHD Runtime PM Enabled",
                              "dhd_runtimepm_state",
                              "dhdpcie_linkdown_cb",
                              "H2D_HOST_D3_INFORM",
                              "D3_ACK",
                          ]):
                              candidates.append(p)

          add(f"candidate_files={len(candidates)}")
          for p in candidates[:200]:
              add(f"candidate={p}")

          patched_files = []
          bus_suspend_patched = False

          guard = """#ifdef S9_WIFI_PM_STABLE_V98
          \tDHD_ERROR((\"S9_WIFI_PM_STABLE_V98: skip Broadcom DHD PCIe runtime D3 suspend to avoid linkdown/HANG\\n\"));
          \treturn 0;
          #endif /* S9_WIFI_PM_STABLE_V98 */
          """

          for p in candidates:
              s = read(p)
              if "S9_WIFI_PM_STABLE_V98" in s:
                  patched_files.append(str(p))
                  if "skip Broadcom DHD PCIe runtime D3 suspend" in s:
                      bus_suspend_patched = True
                  continue

              # Prefer inserting inside the suspend branch immediately before the
              # vendor log line "Entering suspend state". This avoids C89 mixed
              # declaration problems because the original function has already
              # completed declarations before logging/branch code.
              if "dhdpcie_bus_suspend" in s and "Entering suspend state" in s:
                  lines = s.splitlines(True)
                  out = []
                  changed = False
                  for line in lines:
                      if (not changed) and ("Entering suspend state" in line):
                          indent = re.match(r"^(\s*)", line).group(1)
                          block = "".join(indent + x if x.strip() else x for x in guard.splitlines(True))
                          out.append(block)
                          changed = True
                      out.append(line)
                  if changed:
                      s2 = "".join(out)
                      write(p, s2)
                      patched_files.append(str(p))
                      bus_suspend_patched = True
                      add(f"[PATCH] {p}: inserted runtime D3 suspend guard before Entering suspend state")
                      continue

              # Fallback: insert near the start of dhdpcie_bus_suspend() body only
              # if the exact log anchor is absent. This is less ideal but still only
              # touches the DHD PCIe suspend function.
              if "dhdpcie_bus_suspend" in s:
                  pattern = re.compile(r"(\n[^\n;{}]*\bdhdpcie_bus_suspend\s*\([^;{}]*\)\s*\{\n)", re.S)
                  if pattern.search(s):
                      def repl(m):
                          return m.group(1) + guard
                      s2 = pattern.sub(repl, s, count=1)
                      if s2 != s:
                          write(p, s2)
                          patched_files.append(str(p))
                          bus_suspend_patched = True
                          add(f"[PATCH] {p}: inserted fallback runtime D3 suspend guard at function entry")
                          continue

          # Add a compiler marker only if the source guard was inserted.
          if bus_suspend_patched:
              mk_files = [ROOT / "drivers/net/wireless/Makefile", ROOT / "drivers/Makefile"]
              added_flag = False
              for mk in mk_files:
                  if mk.exists():
                      mt = read(mk)
                      if "S9_WIFI_PM_STABLE_V98" not in mt:
                          mt += "\n# S9_WIFI_PM_STABLE_V98: keep Broadcom DHD PCIe out of runtime D3 on S9 PixelExp A12\n"
                          mt += "KBUILD_CFLAGS += -DS9_WIFI_PM_STABLE_V98\n"
                          write(mk, mt)
                          add(f"[PATCH] {mk}: added -DS9_WIFI_PM_STABLE_V98")
                      else:
                          add(f"[OK] {mk}: S9_WIFI_PM_STABLE_V98 flag already present")
                      added_flag = True
                      break
              if not added_flag:
                  mk = ROOT / "Makefile"
                  mt = read(mk)
                  if "S9_WIFI_PM_STABLE_V98" not in mt:
                      mt += "\n# S9_WIFI_PM_STABLE_V98: keep Broadcom DHD PCIe out of runtime D3 on S9 PixelExp A12\n"
                      mt += "KBUILD_CFLAGS += -DS9_WIFI_PM_STABLE_V98\n"
                      write(mk, mt)
                      add(f"[PATCH] {mk}: added -DS9_WIFI_PM_STABLE_V98 fallback")
                  else:
                      add(f"[OK] {mk}: S9_WIFI_PM_STABLE_V98 fallback flag already present")

          report.append("S9 WiFi PCIe stable patch v98")
          report.append("reason=logs show DHD runtime PM D3 suspend followed by Exynos PCIe linkdown, dhdpcie HANG, WifiNative failure, then framework disables WiFi")
          report.append("mitigation=block Broadcom DHD PCIe runtime D3 suspend path")
          report.append("patched_files=" + ",".join(patched_files))
          report.append(f"bus_suspend_patched={bus_suspend_patched}")
          report.append("not_patched=WiFi framework,wificond,vendor HAL,DHCP,SSID credentials,alarm timers,CLOCK_MONOTONIC,CLOCK_REALTIME")
          report.append("not_masking=dhdpcie_linkdown_cb HANG is not hidden; the patch tries to prevent the PCIe linkdown cause")
          report.append("expected_log_absent_after_flash=dhdpcie_bus_suspend: Entering suspend state")
          report.append("expected_log_absent_after_flash=send H2D_HOST_D3_INFORM to dongle")
          report.append("expected_log_absent_after_flash=exynos-pcie 116a0000.pcie0: link down")
          report.append("expected_log_absent_after_flash=dhdpcie_linkdown_cb: Event HANG send up due to PCIe linkdown")

          if not bus_suspend_patched:
              report.append("ERROR=no DHD PCIe runtime suspend guard was applied")
              REPORT.write_text("\n".join(report) + "\n")
              LOG.write_text("\n".join(log) + "\n")
              raise SystemExit("ERROR: Could not patch DHD PCIe runtime suspend guard. See s9-wifi-pcie-stable-v98-apply.log")

          REPORT.write_text("\n".join(report) + "\n")
          LOG.write_text("\n".join(log) + "\n")
          print(REPORT.read_text())
          PY

          python3 scripts/ci_patch_s9_wifi_pcie_stable_v98.py 2>&1 | tee s9-wifi-pcie-stable-v98-apply.stdout.log

          echo "===== VERIFY WIFI PCIE STABLE V98 PATCH ====="
          cat s9-wifi-pcie-stable-v98-report.txt
          grep -RniE "S9_WIFI_PM_STABLE_V98|skip Broadcom DHD PCIe runtime D3 suspend|dhdpcie_bus_suspend|Entering suspend state|H2D_HOST_D3_INFORM|dhdpcie_linkdown_cb" \
            drivers net arch/arm64 2>/dev/null | head -500 | tee s9-wifi-pcie-stable-v98-markers.txt || true

          cp -f s9-wifi-pcie-stable-v98-report.txt ../s9-wifi-pcie-stable-v98-report.txt
          cp -f s9-wifi-pcie-stable-v98-apply.log ../s9-wifi-pcie-stable-v98-apply.log
          cp -f s9-wifi-pcie-stable-v98-markers.txt ../s9-wifi-pcie-stable-v98-markers.txt

      - name: Prepare defconfig
        shell: bash
        working-directory: kernel
        run: |
          set -e

          CONFIG_DIR="arch/arm64/configs"
          BASE_DEFCONFIG="$CONFIG_DIR/exynos9810_defconfig"
          DEVICE_CONFIG="$CONFIG_DIR/$DEVICE_DEFCONFIG"
          TEMP_CONFIG="$CONFIG_DIR/$TEMP_DEFCONFIG"

          if [ ! -f "$DEVICE_CONFIG" ]; then
            echo "Missing device defconfig: $DEVICE_CONFIG"
            exit 1
          fi

          rm -f "$TEMP_CONFIG"

          if [ -s "$BASE_DEFCONFIG" ]; then
            cat "$BASE_DEFCONFIG" > "$TEMP_CONFIG"
            printf '\n' >> "$TEMP_CONFIG"
            cat "$DEVICE_CONFIG" >> "$TEMP_CONFIG"
          else
            cp -f "$DEVICE_CONFIG" "$TEMP_CONFIG"
          fi

          printf '\n# GitHub Actions target: %s %s Pixel Experience Android 12 with Samsung Q vendor\n' "$DEVICE" "$MODEL_NAME" >> "$TEMP_CONFIG"

          cat >> "$TEMP_CONFIG" <<'EOF'

          # KernelSU Next official legacy v57 SuSFS Bridge L62 manual hook
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KSU_KPROBES_HOOK is not set
          # CONFIG_KSU_KPROBE_HOOKS is not set

          # SuSFS level 1: keep useful core features, disable risky/extra features first
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          # CONFIG_KSU_SUSFS_ENABLE_LOG is not set
          # CONFIG_KSU_SUSFS_SUS_OVERLAYFS is not set
          # CONFIG_KSU_SUSFS_SPOOF_UNAME is not set
          # CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG is not set
          # CONFIG_KSU_SUSFS_OPEN_REDIRECT is not set
          # CONFIG_KSU_SUSFS_SUS_SU is not set
          EOF

          echo "===== TEMP DEFCONFIG ====="
          ls -lah "$TEMP_CONFIG"
          tail -80 "$TEMP_CONFIG" || true

      - name: Build kernel and dtb.img
        shell: bash
        working-directory: kernel
        run: |
          set -eo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC="clang --target=aarch64-linux-gnu --prefix=/usr/bin/aarch64-linux-gnu- -no-integrated-as"
          export HOSTCC=gcc
          export HOSTCXX=g++
          export AS=aarch64-linux-gnu-as
          export LD=aarch64-linux-gnu-ld.bfd
          export AR=aarch64-linux-gnu-ar
          export NM=aarch64-linux-gnu-nm
          export OBJCOPY=aarch64-linux-gnu-objcopy
          export OBJDUMP=aarch64-linux-gnu-objdump
          export STRIP=aarch64-linux-gnu-strip
          export READELF=aarch64-linux-gnu-readelf
          export PLATFORM_VERSION="$PLATFORM_VERSION"
          export ANDROID_MAJOR_VERSION="$ANDROID_MAJOR_VERSION"
          export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          export KBUILD_BUILD_USER=khiconjk
          export KBUILD_BUILD_HOST=github-actions

          MAKE_ARGS=(
            V=0
            ARCH=arm64
            SUBARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
            "CC=clang --target=aarch64-linux-gnu --prefix=/usr/bin/aarch64-linux-gnu- -no-integrated-as"
            HOSTCC=gcc
            HOSTCXX=g++
            AS=aarch64-linux-gnu-as
            LD=aarch64-linux-gnu-ld.bfd
            AR=aarch64-linux-gnu-ar
            NM=aarch64-linux-gnu-nm
            OBJCOPY=aarch64-linux-gnu-objcopy
            OBJDUMP=aarch64-linux-gnu-objdump
            STRIP=aarch64-linux-gnu-strip
            READELF=aarch64-linux-gnu-readelf
            PLATFORM_VERSION="$PLATFORM_VERSION"
            ANDROID_MAJOR_VERSION="$ANDROID_MAJOR_VERSION"
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          )

          echo "===== COMPILER TEST ====="
          clang --target=aarch64-linux-gnu --prefix=/usr/bin/aarch64-linux-gnu- -no-integrated-as -x c -c /dev/null -o /tmp/clang-arm64-test.o
          file /tmp/clang-arm64-test.o

          echo "===== DEFCONFIG ====="
          make "${MAKE_ARGS[@]}" "$TEMP_DEFCONFIG" 2>&1 | tee defconfig.log

          echo "===== OLDDEFCONFIG ====="
          make "${MAKE_ARGS[@]}" olddefconfig 2>&1 | tee olddefconfig.log

          echo "===== HARD REPAIR KSU/SUSFS CONFIG AFTER OLDDEFCONFIG L62 ====="
          if [ -f "drivers/kernelsu/Kconfig" ]; then
            if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then
              if grep -q '^endmenu' drivers/Kconfig; then
                sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
              else
                printf '\nsource "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig
              fi
              echo "[PATCH] drivers/Kconfig: re-added source drivers/kernelsu/Kconfig"
            else
              echo "[OK] drivers/Kconfig already sources drivers/kernelsu/Kconfig"
            fi

            if ! grep -q 'kernelsu/' drivers/Makefile; then
              printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
              echo "[PATCH] drivers/Makefile: re-added obj-$(CONFIG_KSU) += kernelsu/"
            else
              echo "[OK] drivers/Makefile already includes kernelsu/"
            fi
          else
            echo "[WARN] drivers/kernelsu/Kconfig missing before config force"
          fi

          python3 - <<'PYCONFIG'
          from pathlib import Path
          p = Path('.config')
          if not p.exists():
              raise SystemExit('ERROR: .config missing before hard repair')
          text = p.read_text(errors='ignore').splitlines()
          set_y = {
              'CONFIG_KSU',
              'CONFIG_KSU_MANUAL_HOOK',
              'CONFIG_KSU_SUSFS',
              'CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT',
              'CONFIG_KSU_SUSFS_SUS_PATH',
              'CONFIG_KSU_SUSFS_SUS_MOUNT',
              'CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT',
              'CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT',
              'CONFIG_KSU_SUSFS_SUS_KSTAT',
              'CONFIG_KSU_SUSFS_TRY_UMOUNT',
              'CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT',
              'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS',
          }
          set_n = {
              'CONFIG_KSU_DEBUG',
              'CONFIG_KSU_DISABLE_MANAGER',
              'CONFIG_KSU_DISABLE_POLICY',
              'CONFIG_KSU_ALLOWLIST_WORKAROUND',
              'CONFIG_KSU_KPROBES_HOOK',
              'CONFIG_KSU_KPROBE_HOOKS',
              'CONFIG_KSU_SUSFS_ENABLE_LOG',
              'CONFIG_KSU_SUSFS_SUS_OVERLAYFS',
              'CONFIG_KSU_SUSFS_SPOOF_UNAME',
              'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG',
              'CONFIG_KSU_SUSFS_OPEN_REDIRECT',
              'CONFIG_KSU_SUSFS_SUS_SU',
          }
          keys = set_y | set_n
          out = []
          for line in text:
              stripped = line.strip()
              key = None
              if stripped.startswith('CONFIG_') and '=' in stripped:
                  key = stripped.split('=', 1)[0]
              elif stripped.startswith('# CONFIG_') and stripped.endswith(' is not set'):
                  key = stripped.split()[1]
              if key in keys:
                  continue
              out.append(line)
          out.append('')
          out.append('# KSU/SuSFS hard repair L62 after olddefconfig')
          for k in sorted(set_y):
              out.append(f'{k}=y')
          for k in sorted(set_n):
              out.append(f'# {k} is not set')
          p.write_text('\n'.join(out) + '\n')
          print('[PATCH] .config: force-wrote KSU/SuSFS options L62')
          PYCONFIG

          echo "===== OLDDEFCONFIG AFTER KSU/SUSFS HARD REPAIR L62 ====="
          make "${MAKE_ARGS[@]}" olddefconfig 2>&1 | tee -a olddefconfig.log

          echo "===== CONFIG CHECK ====="
          grep -E "CONFIG_SOC_EXYNOS9810|CONFIG_CAMERA_STAR|CONFIG_CAMERA_STAR2|CONFIG_CAMERA_CROWN|CONFIG_EXYNOS_DTBTOOL|CONFIG_BUILD_ARM64_APPENDED|CONFIG_MODULES|CONFIG_ANDROID|CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS|CONFIG_KSU_KPROBES_HOOK|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS" .config || true

          if ! grep -q "^CONFIG_KSU=y" .config; then
            echo "ERROR: CONFIG_KSU was not enabled"
            exit 1
          fi

          if ! grep -q "^CONFIG_KSU_MANUAL_HOOK=y" .config; then
            echo "ERROR: CONFIG_KSU_MANUAL_HOOK was not enabled"
            exit 1
          fi
          if ! grep -q "^CONFIG_KSU_SUSFS=y" .config; then
            echo "ERROR: CONFIG_KSU_SUSFS was not enabled"
            grep -n "KSU_SUSFS" .config || true
            exit 1
          fi

          if [ ! -f fs/susfs.c ] || [ ! -f include/linux/susfs.h ]; then
            echo "ERROR: SuSFS files missing before build"
            ls -lah fs/susfs.c include/linux/susfs.h 2>/dev/null || true
            exit 1
          fi

          if ! grep -q "ksu_handle_sys_reboot" kernel/reboot.c; then
            echo "ERROR: manual reboot hook marker missing; KernelSU-Next Kbuild will reject manual mode"
            exit 1
          fi

          echo "===== BUILD IMAGE + DTBS + DTB.IMG ====="
          make -j"$(nproc --all)" "${MAKE_ARGS[@]}" Image Image.gz dtbs dtb.img 2>&1 | tee build.log

          echo "===== IF dtb.img IS STILL MISSING, TRY dtb.img AGAIN WITH V=1 ====="
          if [ ! -f "arch/arm64/boot/dtb.img" ]; then
            make -j"$(nproc --all)" "${MAKE_ARGS[@]}" V=1 dtb.img 2>&1 | tee -a build.log
          fi

          echo "===== OUTPUTS ====="
          ls -lah arch/arm64/boot || true
          find arch/arm64/boot -maxdepth 8 -type f \( -name "Image*" -o -name "*.dtb" -o -name "dtb.img" -o -name "*.ko" \) -print -exec ls -lh {} \; || true

      - name: Build v98 clock and uptime diagnostic probe
        shell: bash
        working-directory: kernel
        run: |
          set -e

          OUT_DIR="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT_DIR"

          cat > "$OUT_DIR/v98-uptime-probe.c" <<'EOF_CPROBE'
          #define _GNU_SOURCE
          #include <errno.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <time.h>
          #include <unistd.h>
          #include <sys/sysinfo.h>

          #ifndef CLOCK_MONOTONIC_RAW
          #define CLOCK_MONOTONIC_RAW 4
          #endif
          #ifndef CLOCK_BOOTTIME
          #define CLOCK_BOOTTIME 7
          #endif

          static double ts_sec(struct timespec ts) {
              return (double)ts.tv_sec + (double)ts.tv_nsec / 1000000000.0;
          }

          static double read_proc_uptime_first(double *idle_out) {
              FILE *f = fopen("/proc/uptime", "r");
              double up = -1.0, idle = -1.0;
              if (!f) return -1.0;
              if (fscanf(f, "%lf %lf", &up, &idle) != 2) up = -1.0;
              fclose(f);
              if (idle_out) *idle_out = idle;
              return up;
          }

          static long long read_btime(void) {
              FILE *f = fopen("/proc/stat", "r");
              char line[512];
              long long b = -1;
              if (!f) return -1;
              while (fgets(line, sizeof(line), f)) {
                  if (sscanf(line, "btime %lld", &b) == 1) break;
              }
              fclose(f);
              return b;
          }

          int main(void) {
              printf("===== V98 native uptime surface probe =====\n");
              printf("pid=%ld uid=%ld\n", (long)getpid(), (long)getuid());
              printf("CLOCK ids: REALTIME=%d MONOTONIC=%d MONOTONIC_RAW=%d BOOTTIME=%d\n",
                     CLOCK_REALTIME, CLOCK_MONOTONIC, CLOCK_MONOTONIC_RAW, CLOCK_BOOTTIME);

              for (int i = 0; i < 6; ++i) {
                  struct timespec rt = {0}, mono = {0}, raw = {0}, boot = {0};
                  struct sysinfo si;
                  double idle = -1.0;
                  double proc_up = read_proc_uptime_first(&idle);
                  long long btime = read_btime();
                  time_t now = time(NULL);
                  int er = 0;

                  er |= clock_gettime(CLOCK_REALTIME, &rt);
                  er |= clock_gettime(CLOCK_MONOTONIC, &mono);
                  er |= clock_gettime(CLOCK_MONOTONIC_RAW, &raw);
                  er |= clock_gettime(CLOCK_BOOTTIME, &boot);
                  memset(&si, 0, sizeof(si));
                  if (sysinfo(&si) != 0) si.uptime = -1;

                  printf("\n--- sample %d ---\n", i + 1);
                  printf("CLOCK_REALTIME      %.9f\n", ts_sec(rt));
                  printf("CLOCK_MONOTONIC     %.9f\n", ts_sec(mono));
                  printf("CLOCK_MONOTONIC_RAW %.9f\n", ts_sec(raw));
                  printf("CLOCK_BOOTTIME      %.9f\n", ts_sec(boot));
                  printf("sysinfo.uptime      %ld\n", (long)si.uptime);
                  printf("/proc/uptime        %.2f %.2f\n", proc_up, idle);
                  printf("/proc/stat btime    %lld\n", btime);
                  printf("time(NULL)          %lld\n", (long long)now);
                  printf("date_minus_btime    %lld\n", btime > 0 ? (long long)now - btime : -1LL);
                  printf("diff proc-boot      %.6f\n", proc_up - ts_sec(boot));
                  printf("diff proc-mono      %.6f\n", proc_up - ts_sec(mono));
                  printf("diff boot-mono      %.6f\n", ts_sec(boot) - ts_sec(mono));
                  printf("diff sysinfo-boot   %.6f\n", (double)si.uptime - ts_sec(boot));
                  printf("clock_errors_or     %d errno=%d(%s)\n", er, errno, strerror(errno));
                  fflush(stdout);
                  sleep(1);
              }
              return 0;
          }
          EOF_CPROBE

          sed -i 's/^          //' "$OUT_DIR/v98-uptime-probe.c"

          echo "===== BUILD ARM64 UPTIME PROBE V98 ====="
          PROBE_LOG="$OUT_DIR/v98-uptime-probe-build.log"
          : > "$PROBE_LOG"
          set +e
          aarch64-linux-gnu-gcc -O2 -static -Wall -Wextra "$OUT_DIR/v98-uptime-probe.c" -o "$OUT_DIR/v98-uptime-probe-arm64" -lrt >> "$PROBE_LOG" 2>&1
          RC=$?
          if [ "$RC" -ne 0 ]; then
            aarch64-linux-gnu-gcc -O2 -static -Wall -Wextra "$OUT_DIR/v98-uptime-probe.c" -o "$OUT_DIR/v98-uptime-probe-arm64" >> "$PROBE_LOG" 2>&1
            RC=$?
          fi
          set -e
          if [ "$RC" -eq 0 ] && [ -s "$OUT_DIR/v98-uptime-probe-arm64" ]; then
            file "$OUT_DIR/v98-uptime-probe-arm64" | tee -a "$PROBE_LOG"
            chmod +x "$OUT_DIR/v98-uptime-probe-arm64"
          else
            echo "[WARN] native clock probe build failed; shell diagnostic still works" | tee -a "$PROBE_LOG"
            cat > "$OUT_DIR/v98-uptime-probe-arm64.README.txt" <<'EOF_README'
          Native clock probe did not compile on the runner.
          Use v98-uptime-surface-check.bat for shell/proc/dumpsys/WiFi checks.
          EOF_README
          fi

          cat > "$OUT_DIR/v98-uptime-surface-check-device.sh" <<'EOF_SH'
          #!/system/bin/sh
          echo "===== V98 UPTIME/WIFI SURFACE CHECK DEVICE SH ====="
          echo "-- identity/kernel --"
          id
          uname -a

          echo "-- Pixel/AOSP ROM properties --"
          getprop ro.build.fingerprint
          getprop ro.vendor.build.fingerprint
          getprop ro.product.system.name
          getprop ro.product.system.device
          getprop ro.product.vendor.device
          getprop ro.build.version.release
          getprop ro.build.version.sdk
          getprop ro.boot.wificountrycode
          getprop | grep -iE 'wifi|wlan|vendor\.wifi|bcmdhd|dhd' 2>/dev/null || true

          echo "-- proc/sysinfo uptime surfaces --"
          cat /proc/uptime
          grep '^btime ' /proc/stat
          date +%s
          uptime

          echo "-- Android elapsedRealtime --"
          dumpsys alarm | grep -iE 'nowRTC|nowELAPSED|RuntimeStarted|Runtime uptime' || true

          echo "-- native clock probe --"
          if [ -x /data/local/tmp/v98-uptime-probe ]; then
            /data/local/tmp/v98-uptime-probe
          else
            echo "Missing /data/local/tmp/v98-uptime-probe"
          fi

          echo "-- WiFi service toggle --"
          svc wifi disable
          sleep 2
          svc wifi enable
          sleep 12
          cmd wifi status 2>/dev/null || true
          dumpsys wifi | head -180 2>/dev/null || true

          echo "-- network interfaces --"
          ls -la /sys/class/net 2>/dev/null || true
          ip link 2>/dev/null || true

          echo "-- dhd module parameters --"
          if [ -d /sys/module/dhd/parameters ]; then
            ls -la /sys/module/dhd/parameters
            for p in firmware_path nvram_path clm_path info_string op_mode fw_ap_select dhd_console_ms disable_proptx; do
              printf '%s=' "$p"
              cat "/sys/module/dhd/parameters/$p" 2>/dev/null || true
              echo
            done
          else
            echo "missing /sys/module/dhd/parameters"
          fi

          echo "-- WiFi firmware files --"
          for d in /vendor/etc/wifi /vendor/firmware /system/vendor/etc/wifi /odm/etc/wifi; do
            echo "DIR:$d"
            ls -la "$d" 2>/dev/null || true
          done

          echo "-- common Broadcom firmware names --"
          for f in \
            /vendor/etc/wifi/bcmdhd_sta.bin \
            /vendor/etc/wifi/bcmdhd_sta.bin_b0 \
            /vendor/etc/wifi/bcmdhd_sta.bin_b2 \
            /vendor/etc/wifi/bcmdhd_clm.blob \
            /vendor/etc/wifi/nvram_net.txt \
            /vendor/etc/wifi/nvram.txt_murata_r041_b2 \
            /vendor/etc/wifi/nvram.txt_r02a_b2 \
            /vendor/etc/wifi/nvram.txt_r02b_b2; do
            ls -la "$f" 2>/dev/null || echo "missing:$f"
          done

          echo "-- WiFi HAL/logcat recent --"
          logcat -d -b all -v time 2>/dev/null | grep -iE 'WifiHAL|WifiVendorHal|wificond|wpa_supplicant|hostapd|dhd|bcmdhd|firmware|nvram|clm|cfg80211|wlan0|p2p0|failed|denied|avc' | tail -320 || true

          echo "-- dmesg WiFi/KernelSU recent --"
          dmesg 2>/dev/null | grep -iE 's9_random_uptime|ksud|KernelSU|dhd|bcmdhd|wifi|wlan|firmware|nvram|clm|cfg80211|denied|avc' | tail -260 || true
          EOF_SH
          sed -i 's/^          //' "$OUT_DIR/v98-uptime-surface-check-device.sh"
          chmod +x "$OUT_DIR/v98-uptime-surface-check-device.sh"

          cat > "$OUT_DIR/v98-uptime-surface-check.bat" <<'EOF_BAT'
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          set ADB=adb
          if exist "D:\platform-tools\adb.exe" set ADB=D:\platform-tools\adb.exe
          set BIN=%~dp0v98-uptime-probe-arm64
          set DEVSH=%~dp0v98-uptime-surface-check-device.sh
          set LOG=%~dp0v98-uptime-surface-check.log

          echo ===== V98 UPTIME/WIFI SURFACE CHECK ===== > "%LOG%"
          echo Generated at: %DATE% %TIME% >> "%LOG%"
          echo ADB: %ADB% >> "%LOG%"
          echo. >> "%LOG%"

          echo ===== ADB DEVICES ===== >> "%LOG%"
          "%ADB%" devices >> "%LOG%" 2>&1
          echo. >> "%LOG%"

          if exist "%BIN%" (
            "%ADB%" push "%BIN%" /data/local/tmp/v98-uptime-probe >> "%LOG%" 2>&1
            "%ADB%" shell "chmod 755 /data/local/tmp/v98-uptime-probe" >> "%LOG%" 2>&1
          ) else (
            echo WARN: Missing native probe binary: %BIN% >> "%LOG%"
          )

          echo ===== PUSH/RUN DEVICE DIAGNOSTIC SCRIPT ===== >> "%LOG%"
          "%ADB%" push "%DEVSH%" /data/local/tmp/v98-uptime-surface-check-device.sh >> "%LOG%" 2>&1
          "%ADB%" shell "chmod 755 /data/local/tmp/v98-uptime-surface-check-device.sh" >> "%LOG%" 2>&1
          "%ADB%" shell "su -c /data/local/tmp/v98-uptime-surface-check-device.sh" >> "%LOG%" 2>&1
          echo. >> "%LOG%"

          type "%LOG%"
          echo.
          echo Saved log: "%LOG%"
          endlocal
          EOF_BAT

          sed -i 's/^          //' "$OUT_DIR/v98-uptime-surface-check.bat"

          ls -lh "$OUT_DIR"/v98-uptime-*

      - name: Show useful errors
        if: failure()
        shell: bash
        working-directory: kernel
        run: |
          echo "===== ERROR LINES ====="
          grep -nEi "error:|fatal error:|undefined reference|ld.lld|ld:|No such file|No rule to make target|FAILED|recipe for target|Stop\.|not found|Permission denied|unrecognized option|unknown argument|unsupported option|Illegal option|dtb.img" \
            clean.log defconfig.log olddefconfig.log build.log 2>/dev/null | tail -350 || true

          echo "===== LAST 350 BUILD LINES ====="
          tail -350 build.log 2>/dev/null || true

          echo "===== LAST 180 DEFCONFIG LINES ====="
          tail -180 defconfig.log 2>/dev/null || true

          echo "===== BOOT OUTPUT TREE ====="
          find arch/arm64/boot -maxdepth 8 -type f -print -exec ls -lh {} \; 2>/dev/null || true

      - name: Prepare failure diagnostics files
        if: failure()
        shell: bash
        working-directory: kernel
        run: |
          set +e
          touch build.log
          {
            echo "===== KernelSU config snapshot ====="
            if [ -f .config ]; then
              grep -E "CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS|CONFIG_KSU_KPROBES_HOOK|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS" .config || true
            else
              echo ".config not generated yet"
            fi
          } > KernelSU-config.txt
          {
            echo "===== SuSFS build info snapshot ====="
            echo "workflow=v98-q-ksu-susfs-random-uptime-15-20d"
            echo "date=$(date -u)"
            echo "DEVICE=${DEVICE:-unknown}"
            echo "MODEL_NAME=${MODEL_NAME:-unknown}"
            echo "KSU_ROOT=${KSU_ROOT:-unknown}"
            echo "KERNEL_PATCH=${KERNEL_PATCH:-unknown}"
            echo ""
            echo "--- available susfs logs ---"
            ls -lah susfs-*.log susfs-*.txt 2>/dev/null || true
            echo ""
            echo "--- susfs markers ---"
            grep -RIn "KSU_NEXT_SUSFS_BRIDGE_L62|CONFIG_KSU_SUSFS|config KSU_SUSFS|CMD_SUSFS|susfs" KernelSU-Next drivers/kernelsu fs include/linux 2>/dev/null | head -500 || true
          } > SuSFS-build-info.txt
          ls -lah build.log KernelSU-config.txt SuSFS-build-info.txt || true
          {
            echo "===== CHATGPT READABLE FAILURE LOG V98 ====="
            echo "date_utc=$(date -u)"
            echo "workflow=v98-q-ksu-susfs-random-uptime-15-20d"
            echo "repo=${GITHUB_REPOSITORY:-unknown}"
            echo "ref_to_build=${{ inputs.ref_to_build }}"
            echo "device=${DEVICE:-unknown}"
            echo "model=${MODEL_NAME:-unknown}"
            echo "platform=${PLATFORM_VERSION:-unknown} android_major=${ANDROID_MAJOR_VERSION:-unknown}"
            echo
            echo "===== LAST 220 BUILD LINES ====="
            tail -220 build.log 2>/dev/null || true
            echo
            echo "===== ERROR SUMMARY ====="
            grep -nEi "error:|fatal error:|undefined reference|ld.lld|ld:|No such file|No rule to make target|FAILED|recipe for target|Stop\.|not found|Permission denied|unrecognized option|unknown argument|unsupported option|Illegal option|dtb.img" \
              *.log 2>/dev/null | tail -300 || true
            echo
            echo "===== CONFIG SNAPSHOT ====="
            cat KernelSU-config.txt 2>/dev/null || true
            echo
            echo "===== RANDOM UPTIME/SUSFS REPORTS ====="
            cat s9-random-uptime-v98-report.txt 2>/dev/null || true
            cat s9-wifi-safe-v98-report.txt 2>/dev/null || true
            echo
            echo "===== WIFI PCIE STABLE V98 REPORT ====="
            cat s9-wifi-pcie-stable-v98-report.txt 2>/dev/null || true
            echo
            echo "===== WIFI PCIE STABLE V98 APPLY LOG ====="
            cat s9-wifi-pcie-stable-v98-apply.log 2>/dev/null || true
          } > ChatGPT-readable-build-log-v98.txt
          ls -lah ChatGPT-readable-build-log-v98.txt || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ss-S9-${{ steps.target.outputs.device }}-${{ steps.target.outputs.model }}-failure-diagnostics-v98-q-ksu-susfs-random-uptime
          path: |
            kernel/*.log
            kernel/*.txt
            kernel/.config
            kernel/**/*.rej
            kernel/**/*.orig
          if-no-files-found: ignore
          compression-level: 6

      - name: Collect kernel outputs
        shell: bash
        working-directory: kernel
        run: |
          set -e

          OUT_DIR="$GITHUB_WORKSPACE/out"
          RAW_DIR="$OUT_DIR/raw"

          mkdir -p "$RAW_DIR"

          echo "===== REQUIRED OUTPUT CHECK ====="

          if [ ! -f "arch/arm64/boot/Image" ]; then
            echo "ERROR: arch/arm64/boot/Image not found"
            find arch/arm64/boot -maxdepth 8 -type f -print || true
            exit 1
          fi

          if [ ! -f "arch/arm64/boot/dtb.img" ]; then
            echo "ERROR: arch/arm64/boot/dtb.img not found"
            echo "Available dtb files:"
            find arch/arm64/boot -maxdepth 8 -type f \( -name "*.dtb" -o -name "dtb.img" \) -print -exec ls -lh {} \; || true
            echo "CONFIG_EXYNOS_DTBTOOL:"
            grep -n "CONFIG_EXYNOS_DTBTOOL" .config || true
            exit 1
          fi

          cp -av "arch/arm64/boot/Image" "$RAW_DIR/Image"
          cp -av "arch/arm64/boot/Image" "$RAW_DIR/zImage"
          cp -av "arch/arm64/boot/dtb.img" "$RAW_DIR/dtb.img"

          [ -f "arch/arm64/boot/Image.gz" ] && cp -av "arch/arm64/boot/Image.gz" "$RAW_DIR/Image.gz" || true
          [ -f "arch/arm64/boot/Image.gz-dtb" ] && cp -av "arch/arm64/boot/Image.gz-dtb" "$RAW_DIR/Image.gz-dtb" || true

          find . -type f -name "*.ko" -print0 > "$OUT_DIR/modules.list" || true

          if [ -s "$OUT_DIR/modules.list" ]; then
            tar --null -czf "$OUT_DIR/modules-${DEVICE}-${MODEL_NAME}.tar.gz" --files-from "$OUT_DIR/modules.list"
          else
            echo "No .ko modules found" > "$OUT_DIR/modules-${DEVICE}-${MODEL_NAME}.txt"
          fi

          cp -av clean.log "$OUT_DIR/clean.log" || true
          cp -av defconfig.log "$OUT_DIR/defconfig.log" || true
          cp -av olddefconfig.log "$OUT_DIR/olddefconfig.log" || true
          cp -av build.log "$OUT_DIR/build.log" || true
          cp -av ksu-next-build-info.txt "$OUT_DIR/KernelSU-Next-build-info.txt" 2>/dev/null || true
          cp -av SuSFS-build-info.txt "$OUT_DIR/SuSFS-build-info.txt" 2>/dev/null || true
          cp -av susfs-*.log "$OUT_DIR/" 2>/dev/null || true
          cp -av susfs-*.txt "$OUT_DIR/" 2>/dev/null || true
          cp -av s9-random-uptime-v98-report.txt "$OUT_DIR/s9-random-uptime-v98-report.txt" 2>/dev/null || true
          cp -av s9-wifi-safe-v98-report.txt "$OUT_DIR/s9-wifi-safe-v98-report.txt" 2>/dev/null || true
          cp -av s9-wifi-pcie-stable-v98-report.txt "$OUT_DIR/s9-wifi-pcie-stable-v98-report.txt" 2>/dev/null || true
          cp -av s9-wifi-pcie-stable-v98-apply.log "$OUT_DIR/s9-wifi-pcie-stable-v98-apply.log" 2>/dev/null || true
          cp -av s9-wifi-pcie-stable-v98-markers.txt "$OUT_DIR/s9-wifi-pcie-stable-v98-markers.txt" 2>/dev/null || true
          cp -av ksu-next-markers-v57.txt "$OUT_DIR/KernelSU-Next-markers-v57.txt" 2>/dev/null || true
          grep -RIn "KSU_NEXT_MANUAL_HOOK\|ksu_handle_sys_reboot\|ksu_handle_execveat\|ksu_handle_faccessat\|ksu_handle_sys_read\|ksu_handle_stat" fs/exec.c fs/open.c fs/read_write.c fs/stat.c kernel/reboot.c > "$OUT_DIR/KernelSU-manual-hooks.txt" 2>/dev/null || true
          grep -RIn "KSU_NEXT_BACKPORT_PATH_UMOUNT\|int path_umount(struct path \*path, int flags)\|ksu_next_can_umount" fs/namespace.c fs/internal.h > "$OUT_DIR/KernelSU-path-umount.txt" 2>/dev/null || true
          grep -RIn "CONFIG_KSU_SUSFS\|SUSFS\|susfs" fs include/linux KernelSU-Next drivers/kernelsu 2>/dev/null > "$OUT_DIR/SuSFS-markers.txt" || true
          cp -av .config "$OUT_DIR/kernel.config" || true
          for KSU_CANDIDATE in KernelSU-Next KernelSU drivers/kernelsu kernel/kernelsu; do
            if [ -e "$KSU_CANDIDATE" ]; then
              find "$KSU_CANDIDATE" -maxdepth 3 -type f | sort > "$OUT_DIR/KernelSU-files.txt" || true
              break
            fi
          done
          grep -E "CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS|CONFIG_KSU_KPROBES_HOOK|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS" .config > "$OUT_DIR/KernelSU-config.txt" || true

          echo "===== ARTIFACT TREE ====="
          find "$OUT_DIR" -maxdepth 3 -type f -print -exec ls -lh {} \;

      - name: Package AnyKernel3 zip
        shell: bash
        run: |
          set -e

          OUT_DIR="$GITHUB_WORKSPACE/out"
          RAW_DIR="$OUT_DIR/raw"
          AK_DIR="$GITHUB_WORKSPACE/AnyKernel3"
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          ZIP_NAME="ss-S9-${DEVICE}-${MODEL_NAME}-PixelExp-A12-VendorQ-v98-q-ksu-susfs-random-uptime-${SHORT_SHA}.zip"

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 "$AK_DIR"

          cd "$AK_DIR"

          rm -rf .git .github
          rm -f Image Image.gz Image.gz-dtb Image-dtb zImage zImage-dtb dtb dtb.img dtbo.img
          cp -av "$RAW_DIR/zImage" ./zImage
          cp -av "$RAW_DIR/dtb.img" ./dtb.img

          rm -f anykernel.sh

          printf '%s\n' \
            "### AnyKernel3 Ramdisk Mod Script" \
            "## Auto-generated for ss-S9" \
            "## Target: Samsung Galaxy S9 ${MODEL_NAME} / ${DEVICE} / Pixel Experience Android 12 with Samsung Q vendor blobs" \
            "" \
            "properties() { '" \
            "kernel.string=ss-S9 ${DEVICE} ${MODEL_NAME} PixelExp Android12 VendorQ v98 KernelSU Next SuSFS RandomUptime15-20d" \
            "do.devicecheck=1" \
            "do.modules=0" \
            "do.systemless=1" \
            "do.cleanup=1" \
            "do.cleanuponabort=0" \
            "device.name1=${AK_DEVICE_1}" \
            "device.name2=${AK_DEVICE_2}" \
            "device.name3=${AK_DEVICE_3}" \
            "device.name4=${AK_DEVICE_4}" \
            "device.name5=${DEVICE}" \
            "supported.versions=" \
            "supported.patchlevels=" \
            "'; }" \
            "" \
            "BLOCK=boot" \
            "for CANDIDATE in \\" \
            "  /dev/block/platform/11120000.ufs/by-name/BOOT \\" \
            "  /dev/block/platform/11120000.ufs/by-name/boot \\" \
            "  /dev/block/bootdevice/by-name/boot \\" \
            "  /dev/block/by-name/boot" \
            "do" \
            '  if [ -e "$CANDIDATE" ]; then' \
            '    BLOCK="$CANDIDATE"' \
            "    break" \
            "  fi" \
            "done" \
            "" \
            "IS_SLOT_DEVICE=0" \
            "RAMDISK_COMPRESSION=auto" \
            "PATCH_VBMETA_FLAG=auto" \
            "" \
            ". tools/ak3-core.sh" \
            "" \
            "dump_boot" \
            "write_boot" \
            > anykernel.sh

          chmod +x anykernel.sh

          echo "===== anykernel.sh ====="
          cat anykernel.sh

          zip -r9 "$OUT_DIR/$ZIP_NAME" ./* -x "*.git*" "README.md"
          ls -lh "$OUT_DIR/$ZIP_NAME"

      - name: Create ChatGPT-readable build log
        if: always()
        shell: bash
        run: |
          set +e
          OUT_DIR="$GITHUB_WORKSPACE/out"
          KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
          LOG="$OUT_DIR/chatgpt-readable-build-log-v98.txt"
          mkdir -p "$OUT_DIR"

          {
            echo "===== CHATGPT READABLE BUILD LOG V98 ====="
            echo "date_utc=$(date -u)"
            echo "workflow=v98-q-ksu-susfs-random-uptime-15-20d"
            echo "repo=${GITHUB_REPOSITORY:-unknown}"
            echo "run=${GITHUB_RUN_ID:-unknown} attempt=${GITHUB_RUN_ATTEMPT:-unknown}"
            echo "sha=${GITHUB_SHA:-unknown}"
            echo "ref_to_build=${{ inputs.ref_to_build }}"
            echo "device=${DEVICE:-${{ inputs.device }}}"
            echo "model=${MODEL_NAME:-unknown}"
            echo "platform=${PLATFORM_VERSION:-unknown} android_major=${ANDROID_MAJOR_VERSION:-unknown}"
            echo

            if [ -d "$KERNEL_DIR" ]; then
              cd "$KERNEL_DIR"
              echo "===== KERNEL VERSION ====="
              grep -nE "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=" Makefile 2>/dev/null || true
              echo
              echo "===== CONFIG SNAPSHOT ====="
              grep -E "CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS|CONFIG_KSU_KPROBES_HOOK|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_ANDROID" .config 2>/dev/null || true
              echo
              echo "===== RANDOM UPTIME V98 REPORT ====="
              cat s9-random-uptime-v98-report.txt 2>/dev/null || true
              echo
              echo "===== WIFI/BOOTTIME SAFE REPORT ====="
              cat s9-wifi-safe-v98-report.txt 2>/dev/null || true
              echo
              echo "===== WIFI PCIE STABLE V98 REPORT ====="
              cat s9-wifi-pcie-stable-v98-report.txt 2>/dev/null || true
              echo
              echo "===== WIFI PCIE STABLE V98 APPLY LOG ====="
              cat s9-wifi-pcie-stable-v98-apply.log 2>/dev/null || true
              echo
              echo "===== WIFI PCIE STABLE V98 MARKERS ====="
              cat s9-wifi-pcie-stable-v98-markers.txt 2>/dev/null || true
              echo
              echo "===== RANDOM UPTIME MARKERS ====="
              grep -RniE "S9_RANDOM_UPTIME_V98|s9_random_uptime_apply_boot_offset|S9_RANDOM_UPTIME_SELECTED_DAYS|offs_boot = ktime_set|ktime_add\(tk->offs_boot" "$KERNEL_DIR/kernel/time/timekeeping.c" 2>/dev/null || true
              echo
              echo "===== BUILD ERRORS/WARNINGS SUMMARY ====="
              grep -nEi "error:|fatal error:|undefined reference|ld.lld|ld:|No such file|No rule to make target|FAILED|recipe for target|Stop\.|not found|Permission denied|unrecognized option|unknown argument|unsupported option|Illegal option|dtb.img" \
                clean.log defconfig.log olddefconfig.log build.log *.log 2>/dev/null | tail -350 || true
              echo
              echo "===== LAST 300 BUILD LINES ====="
              tail -300 build.log 2>/dev/null || true
            else
              echo "kernel directory missing"
            fi

            echo
            echo "===== OUT ARTIFACT TREE ====="
            find "$OUT_DIR" -maxdepth 3 -type f -print -exec ls -lh {} \; 2>/dev/null || true
          } > "$LOG" 2>&1

          echo "===== CHATGPT READABLE LOG PREVIEW ====="
          sed -n '1,260p' "$LOG" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ss-S9-${{ steps.target.outputs.device }}-${{ steps.target.outputs.model }}-kernel-v98-q-ksu-susfs-random-uptime
          path: |
            out/*.zip
            out/raw/*
            out/*.log
            out/chatgpt-readable-build-log-v98.txt
            out/v98-uptime-*
            out/kernel.config
            out/modules-*
            out/KernelSU-*.txt
            out/SuSFS-*.txt
            out/s9-random-uptime-v98-report.txt
            out/s9-wifi-safe-v98-report.txt
            out/s9-wifi-pcie-stable-v98-report.txt
            out/s9-wifi-pcie-stable-v98-apply.log
            out/s9-wifi-pcie-stable-v98-markers.txt
            out/susfs-*.log
            out/susfs-*.txt
            out/KernelSU-manual-hooks.txt
            out/KernelSU-path-umount.txt
            out/KernelSU-Next-build-info.txt
            out/KernelSU-Next-markers-v57.txt
          if-no-files-found: error
          compression-level: 6
