name: v6

"on":
  workflow_dispatch:
    inputs:
      ref_to_build:
        description: "Branch/ref to build"
        required: true
        default: "test_kernel"
      device:
        description: "Device target"
        required: true
        default: "starlte"
        type: choice
        options:
          - starlte
          - star2lte
          - crownlte

permissions:
  contents: read

concurrency:
  group: ss-s9-manual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  SUBARCH: arm64
  PLATFORM_VERSION: "10"
  ANDROID_MAJOR_VERSION: q
  TEMP_DEFCONFIG: exynos9810_temp_defconfig

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/local/share/boost || true
          sudo apt-get clean || true
          df -h

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref_to_build }}
          fetch-depth: 1
          path: kernel

      - name: Install packages
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            build-essential \
            ca-certificates \
            ccache \
            clang \
            cpio \
            flex \
            g++ \
            gcc \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            make \
            pahole \
            perl \
            python3 \
            python-is-python3 \
            rsync \
            unzip \
            zip

          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

          echo "===== TOOLCHAIN ====="
          clang --version
          aarch64-linux-gnu-gcc --version
          aarch64-linux-gnu-as --version
          aarch64-linux-gnu-ld.bfd --version
          arm-linux-gnueabi-gcc --version
          arm-linux-gnueabi-as --version

      - name: Select device config
        id: target
        shell: bash
        run: |
          set -e

          DEVICE="${{ inputs.device }}"

          case "$DEVICE" in
            starlte)
              DEVICE_DEFCONFIG="exynos9810-starlte_defconfig"
              MODEL_NAME="G960NK"
              AK_DEVICE_1="starlte"
              AK_DEVICE_2="starlteks"
              AK_DEVICE_3="starltekor"
              AK_DEVICE_4="SM-G960N"
              ;;
            star2lte)
              DEVICE_DEFCONFIG="exynos9810-star2lte_defconfig"
              MODEL_NAME="G965"
              AK_DEVICE_1="star2lte"
              AK_DEVICE_2="star2lteks"
              AK_DEVICE_3="star2ltekor"
              AK_DEVICE_4="SM-G965N"
              ;;
            crownlte)
              DEVICE_DEFCONFIG="exynos9810-crownlte_defconfig"
              MODEL_NAME="N960"
              AK_DEVICE_1="crownlte"
              AK_DEVICE_2="crownlteks"
              AK_DEVICE_3="crownltekor"
              AK_DEVICE_4="SM-N960N"
              ;;
            *)
              echo "Unsupported device: $DEVICE"
              exit 1
              ;;
          esac

          {
            echo "DEVICE=$DEVICE"
            echo "DEVICE_DEFCONFIG=$DEVICE_DEFCONFIG"
            echo "MODEL_NAME=$MODEL_NAME"
            echo "AK_DEVICE_1=$AK_DEVICE_1"
            echo "AK_DEVICE_2=$AK_DEVICE_2"
            echo "AK_DEVICE_3=$AK_DEVICE_3"
            echo "AK_DEVICE_4=$AK_DEVICE_4"
          } >> "$GITHUB_ENV"

          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "model=$MODEL_NAME" >> "$GITHUB_OUTPUT"

      - name: Show source information
        shell: bash
        working-directory: kernel
        run: |
          set -e

          echo "===== COMMIT ====="
          git rev-parse --short HEAD

          echo "===== MAKEFILE VERSION ====="
          grep -nE "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=" Makefile || true

          echo "===== DEFCONFIG CHECK ====="
          ls -lah arch/arm64/configs | grep -E "exynos9810|starlte|star2lte|crownlte" || true

          echo "===== TARGET ====="
          echo "DEVICE=$DEVICE"
          echo "MODEL_NAME=$MODEL_NAME"
          echo "DEVICE_DEFCONFIG=$DEVICE_DEFCONFIG"
          echo "PLATFORM_VERSION=$PLATFORM_VERSION"
          echo "ANDROID_MAJOR_VERSION=$ANDROID_MAJOR_VERSION"

      - name: Clean source tree safely
        shell: bash
        working-directory: kernel
        run: |
          set -e

          echo "===== CLEAN BY GIT RESET/CLEAN =====" | tee clean.log
          git reset --hard HEAD | tee -a clean.log
          git clean -fdx | tee -a clean.log

          rm -f "arch/arm64/configs/$TEMP_DEFCONFIG"
          rm -f .config .config.old
          rm -rf include/config include/generated arch/arm64/include/generated
          rm -f build.log defconfig.log olddefconfig.log

          echo "Clean done" | tee -a clean.log


      - name: Patch kernel release to G960NK v6
        shell: bash
        working-directory: kernel
        run: |
          set -e

          echo "===== BEFORE VERSION PATCH ====="
          grep -nE "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=" Makefile || true

          python3 - <<'PY'
          from pathlib import Path
          import re

          makefile = Path("Makefile")
          text = makefile.read_text(errors="ignore")

          text = re.sub(r"^SUBLEVEL\s*=\s*.*$", "SUBLEVEL = 220", text, flags=re.MULTILINE)

          if re.search(r"^EXTRAVERSION\s*=", text, flags=re.MULTILINE):
              text = re.sub(r"^EXTRAVERSION\s*=\s*.*$", "EXTRAVERSION = -G960NK-v6", text, flags=re.MULTILINE)
          else:
              text = text.replace("SUBLEVEL = 220", "SUBLEVEL = 220\nEXTRAVERSION = -G960NK-v6", 1)

          makefile.write_text(text)
          PY

          echo "===== AFTER VERSION PATCH ====="
          grep -nE "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=" Makefile || true

          echo "Expected UTS_RELEASE prefix: 4.9.220-G960NK-v6"


      - name: Patch clang external assembler prefix
        shell: bash
        working-directory: kernel
        run: |
          set -e

          echo "===== BEFORE PATCH: clang prefix lines ====="
          grep -RIn -- "--prefix=" Makefile scripts arch/arm64 2>/dev/null || true
          grep -RIn -- "gcc-toolchain" Makefile scripts arch/arm64 2>/dev/null || true
          grep -RIn -- "no-integrated-as" Makefile scripts arch/arm64 2>/dev/null || true

          python3 - <<'PY'
          from pathlib import Path

          search_roots = [
              Path("Makefile"),
              Path("scripts"),
              Path("arch/arm64"),
          ]

          files = []
          for root in search_roots:
              if root.is_file():
                  files.append(root)
              elif root.is_dir():
                  files.extend([p for p in root.rglob("*") if p.is_file()])

          replacements = {
              "--prefix=$(GCC_TOOLCHAIN_DIR)": "--prefix=$(GCC_TOOLCHAIN_DIR)$(notdir $(CROSS_COMPILE))",
              "--prefix=$(dir $(shell which $(CROSS_COMPILE)elfedit))": "--prefix=$(dir $(shell which $(CROSS_COMPILE)elfedit))$(notdir $(CROSS_COMPILE))",
              "--prefix=$(dir $(shell which $(CROSS_COMPILE)gcc))": "--prefix=$(dir $(shell which $(CROSS_COMPILE)gcc))$(notdir $(CROSS_COMPILE))",
              "--prefix=$(dir $(shell which $(CROSS_COMPILE)ld))": "--prefix=$(dir $(shell which $(CROSS_COMPILE)ld))$(notdir $(CROSS_COMPILE))",
          }

          changed = []

          for path in files:
              try:
                  text = path.read_text(errors="ignore")
              except Exception:
                  continue

              original = text

              for old, new in replacements.items():
                  if old in text and new not in text:
                      text = text.replace(old, new)

              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          print("Changed files:")
          if changed:
              for item in changed:
                  print(" -", item)
          else:
              print(" - none")
          PY

          echo "===== AFTER PATCH: clang prefix lines ====="
          grep -RIn -- "--prefix=" Makefile scripts arch/arm64 2>/dev/null || true
          grep -RIn -- "gcc-toolchain" Makefile scripts arch/arm64 2>/dev/null || true
          grep -RIn -- "no-integrated-as" Makefile scripts arch/arm64 2>/dev/null || true

          echo "===== CHECK TARGET BINUTILS ====="
          command -v aarch64-linux-gnu-as
          command -v aarch64-linux-gnu-ld.bfd
          command -v aarch64-linux-gnu-gcc

      - name: Prepare defconfig
        shell: bash
        working-directory: kernel
        run: |
          set -e

          CONFIG_DIR="arch/arm64/configs"
          BASE_DEFCONFIG="$CONFIG_DIR/exynos9810_defconfig"
          DEVICE_CONFIG="$CONFIG_DIR/$DEVICE_DEFCONFIG"
          TEMP_CONFIG="$CONFIG_DIR/$TEMP_DEFCONFIG"

          if [ ! -f "$DEVICE_CONFIG" ]; then
            echo "Missing device defconfig: $DEVICE_CONFIG"
            exit 1
          fi

          rm -f "$TEMP_CONFIG"

          if [ -s "$BASE_DEFCONFIG" ]; then
            cat "$BASE_DEFCONFIG" > "$TEMP_CONFIG"
            printf '\n' >> "$TEMP_CONFIG"
            cat "$DEVICE_CONFIG" >> "$TEMP_CONFIG"
          else
            cp -f "$DEVICE_CONFIG" "$TEMP_CONFIG"
          fi

          printf '\n# GitHub Actions target: %s %s Android 10 Q\n' "$DEVICE" "$MODEL_NAME" >> "$TEMP_CONFIG"

          echo "===== TEMP DEFCONFIG ====="
          ls -lah "$TEMP_CONFIG"
          tail -80 "$TEMP_CONFIG" || true

      - name: Build kernel and dtb.img
        shell: bash
        working-directory: kernel
        run: |
          set -eo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC="clang --target=aarch64-linux-gnu --prefix=/usr/bin/aarch64-linux-gnu- -no-integrated-as"
          export HOSTCC=gcc
          export HOSTCXX=g++
          export AS=aarch64-linux-gnu-as
          export LD=aarch64-linux-gnu-ld.bfd
          export AR=aarch64-linux-gnu-ar
          export NM=aarch64-linux-gnu-nm
          export OBJCOPY=aarch64-linux-gnu-objcopy
          export OBJDUMP=aarch64-linux-gnu-objdump
          export STRIP=aarch64-linux-gnu-strip
          export READELF=aarch64-linux-gnu-readelf
          export PLATFORM_VERSION="$PLATFORM_VERSION"
          export ANDROID_MAJOR_VERSION="$ANDROID_MAJOR_VERSION"
          export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          export KBUILD_BUILD_USER=khiconjk
          export KBUILD_BUILD_HOST=github-actions

          MAKE_ARGS=(
            V=0
            ARCH=arm64
            SUBARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
            "CC=clang --target=aarch64-linux-gnu --prefix=/usr/bin/aarch64-linux-gnu- -no-integrated-as"
            HOSTCC=gcc
            HOSTCXX=g++
            AS=aarch64-linux-gnu-as
            LD=aarch64-linux-gnu-ld.bfd
            AR=aarch64-linux-gnu-ar
            NM=aarch64-linux-gnu-nm
            OBJCOPY=aarch64-linux-gnu-objcopy
            OBJDUMP=aarch64-linux-gnu-objdump
            STRIP=aarch64-linux-gnu-strip
            READELF=aarch64-linux-gnu-readelf
            PLATFORM_VERSION="$PLATFORM_VERSION"
            ANDROID_MAJOR_VERSION="$ANDROID_MAJOR_VERSION"
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          )

          echo "===== COMPILER TEST ====="
          clang --target=aarch64-linux-gnu --prefix=/usr/bin/aarch64-linux-gnu- -no-integrated-as -x c -c /dev/null -o /tmp/clang-arm64-test.o
          file /tmp/clang-arm64-test.o

          echo "===== DEFCONFIG ====="
          make "${MAKE_ARGS[@]}" "$TEMP_DEFCONFIG" 2>&1 | tee defconfig.log

          echo "===== OLDDEFCONFIG ====="
          make "${MAKE_ARGS[@]}" olddefconfig 2>&1 | tee olddefconfig.log

          echo "===== CONFIG CHECK ====="
          grep -E "CONFIG_SOC_EXYNOS9810|CONFIG_CAMERA_STAR|CONFIG_CAMERA_STAR2|CONFIG_CAMERA_CROWN|CONFIG_EXYNOS_DTBTOOL|CONFIG_BUILD_ARM64_APPENDED|CONFIG_MODULES|CONFIG_ANDROID" .config || true

          echo "===== BUILD IMAGE + DTBS + DTB.IMG ====="
          make -j"$(nproc --all)" "${MAKE_ARGS[@]}" Image Image.gz dtbs dtb.img 2>&1 | tee build.log

          echo "===== IF dtb.img IS STILL MISSING, TRY dtb.img AGAIN WITH V=1 ====="
          if [ ! -f "arch/arm64/boot/dtb.img" ]; then
            make -j"$(nproc --all)" "${MAKE_ARGS[@]}" V=1 dtb.img 2>&1 | tee -a build.log
          fi

          echo "===== OUTPUTS ====="
          ls -lah arch/arm64/boot || true
          find arch/arm64/boot -maxdepth 8 -type f \( -name "Image*" -o -name "*.dtb" -o -name "dtb.img" -o -name "*.ko" \) -print -exec ls -lh {} \; || true

      - name: Show useful errors
        if: failure()
        shell: bash
        working-directory: kernel
        run: |
          echo "===== ERROR LINES ====="
          grep -nEi "error:|fatal error:|undefined reference|ld.lld|ld:|No such file|No rule to make target|FAILED|recipe for target|Stop\.|not found|Permission denied|unrecognized option|unknown argument|unsupported option|Illegal option|dtb.img" \
            clean.log defconfig.log olddefconfig.log build.log 2>/dev/null | tail -350 || true

          echo "===== LAST 350 BUILD LINES ====="
          tail -350 build.log 2>/dev/null || true

          echo "===== LAST 180 DEFCONFIG LINES ====="
          tail -180 defconfig.log 2>/dev/null || true

          echo "===== BOOT OUTPUT TREE ====="
          find arch/arm64/boot -maxdepth 8 -type f -print -exec ls -lh {} \; 2>/dev/null || true

      - name: Collect kernel outputs
        shell: bash
        working-directory: kernel
        run: |
          set -e

          OUT_DIR="$GITHUB_WORKSPACE/out"
          RAW_DIR="$OUT_DIR/raw"

          mkdir -p "$RAW_DIR"

          echo "===== REQUIRED OUTPUT CHECK ====="

          if [ ! -f "arch/arm64/boot/Image" ]; then
            echo "ERROR: arch/arm64/boot/Image not found"
            find arch/arm64/boot -maxdepth 8 -type f -print || true
            exit 1
          fi

          if [ ! -f "arch/arm64/boot/dtb.img" ]; then
            echo "ERROR: arch/arm64/boot/dtb.img not found"
            echo "Available dtb files:"
            find arch/arm64/boot -maxdepth 8 -type f \( -name "*.dtb" -o -name "dtb.img" \) -print -exec ls -lh {} \; || true
            echo "CONFIG_EXYNOS_DTBTOOL:"
            grep -n "CONFIG_EXYNOS_DTBTOOL" .config || true
            exit 1
          fi

          cp -av "arch/arm64/boot/Image" "$RAW_DIR/Image"
          cp -av "arch/arm64/boot/Image" "$RAW_DIR/zImage"
          cp -av "arch/arm64/boot/dtb.img" "$RAW_DIR/dtb.img"

          [ -f "arch/arm64/boot/Image.gz" ] && cp -av "arch/arm64/boot/Image.gz" "$RAW_DIR/Image.gz" || true
          [ -f "arch/arm64/boot/Image.gz-dtb" ] && cp -av "arch/arm64/boot/Image.gz-dtb" "$RAW_DIR/Image.gz-dtb" || true

          find . -type f -name "*.ko" -print0 > "$OUT_DIR/modules.list" || true

          if [ -s "$OUT_DIR/modules.list" ]; then
            tar --null -czf "$OUT_DIR/modules-${DEVICE}-${MODEL_NAME}.tar.gz" --files-from "$OUT_DIR/modules.list"
          else
            echo "No .ko modules found" > "$OUT_DIR/modules-${DEVICE}-${MODEL_NAME}.txt"
          fi

          cp -av clean.log "$OUT_DIR/clean.log" || true
          cp -av defconfig.log "$OUT_DIR/defconfig.log" || true
          cp -av olddefconfig.log "$OUT_DIR/olddefconfig.log" || true
          cp -av build.log "$OUT_DIR/build.log" || true
          cp -av .config "$OUT_DIR/kernel.config" || true

          echo "===== ARTIFACT TREE ====="
          find "$OUT_DIR" -maxdepth 3 -type f -print -exec ls -lh {} \;

      - name: Package AnyKernel3 zip
        shell: bash
        run: |
          set -e

          OUT_DIR="$GITHUB_WORKSPACE/out"
          RAW_DIR="$OUT_DIR/raw"
          AK_DIR="$GITHUB_WORKSPACE/AnyKernel3"
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          ZIP_NAME="ss-S9-${DEVICE}-${MODEL_NAME}-OneUI2.5-Q-v6-${SHORT_SHA}.zip"

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 "$AK_DIR"

          cd "$AK_DIR"

          rm -rf .git .github
          rm -f Image Image.gz Image.gz-dtb Image-dtb zImage zImage-dtb dtb dtb.img dtbo.img
          cp -av "$RAW_DIR/zImage" ./zImage
          cp -av "$RAW_DIR/dtb.img" ./dtb.img

          rm -f anykernel.sh

          printf '%s\n' \
            "### AnyKernel3 Ramdisk Mod Script" \
            "## Auto-generated for ss-S9" \
            "## Target: Samsung Galaxy S9 ${MODEL_NAME} / ${DEVICE} / One UI 2.5 Android 10" \
            "" \
            "properties() { '" \
            "kernel.string=ss-S9 ${DEVICE} ${MODEL_NAME} OneUI2.5 Android10 Q" \
            "do.devicecheck=1" \
            "do.modules=0" \
            "do.systemless=1" \
            "do.cleanup=1" \
            "do.cleanuponabort=0" \
            "device.name1=${AK_DEVICE_1}" \
            "device.name2=${AK_DEVICE_2}" \
            "device.name3=${AK_DEVICE_3}" \
            "device.name4=${AK_DEVICE_4}" \
            "device.name5=${DEVICE}" \
            "supported.versions=" \
            "supported.patchlevels=" \
            "'; }" \
            "" \
            "BLOCK=boot" \
            "for CANDIDATE in \\" \
            "  /dev/block/platform/11120000.ufs/by-name/BOOT \\" \
            "  /dev/block/platform/11120000.ufs/by-name/boot \\" \
            "  /dev/block/bootdevice/by-name/boot \\" \
            "  /dev/block/by-name/boot" \
            "do" \
            '  if [ -e "$CANDIDATE" ]; then' \
            '    BLOCK="$CANDIDATE"' \
            "    break" \
            "  fi" \
            "done" \
            "" \
            "IS_SLOT_DEVICE=0" \
            "RAMDISK_COMPRESSION=auto" \
            "PATCH_VBMETA_FLAG=auto" \
            "" \
            ". tools/ak3-core.sh" \
            "" \
            "dump_boot" \
            "write_boot" \
            > anykernel.sh

          chmod +x anykernel.sh

          echo "===== anykernel.sh ====="
          cat anykernel.sh

          zip -r9 "$OUT_DIR/$ZIP_NAME" ./* -x "*.git*" "README.md"
          ls -lh "$OUT_DIR/$ZIP_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ss-S9-${{ steps.target.outputs.device }}-${{ steps.target.outputs.model }}-kernel-v6
          path: |
            out/*.zip
            out/raw/*
            out/*.log
            out/kernel.config
            out/modules-*
          if-no-files-found: error
          compression-level: 6
