name: v113 S9 Stock Android 10 KSU Next SuSFS Runtime Surface Fixed Robust

on:
  workflow_dispatch:
    inputs:
      ref_to_build:
        description: "Branch/ref to build"
        required: true
        default: "test_kernel"
      device:
        description: "Device target"
        required: true
        default: "starlte"
        type: choice
        options:
          - starlte
          - star2lte
          - crownlte
      uptime_min_days:
        description: "Minimum fake /proc uptime days"
        required: true
        default: "15"
      uptime_max_days:
        description: "Maximum fake /proc uptime days"
        required: true
        default: "20"
      package_anykernel:
        description: "Package AnyKernel3 flashable zip"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: ss-s9-stock-q-${{ github.workflow }}-${{ github.ref }}-${{ inputs.device }}
  cancel-in-progress: true

env:
  ARCH: arm64
  SUBARCH: arm64
  PLATFORM_VERSION: "10"
  ANDROID_MAJOR_VERSION: q
  TEMP_DEFCONFIG: exynos9810_temp_defconfig
  WORKFLOW_TAG: v113-stock-q-ksu-susfs-runtime-rup
  KSU_NEXT_MODE: legacy
  SUSFS_BRANCH: "1.4.2-kernel-4.9"
  SUSFS_REPO: "https://gitlab.com/1392726643/susfs4ksu.git"

jobs:
  build:
    name: Build stock Q kernel with KSU Next + SuSFS + runtime surface fix robust
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/local/share/boost || true
          sudo apt-get clean || true
          df -h

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref_to_build }}
          fetch-depth: 1
          path: kernel

      - name: Install build packages
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            build-essential \
            ca-certificates \
            ccache \
            clang \
            cpio \
            flex \
            g++ \
            gcc \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            make \
            patch \
            pahole \
            perl \
            python3 \
            python-is-python3 \
            rsync \
            unzip \
            zip

          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          echo "===== TOOLCHAIN ====="
          clang --version
          aarch64-linux-gnu-gcc --version | head -n 1
          aarch64-linux-gnu-as --version | head -n 1
          aarch64-linux-gnu-ld.bfd --version | head -n 1
          arm-linux-gnueabi-gcc --version | head -n 1

      - name: Select device config
        id: target
        shell: bash
        run: |
          set -e
          DEVICE="${{ inputs.device }}"

          case "$DEVICE" in
            starlte)
              DEVICE_DEFCONFIG="exynos9810-starlte_defconfig"
              MODEL_NAME="G960"
              AK_DEVICE_1="starlte"
              AK_DEVICE_2="starltexx"
              AK_DEVICE_3="starlteks"
              AK_DEVICE_4="SM-G960F"
              AK_DEVICE_5="SM-G960N"
              ;;
            star2lte)
              DEVICE_DEFCONFIG="exynos9810-star2lte_defconfig"
              MODEL_NAME="G965"
              AK_DEVICE_1="star2lte"
              AK_DEVICE_2="star2ltexx"
              AK_DEVICE_3="star2lteks"
              AK_DEVICE_4="SM-G965F"
              AK_DEVICE_5="SM-G965N"
              ;;
            crownlte)
              DEVICE_DEFCONFIG="exynos9810-crownlte_defconfig"
              MODEL_NAME="N960"
              AK_DEVICE_1="crownlte"
              AK_DEVICE_2="crownltexx"
              AK_DEVICE_3="crownlteks"
              AK_DEVICE_4="SM-N960F"
              AK_DEVICE_5="SM-N960N"
              ;;
            *)
              echo "Unsupported device: $DEVICE"
              exit 1
              ;;
          esac

          {
            echo "DEVICE=$DEVICE"
            echo "DEVICE_DEFCONFIG=$DEVICE_DEFCONFIG"
            echo "MODEL_NAME=$MODEL_NAME"
            echo "AK_DEVICE_1=$AK_DEVICE_1"
            echo "AK_DEVICE_2=$AK_DEVICE_2"
            echo "AK_DEVICE_3=$AK_DEVICE_3"
            echo "AK_DEVICE_4=$AK_DEVICE_4"
            echo "AK_DEVICE_5=$AK_DEVICE_5"
          } >> "$GITHUB_ENV"

          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "model=$MODEL_NAME" >> "$GITHUB_OUTPUT"

      - name: Show source information
        shell: bash
        working-directory: kernel
        run: |
          set -e
          echo "===== COMMIT ====="
          git rev-parse --short HEAD
          echo "===== MAKEFILE VERSION ====="
          grep -nE "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=" Makefile || true
          echo "===== DEFCONFIG CHECK ====="
          ls -lah arch/arm64/configs | grep -E "exynos9810|starlte|star2lte|crownlte" || true
          echo "===== TARGET ====="
          echo "DEVICE=$DEVICE"
          echo "MODEL_NAME=$MODEL_NAME"
          echo "DEVICE_DEFCONFIG=$DEVICE_DEFCONFIG"
          echo "PLATFORM_VERSION=$PLATFORM_VERSION"
          echo "ANDROID_MAJOR_VERSION=$ANDROID_MAJOR_VERSION"
          echo "Uptime range: ${{ inputs.uptime_min_days }}..${{ inputs.uptime_max_days }} days"

      - name: Clean source tree safely
        shell: bash
        working-directory: kernel
        run: |
          set -e
          echo "===== CLEAN BY GIT RESET/CLEAN =====" | tee clean.log
          git reset --hard HEAD | tee -a clean.log
          git clean -fdx | tee -a clean.log
          rm -f "arch/arm64/configs/$TEMP_DEFCONFIG"
          rm -f .config .config.old
          rm -rf include/config include/generated arch/arm64/include/generated
          rm -f build.log defconfig.log olddefconfig.log uptime-v113-stock-q-apply.log s9-stock-q-random-uptime-v113-report.txt
          echo "Clean done" | tee -a clean.log

      - name: Patch kernel release for stock Android 10 v113 KSU Next SuSFS
        shell: bash
        working-directory: kernel
        run: |
          set -e
          echo "===== BEFORE VERSION PATCH ====="
          grep -nE "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=" Makefile || true

          python3 - <<'PY'
          from pathlib import Path
          import re

          makefile = Path('Makefile')
          text = makefile.read_text(errors='ignore')
          text = re.sub(r'^SUBLEVEL\s*=\s*.*$', 'SUBLEVEL = 220', text, flags=re.MULTILINE)
          extra = '-S9-STOCKQ-v113-ksu-rup'
          if re.search(r'^EXTRAVERSION\s*=', text, flags=re.MULTILINE):
              text = re.sub(r'^EXTRAVERSION\s*=\s*.*$', f'EXTRAVERSION = {extra}', text, flags=re.MULTILINE)
          else:
              text = text.replace('SUBLEVEL = 220', 'SUBLEVEL = 220\nEXTRAVERSION = ' + extra, 1)
          makefile.write_text(text)
          PY

          echo "===== AFTER VERSION PATCH ====="
          grep -nE "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=" Makefile || true
          RELEASE="4.9.220-S9-STOCKQ-v113-ksu-rup"
          LEN=$(printf "%s" "$RELEASE" | wc -c)
          echo "Expected UTS_RELEASE prefix: $RELEASE"
          echo "UTS_RELEASE length=$LEN / 64"
          if [ "$LEN" -gt 64 ]; then
            echo "ERROR: UTS_RELEASE exceeds Linux 64-character limit"
            exit 1
          fi

      - name: Patch clang external assembler prefix
        shell: bash
        working-directory: kernel
        run: |
          set -e
          echo "===== BEFORE PATCH: clang prefix lines ====="
          grep -RIn -- "--prefix=" Makefile scripts arch/arm64 2>/dev/null || true
          grep -RIn -- "gcc-toolchain" Makefile scripts arch/arm64 2>/dev/null || true
          grep -RIn -- "no-integrated-as" Makefile scripts arch/arm64 2>/dev/null || true

          python3 - <<'PY'
          from pathlib import Path
          roots = [Path('Makefile'), Path('scripts'), Path('arch/arm64')]
          files = []
          for root in roots:
              if root.is_file():
                  files.append(root)
              elif root.is_dir():
                  files.extend(p for p in root.rglob('*') if p.is_file())
          replacements = {
              '--prefix=$(GCC_TOOLCHAIN_DIR)': '--prefix=$(GCC_TOOLCHAIN_DIR)$(notdir $(CROSS_COMPILE))',
              '--prefix=$(dir $(shell which $(CROSS_COMPILE)elfedit))': '--prefix=$(dir $(shell which $(CROSS_COMPILE)elfedit))$(notdir $(CROSS_COMPILE))',
              '--prefix=$(dir $(shell which $(CROSS_COMPILE)gcc))': '--prefix=$(dir $(shell which $(CROSS_COMPILE)gcc))$(notdir $(CROSS_COMPILE))',
              '--prefix=$(dir $(shell which $(CROSS_COMPILE)ld))': '--prefix=$(dir $(shell which $(CROSS_COMPILE)ld))$(notdir $(CROSS_COMPILE))',
          }
          changed = []
          for path in files:
              try:
                  text = path.read_text(errors='ignore')
              except Exception:
                  continue
              original = text
              for old, new in replacements.items():
                  if old in text and new not in text:
                      text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  changed.append(str(path))
          print('Changed files:')
          for item in changed or ['none']:
              print(' -', item)
          PY

          echo "===== AFTER PATCH: clang prefix lines ====="
          grep -RIn -- "--prefix=" Makefile scripts arch/arm64 2>/dev/null || true
          command -v aarch64-linux-gnu-as
          command -v aarch64-linux-gnu-ld.bfd
          command -v aarch64-linux-gnu-gcc

      - name: Apply S9 stock Q random uptime plus runtime surface fix robust v113
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail
          LOG="uptime-v113-stock-q-apply.log"
          REPORT="s9-stock-q-random-uptime-v113-report.txt"
          : > "$LOG"
          : > "$REPORT"
          exec > >(tee -a "$LOG") 2>&1

          echo "===== APPLY S9 STOCK Q RANDOM UPTIME + RUNTIME SURFACE PATCH V113 ====="
          echo "Started UTC: $(date -u)"
          echo "Design: v113 keeps CLOCK_REALTIME unchanged, but delays fake MONOTONIC/BOOTTIME user surfaces so Android runtime uptime no longer exposes the real boot age."
          echo "Safety: no WiFi/DHD/wificond/vendor HAL edits; no global timekeeper clocksource delta mutation."

          INPUT_MIN_DAYS="${{ inputs.uptime_min_days }}"
          INPUT_MAX_DAYS="${{ inputs.uptime_max_days }}"
          python3 - "$INPUT_MIN_DAYS" "$INPUT_MAX_DAYS" <<'PYRANDOM' > .random_uptime_days
          import random, sys
          mn = int(sys.argv[1])
          mx = int(sys.argv[2])
          if mn < 1 or mx < mn or mx > 365:
              raise SystemExit(f'bad uptime range: {mn}..{mx}')
          print(random.randint(mn, mx))
          PYRANDOM
          RANDOM_UPTIME_DAYS="$(cat .random_uptime_days)"
          export RANDOM_UPTIME_DAYS
          export INPUT_MIN_DAYS
          export INPUT_MAX_DAYS
          export S9_RUNTIME_DELAY_SEC="180"

          cat > scripts/ci_apply_s9_stock_q_random_uptime_v113.py <<'PY'
          from pathlib import Path
          import os, re, sys, traceback

          ROOT = Path('.')
          TIMEKEEPING = ROOT / 'kernel/time/timekeeping.c'
          VDSO = ROOT / 'lib/vdso/vgettimeofday.c'
          KALLSYMS = ROOT / 'kernel/kallsyms.c'
          REPORT = ROOT / 's9-stock-q-random-uptime-v113-report.txt'
          MIN_DAYS = int(os.environ.get('INPUT_MIN_DAYS', '15'))
          MAX_DAYS = int(os.environ.get('INPUT_MAX_DAYS', '20'))
          DAYS = int(os.environ.get('RANDOM_UPTIME_DAYS', '17'))
          DELAY_SEC = int(os.environ.get('S9_RUNTIME_DELAY_SEC', '180'))
          SECS = DAYS * 86400
          NS = SECS * 1000000000

          def die(msg):
              raise SystemExit('ERROR: ' + msg)
          def read(path):
              if not path.exists():
                  die(f'missing {path}')
              return path.read_text(errors='ignore')
          def write(path, text):
              path.write_text(text)
          def sub_once(txt, pattern, repl, label, flags=re.S):
              new, n = re.subn(pattern, repl, txt, count=1, flags=flags)
              if n != 1:
                  die(f'cannot patch {label}')
              print(f'[PATCH] {label}')
              return new
          def write_report(status, extra=None):
              lines = [
                  'S9 stock Q random uptime v113 runtime-surface patch',
                  f'status={status}', f'range_days={MIN_DAYS}..{MAX_DAYS}',
                  f'selected_days={DAYS}', f'selected_seconds={SECS}',
                  f'selected_ns={NS}', f'runtime_surface_delay_sec={DELAY_SEC}',
                  'base_design=v111 stable + v112 runtime intent + robust v113 anchors',
                  'patch_surface=kernel/time/timekeeping.c + lib/vdso/vgettimeofday.c + kernel/kallsyms.c',
                  'method=delayed user-visible CLOCK_MONOTONIC/CLOCK_BOOTTIME/CLOCK_MONOTONIC_RAW offset after Android runtime records real baseline',
                  'expected_android_surface=/proc/uptime, dumpsys alarm nowELAPSED, Runtime uptime elapsed, Runtime uptime uptime move into fake 15..20 day range after delay',
                  'wall_clock=CLOCK_REALTIME unchanged',
                  'symbol_surface=/proc/kallsyms hides ksu/susfs names from seq output',
                  'not_used=WiFi/dhd/wificond/vendor HAL edits',
                  'not_used=clocksource delta mutation',
              ]
              if extra: lines.extend(extra)
              REPORT.write_text('\n'.join(lines) + '\n')

          def strip_old_timekeeping(txt):
              txt = re.sub(r'\n?/\* S9_RANDOM_UPTIME_V(?:9[0-9]|10[0-9]|11[0-9]|12[0-9])_START \*/.*?/\* S9_RANDOM_UPTIME_V(?:9[0-9]|10[0-9]|11[0-9]|12[0-9])_END \*/\n?', '\n', txt, flags=re.S)
              txt = re.sub(r'\n?/\* S9_RUNTIME_SURFACE_V(?:9[0-9]|10[0-9]|11[0-9]|12[0-9])_START \*/.*?/\* S9_RUNTIME_SURFACE_V(?:9[0-9]|10[0-9]|11[0-9]|12[0-9])_END \*/\n?', '\n', txt, flags=re.S)
              txt = re.sub(r'\n?\s*s9_random_uptime_apply_boot_offset\(tk\);\s*\n?', '\n', txt)
              txt = re.sub(r'\n\s*/\* S9_GHOST_UPTIME_[^*]*START \*/.*?/\* S9_GHOST_UPTIME_[^*]*END \*/\n', '\n', txt, flags=re.S)
              txt = re.sub(r'\n\s*ghost_uptime_[a-zA-Z0-9_]+\([^;]*\);\s*\n', '\n', txt)
              txt = re.sub(r'(?m)^\s*#include\s+<linux/ghost_uptime\.h>\s*\n', '', txt)
              txt = re.sub(r'\n?\s*static\s+inline\s+u64\s+get_fake_boottime(?:_ns)?\s*\(\s*void\s*\)\s*\{.*?\}\s*', '\n', txt, flags=re.S)
              txt = re.sub(r'return\s+delta\s*\+\s*get_fake_boottime(?:_ns)?\s*\(\s*\)\s*;', 'return delta;', txt)
              txt = re.sub(r'\bu64\s+arch_sys_boot_offset\s*(?:=\s*0)?\s*;\s*(?:EXPORT_SYMBOL_GPL\s*\(\s*arch_sys_boot_offset\s*\)\s*;)?', '', txt)
              return txt

          def patch_timekeeping():
              txt = strip_old_timekeeping(read(TIMEKEEPING)); orig = txt
              helper = f'''
          /* S9_RUNTIME_SURFACE_V113_START */
          #define S9_RUNTIME_SURFACE_MIN_DAYS {MIN_DAYS}ULL
          #define S9_RUNTIME_SURFACE_MAX_DAYS {MAX_DAYS}ULL
          #define S9_RUNTIME_SURFACE_SELECTED_DAYS {DAYS}ULL
          #define S9_RUNTIME_SURFACE_OFFSET_SEC (S9_RUNTIME_SURFACE_SELECTED_DAYS * 86400ULL)
          #define S9_RUNTIME_SURFACE_OFFSET_NS (S9_RUNTIME_SURFACE_OFFSET_SEC * NSEC_PER_SEC)
          #define S9_RUNTIME_SURFACE_DELAY_SEC {DELAY_SEC}ULL
          #define S9_RUNTIME_SURFACE_DELAY_NS (S9_RUNTIME_SURFACE_DELAY_SEC * NSEC_PER_SEC)
          static __always_inline bool s9_runtime_surface_ready_ktime(ktime_t kt) {{ return ktime_to_ns(kt) >= S9_RUNTIME_SURFACE_DELAY_NS; }}
          static __always_inline ktime_t s9_runtime_surface_add_ktime(ktime_t kt) {{ if (s9_runtime_surface_ready_ktime(kt)) return ktime_add(kt, ns_to_ktime(S9_RUNTIME_SURFACE_OFFSET_NS)); return kt; }}
          static __always_inline void s9_runtime_surface_add_ts64(struct timespec64 *ts) {{ if (ts && ts->tv_sec >= (time64_t)S9_RUNTIME_SURFACE_DELAY_SEC) timespec64_add_ns(ts, S9_RUNTIME_SURFACE_OFFSET_NS); }}
          static __always_inline void s9_runtime_surface_sub_boot_ts64(struct timespec64 *ts) {{ if (ts && s9_runtime_surface_ready_ktime(ktime_get())) set_normalized_timespec64(ts, ts->tv_sec - (time64_t)S9_RUNTIME_SURFACE_OFFSET_SEC, ts->tv_nsec); }}
          /* S9_RUNTIME_SURFACE_V113_END */
          '''
              if 'S9_RUNTIME_SURFACE_V113_START' not in txt:
                  txt = sub_once(txt, r'(static\s+ktime_t\s*\*\s*offsets\s*\[\s*TK_OFFS_MAX\s*\]\s*=\s*\{)', helper + r'\n\1', 'timekeeping helper before offsets[]')
              txt = sub_once(txt, r'(ktime_t\s+ktime_get_with_offset\s*\(\s*enum\s+tk_offsets\s+offs\s*\)\s*\{.*?)(return\s+ktime_add_ns\s*\(\s*base\s*,\s*nsecs\s*\)\s*;)(\s*\}\s*EXPORT_SYMBOL_GPL\s*\(\s*ktime_get_with_offset\s*\)\s*;)', r'\1base = ktime_add_ns(base, nsecs);\n\tif (offs == TK_OFFS_BOOT)\n\t\tbase = s9_runtime_surface_add_ktime(base);\n\treturn base;\3', 'ktime_get_with_offset return')
              txt = sub_once(txt, r'(void\s+ktime_get_ts64\s*\(\s*struct\s+timespec64\s*\*\s*ts\s*\)\s*\{.*?timespec64_add_ns\s*\(\s*ts\s*,\s*nsec\s*\+\s*tomono\.tv_nsec\s*\)\s*;)(\s*\}\s*EXPORT_SYMBOL_GPL\s*\(\s*ktime_get_ts64\s*\)\s*;)', r'\1\n\ts9_runtime_surface_add_ts64(ts);\2', 'ktime_get_ts64 tail')
              txt = sub_once(txt, r'(void\s+getrawmonotonic64\s*\(\s*struct\s+timespec64\s*\*\s*ts\s*\)\s*\{.*?timespec64_add_ns\s*\(\s*ts\s*,\s*nsecs\s*\)\s*;)(\s*\}\s*EXPORT_SYMBOL\s*\(\s*getrawmonotonic64\s*\)\s*;)', r'\1\n\ts9_runtime_surface_add_ts64(ts);\2', 'getrawmonotonic64 tail')
              txt = sub_once(txt, r'(void\s+getboottime64\s*\(\s*struct\s+timespec64\s*\*\s*ts\s*\)\s*\{.*?\*\s*ts\s*=\s*ktime_to_timespec64\s*\(\s*t\s*\)\s*;)(\s*\}\s*EXPORT_SYMBOL_GPL\s*\(\s*getboottime64\s*\)\s*;)', r'\1\n\ts9_runtime_surface_sub_boot_ts64(ts);\2', 'getboottime64 tail')
              coarse_pat = r'(struct\s+timespec64\s+get_monotonic_coarse64\s*\(\s*void\s*\)\s*\{.*?set_normalized_timespec64\s*\([^;]+\)\s*;)(\s*return\s+now\s*;\s*\}\s*EXPORT_SYMBOL\s*\(\s*get_monotonic_coarse64\s*\)\s*;)'
              if re.search(coarse_pat, txt, flags=re.S): txt = sub_once(txt, coarse_pat, r'\1\n\ts9_runtime_surface_add_ts64(&now);\2', 'get_monotonic_coarse64 tail')
              else: print('WARN: get_monotonic_coarse64 anchor not found; continuing')
              for label, pattern in {'old boot offset call':'s9_random_uptime_apply_boot_offset(tk);','old direct offs_boot injection':'S9_RANDOM_UPTIME_V111_START','ghost header include':'ghost_uptime.h','clocksource delta fake':'return delta +'}.items():
                  if pattern in txt: die(f'banned old uptime pattern remains: {label} / {pattern}')
              for required in ['S9_RUNTIME_SURFACE_V113_START','s9_runtime_surface_add_ktime','s9_runtime_surface_add_ts64','s9_runtime_surface_sub_boot_ts64']:
                  if txt.count(required) < 1: die(f'missing required timekeeping marker: {required}')
              write(TIMEKEEPING, txt); return txt != orig

          def patch_vdso():
              txt = read(VDSO); orig = txt
              txt = re.sub(r'\n?/\* S9_RUNTIME_VDSO_SURFACE_V(?:9[0-9]|10[0-9]|11[0-9]|12[0-9])_START \*/.*?/\* S9_RUNTIME_VDSO_SURFACE_V(?:9[0-9]|10[0-9]|11[0-9]|12[0-9])_END \*/\n?', '\n', txt, flags=re.S)
              txt = txt.replace('\n\ts9_vdso_runtime_surface_add(ts);','').replace('\ts9_vdso_runtime_surface_add(ts);','')
              helper = f'''
          /* S9_RUNTIME_VDSO_SURFACE_V113_START */
          #define S9_VDSO_RUNTIME_SURFACE_OFFSET_SEC {SECS}ULL
          #define S9_VDSO_RUNTIME_SURFACE_DELAY_SEC {DELAY_SEC}ULL
          static notrace void s9_vdso_runtime_surface_add(struct timespec *ts) {{ if (ts && ts->tv_sec >= (__kernel_time_t)S9_VDSO_RUNTIME_SURFACE_DELAY_SEC) ts->tv_sec += (__kernel_time_t)S9_VDSO_RUNTIME_SURFACE_OFFSET_SEC; }}
          /* S9_RUNTIME_VDSO_SURFACE_V113_END */
          '''
              if 'S9_RUNTIME_VDSO_SURFACE_V113_START' not in txt: txt = sub_once(txt, r'(static\s+notrace\s+u32\s+vdso_read_begin\s*\()', helper + r'\n\1', 'VDSO helper before vdso_read_begin')
              for name in ['do_monotonic_coarse','do_monotonic','do_monotonic_raw','do_boottime']:
                  txt = sub_once(txt, r'(static\s+notrace\s+int\s+' + re.escape(name) + r'\s*\([^)]*\)\s*\{.*?)(return\s+0\s*;\s*\})', r'\1s9_vdso_runtime_surface_add(ts);\n\t\2', f'VDSO {name} tail')
              if txt.count('s9_vdso_runtime_surface_add(ts);') < 4: die('not all VDSO runtime surface calls were inserted')
              write(VDSO, txt); return txt != orig

          def patch_kallsyms():
              txt = read(KALLSYMS); orig = txt
              txt = re.sub(r'\n?/\* S9_KALLSYMS_HIDE_V(?:9[0-9]|10[0-9]|11[0-9]|12[0-9])_START \*/.*?/\* S9_KALLSYMS_HIDE_V(?:9[0-9]|10[0-9]|11[0-9]|12[0-9])_END \*/\n?', '\n', txt, flags=re.S)
              txt = re.sub(r'\n?\s*if\s*\(s9_kallsyms_hide_runtime_symbol\([^;]+\)\s*\|\|\s*s9_kallsyms_hide_runtime_symbol\([^;]+\)\)\s*return\s+0;\s*','\n',txt)
              helper = r'''
          /* S9_KALLSYMS_HIDE_V113_START */
          static int s9_kallsyms_hide_runtime_symbol(const char *name) { if (!name || !name[0]) return 0; return strstr(name, "KernelSU") || strstr(name, "kernelsu") || strstr(name, "ksu_") || strstr(name, "__ksu") || strstr(name, "anon_ksu") || strstr(name, "susfs") || strstr(name, "sus_su"); }
          /* S9_KALLSYMS_HIDE_V113_END */
          '''
              if 'S9_KALLSYMS_HIDE_V113_START' not in txt: txt = sub_once(txt, r'(struct\s+kallsym_iter\s*\{)', helper + r'\n\1', 'kallsyms hide helper before iterator')
              txt = sub_once(txt, r'(static\s+int\s+s_show\s*\([^)]*\)\s*\{\s*struct\s+kallsym_iter\s*\*\s*iter\s*=\s*m->private\s*;.*?if\s*\(\s*!\s*iter->name\[0\]\s*\)\s*return\s+0\s*;)', r'\1\n\tif (s9_kallsyms_hide_runtime_symbol(iter->name) || s9_kallsyms_hide_runtime_symbol(iter->module_name))\n\t\treturn 0;', 'kallsyms s_show filter')
              if 'S9_KALLSYMS_HIDE_V113_START' not in txt or txt.count('s9_kallsyms_hide_runtime_symbol') < 3: die('kallsyms hide patch did not land')
              write(KALLSYMS, txt); return txt != orig

          try:
              if DAYS < MIN_DAYS or DAYS > MAX_DAYS: die(f'RANDOM_UPTIME_DAYS out of range: {DAYS}')
              changed=[]
              if patch_timekeeping(): changed.append('kernel/time/timekeeping.c')
              if patch_vdso(): changed.append('lib/vdso/vgettimeofday.c')
              if patch_kallsyms(): changed.append('kernel/kallsyms.c')
              write_report('patched', [f'changed_files={",".join(changed)}'])
              print(REPORT.read_text())
          except SystemExit as exc:
              write_report('failed', ['error=' + str(exc)]); raise
          except Exception as exc:
              tb=traceback.format_exc(); write_report('failed_exception', ['exception='+repr(exc), 'traceback='+tb.replace('\n','\\n')]); print(tb, file=sys.stderr); raise
          PY

          python3 scripts/ci_apply_s9_stock_q_random_uptime_v113.py

          echo "===== VERIFY S9 STOCK Q RUNTIME SURFACE V113 ====="
          cat s9-stock-q-random-uptime-v113-report.txt
          grep -RniE "S9_RUNTIME_SURFACE_V113|S9_RUNTIME_VDSO_SURFACE_V113|S9_KALLSYMS_HIDE_V113|s9_runtime_surface|s9_vdso_runtime_surface|s9_kallsyms_hide" \
            kernel/time/timekeeping.c lib/vdso/vgettimeofday.c kernel/kallsyms.c 2>/dev/null || true

      - name: Add KernelSU Next legacy plus SuSFS 4.9 bridge v113
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail
          LOG="ksu-susfs-v113-apply.log"
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1

          echo "===== ADD KERNELSU NEXT LEGACY + SUSFS 4.9 FOR STOCK Q V113 ====="
          echo "Started UTC: $(date -u)"
          echo "KSU_NEXT_MODE=$KSU_NEXT_MODE"
          echo "SUSFS_BRANCH=$SUSFS_BRANCH"
          echo "SUSFS_REPO=$SUSFS_REPO"
          echo "Design: keep v113 uptime timekeeping-only patch; add KSU Next/SuSFS only."

          rm -rf KernelSU KernelSU-Next drivers/kernelsu kernel/kernelsu susfs4ksu
          rm -f susfs-*.log susfs-*.txt ksu-*.txt SuSFS-build-info.txt
          find . \( -name "*.rej" -o -name "*.orig" \) -type f -delete 2>/dev/null || true

          echo "===== INSTALL KERNELSU NEXT LEGACY ====="
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "$KSU_NEXT_MODE"

          echo "===== DETECT KERNELSU DIRECTORY ====="
          KSU_DIR=""
          for CANDIDATE in drivers/kernelsu KernelSU-Next KernelSU kernel/kernelsu; do
            if [ -d "$CANDIDATE" ]; then
              KSU_DIR="$CANDIDATE"
              break
            fi
          done
          if [ -z "$KSU_DIR" ]; then
            echo "ERROR: KernelSU Next directory not found after setup.sh"
            find . -maxdepth 3 -type d | sort | sed -n '1,240p'
            exit 1
          fi
          echo "KSU_DIR=$KSU_DIR" | tee ksu-path.txt
          find "$KSU_DIR" -maxdepth 4 -type f \( -name "Kconfig" -o -name "Kbuild" -o -name "Makefile" -o -name "*.c" -o -name "*.h" \) | sort | sed -n '1,260p'

          echo "===== CLONE SUSFS4KSU 4.9 PATCHSET ====="
          if ! git clone --depth=1 -b "$SUSFS_BRANCH" "$SUSFS_REPO" susfs4ksu 2>&1 | tee susfs-clone.log; then
            echo "Primary clone failed, trying simonpunk mirror with same branch" | tee -a susfs-clone.log
            git clone --depth=1 -b "$SUSFS_BRANCH" https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu 2>&1 | tee -a susfs-clone.log
          fi

          echo "===== SUSFS FILES ====="
          find susfs4ksu -maxdepth 4 -type f | sort | tee susfs-files.txt

          echo "===== COPY SUSFS CORE FILES ====="
          if [ ! -d susfs4ksu/kernel_patches/fs ]; then
            echo "ERROR: susfs4ksu/kernel_patches/fs not found"
            exit 1
          fi
          if [ ! -d susfs4ksu/kernel_patches/include/linux ]; then
            echo "ERROR: susfs4ksu/kernel_patches/include/linux not found"
            exit 1
          fi
          cp -av susfs4ksu/kernel_patches/fs/* fs/ 2>&1 | tee susfs-copy.log
          cp -av susfs4ksu/kernel_patches/include/linux/* include/linux/ 2>&1 | tee -a susfs-copy.log
          test -f fs/susfs.c
          test -f include/linux/susfs.h

          echo "===== APPLY SUSFS KERNEL PATCH IF AVAILABLE ====="
          KERNEL_PATCH=""
          for CANDIDATE in \
            susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch \
            susfs4ksu/kernel_patches/50_add_susfs_in_kernel_4.9.patch \
            susfs4ksu/kernel_patches/50_add_susfs_in_kernel.patch
          do
            if [ -f "$CANDIDATE" ]; then
              KERNEL_PATCH="$CANDIDATE"
              break
            fi
          done
          if [ -n "$KERNEL_PATCH" ]; then
            echo "Using kernel patch: $KERNEL_PATCH"
            if patch -p1 --forward --batch < "$KERNEL_PATCH" 2>&1 | tee susfs-kernel-patch.log; then
              echo "SUSFS kernel patch applied."
            else
              echo "WARN: SUSFS kernel patch did not apply fully; Python bridge will repair common 4.9 integration points."
            fi
          else
            echo "WARN: no 50_add_susfs_in_kernel-4.9 patch found; Python bridge will add common integration points."
          fi

          echo "===== APPLY SUSFS KERNELSU PATCH IF AVAILABLE ====="
          KSU_PATCH="$(find susfs4ksu -type f \( -iname '*enable*susfs*ksu*.patch' -o -iname '*susfs*ksu*.patch' \) | head -n 1 || true)"
          if [ -n "$KSU_PATCH" ]; then
            echo "Trying KernelSU-side patch: $KSU_PATCH"
            patch -p1 --forward --batch < "$KSU_PATCH" 2>&1 | tee susfs-ksu-patch.log || echo "WARN: KernelSU-side patch did not apply fully; manual bridge follows."
          else
            echo "WARN: no KernelSU-side SuSFS patch found; manual bridge follows."
          fi

          echo "===== MANUAL KSU NEXT + SUSFS 4.9 BRIDGE ====="
          python3 - <<'PYKSU'
          from pathlib import Path
          import re
          import os

          root = Path('.')
          candidates = [Path('drivers/kernelsu'), Path('KernelSU-Next'), Path('KernelSU'), Path('kernel/kernelsu')]
          ksu_dir = next((p for p in candidates if p.is_dir()), None)
          if ksu_dir is None:
              raise SystemExit('ERROR: KernelSU directory missing')
          print(f'[INFO] KSU_DIR={ksu_dir}')

          def read(path):
              p = Path(path)
              if not p.exists():
                  print(f'[SKIP] {path}: missing')
                  return None
              return p.read_text(errors='ignore')

          def write(path, text):
              Path(path).write_text(text)

          def append_unique(path, block, tag):
              text = read(path)
              if text is None:
                  return False
              if tag in text:
                  print(f'[OK] {path}: {tag} already present')
                  return True
              write(path, text.rstrip() + '\n\n' + block.strip() + '\n')
              print(f'[PATCH] {path}: appended {tag}')
              return True

          def insert_before_last_endmenu(path, block, tag):
              text = read(path)
              if text is None:
                  return False
              if tag in text or 'config KSU_SUSFS' in text:
                  print(f'[OK] {path}: SuSFS Kconfig already present')
                  return True
              idx = text.rfind('endmenu')
              if idx < 0:
                  write(path, text.rstrip() + '\n\n' + block.strip() + '\n')
              else:
                  text = text[:idx] + block.strip() + '\n\n' + text[idx:]
                  write(path, text)
              print(f'[PATCH] {path}: inserted {tag}')
              return True

          def insert_after_in_func(path, func_marker, after_marker, block, tag):
              text = read(path)
              if text is None:
                  return False
              if tag in text:
                  print(f'[OK] {path}: {tag} already present')
                  return True
              start = text.find(func_marker)
              if start < 0:
                  return False
              idx = text.find(after_marker, start)
              if idx < 0:
                  return False
              insert_at = idx + len(after_marker)
              text = text[:insert_at] + '\n' + block + text[insert_at:]
              write(path, text)
              print(f'[PATCH] {path}: inserted {tag}')
              return True

          def insert_before(path, marker, block, tag):
              text = read(path)
              if text is None:
                  return False
              if tag in text:
                  print(f'[OK] {path}: {tag} already present')
                  return True
              idx = text.find(marker)
              if idx < 0:
                  return False
              text = text[:idx] + block + '\n' + text[idx:]
              write(path, text)
              print(f'[PATCH] {path}: inserted {tag}')
              return True

          def insert_after_brace(path, func_marker, block, tag):
              text = read(path)
              if text is None:
                  return False
              if tag in text:
                  print(f'[OK] {path}: {tag} already present')
                  return True
              start = text.find(func_marker)
              if start < 0:
                  return False
              brace = text.find('{', start)
              if brace < 0:
                  return False
              text = text[:brace + 1] + '\n' + block + text[brace + 1:]
              write(path, text)
              print(f'[PATCH] {path}: inserted {tag}')
              return True

          # Ensure the kernel tree actually sources/builds KernelSU when setup.sh path differs.
          drivers_kconfig = Path('drivers/Kconfig')
          if drivers_kconfig.exists():
              t = drivers_kconfig.read_text(errors='ignore')
              source_line = f'source "{ksu_dir}/Kconfig"'
              if 'kernelsu/Kconfig' not in t and 'KernelSU' not in t:
                  marker = 'endmenu'
                  if marker in t:
                      t = t.replace(marker, source_line + '\n\n' + marker, 1)
                  else:
                      t += '\n' + source_line + '\n'
                  drivers_kconfig.write_text(t)
                  print('[PATCH] drivers/Kconfig: added KernelSU source line')
          drivers_make = Path('drivers/Makefile')
          if drivers_make.exists():
              t = drivers_make.read_text(errors='ignore')
              obj_line = f'obj-$(CONFIG_KSU) += {ksu_dir.relative_to(Path("drivers")) if str(ksu_dir).startswith("drivers/") else "kernelsu"}/'
              if 'CONFIG_KSU' not in t or 'kernelsu' not in t:
                  t += '\n# KernelSU Next v113\n' + obj_line + '\n'
                  drivers_make.write_text(t)
                  print('[PATCH] drivers/Makefile: added KernelSU obj line')

          # KernelSU manual hooks for non-GKI Linux 4.9.
          exec_extern = '#ifdef CONFIG_KSU\n/* KSU_NEXT_MANUAL_HOOK_EXEC_EXTERN */\n__attribute__((hot))\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif\n'
          insert_before('fs/exec.c', 'int do_execve(struct filename *filename', exec_extern, 'KSU_NEXT_MANUAL_HOOK_EXEC_EXTERN')
          exec_call = '#ifdef CONFIG_KSU\n\t/* KSU_NEXT_MANUAL_HOOK_EXEC_CALL */\n\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n#endif'
          if not insert_after_in_func('fs/exec.c', 'int do_execve(struct filename *filename', 'struct user_arg_ptr envp = { .ptr.native = __envp };', exec_call, 'KSU_NEXT_MANUAL_HOOK_EXEC_CALL'):
              print('[WARN] fs/exec.c: do_execve hook anchor not found')

          open_extern = '#ifdef CONFIG_KSU\n/* KSU_NEXT_MANUAL_HOOK_FACCESSAT_EXTERN */\n__attribute__((hot))\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif\n\n'
          ot = read('fs/open.c')
          if ot is not None and 'KSU_NEXT_MANUAL_HOOK_FACCESSAT_EXTERN' not in ot:
              for m in ['SYSCALL_DEFINE3(faccessat', 'long do_faccessat(']:
                  if m in ot:
                      ot = ot.replace(m, open_extern + m, 1)
                      write('fs/open.c', ot)
                      print('[PATCH] fs/open.c: faccessat extern')
                      break
          open_call = '#ifdef CONFIG_KSU\n\t/* KSU_NEXT_MANUAL_HOOK_FACCESSAT_CALL */\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif'
          if not insert_after_in_func('fs/open.c', 'SYSCALL_DEFINE3(faccessat', 'unsigned int lookup_flags = LOOKUP_FOLLOW;', open_call, 'KSU_NEXT_MANUAL_HOOK_FACCESSAT_CALL'):
              insert_after_in_func('fs/open.c', 'long do_faccessat(', 'unsigned int lookup_flags = LOOKUP_FOLLOW;', open_call, 'KSU_NEXT_MANUAL_HOOK_FACCESSAT_CALL')

          read_extern = '#ifdef CONFIG_KSU\n/* KSU_NEXT_MANUAL_HOOK_READ_EXTERN */\nextern bool ksu_vfs_read_hook __read_mostly;\nextern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr);\n#endif\n\n'
          rt = read('fs/read_write.c')
          if rt is not None and 'KSU_NEXT_MANUAL_HOOK_READ_EXTERN' not in rt and 'SYSCALL_DEFINE3(read' in rt:
              rt = rt.replace('SYSCALL_DEFINE3(read', read_extern + 'SYSCALL_DEFINE3(read', 1)
              write('fs/read_write.c', rt)
              print('[PATCH] fs/read_write.c: read extern')
          read_call = '#ifdef CONFIG_KSU\n\t/* KSU_NEXT_MANUAL_HOOK_READ_CALL */\n\tif (unlikely(ksu_vfs_read_hook))\n\t\tksu_handle_sys_read(fd, (char __user **)&buf, &count);\n#endif'
          insert_after_in_func('fs/read_write.c', 'SYSCALL_DEFINE3(read', 'ssize_t ret = -EBADF;', read_call, 'KSU_NEXT_MANUAL_HOOK_READ_CALL')

          stat_extern = '#ifdef CONFIG_KSU\n/* KSU_NEXT_MANUAL_HOOK_STAT_EXTERN */\n__attribute__((hot))\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n#endif\n\n'
          st = read('fs/stat.c')
          if st is not None and 'KSU_NEXT_MANUAL_HOOK_STAT_EXTERN' not in st:
              for m in ['SYSCALL_DEFINE4(newfstatat', 'int vfs_fstatat(', 'int vfs_statx(']:
                  if m in st:
                      st = st.replace(m, stat_extern + m, 1)
                      write('fs/stat.c', st)
                      print('[PATCH] fs/stat.c: stat extern')
                      break
          stat_call = '#ifdef CONFIG_KSU\n\t/* KSU_NEXT_MANUAL_HOOK_STAT_CALL */\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif'
          if not insert_after_in_func('fs/stat.c', 'SYSCALL_DEFINE4(newfstatat', 'int error;', stat_call, 'KSU_NEXT_MANUAL_HOOK_STAT_CALL'):
              insert_after_in_func('fs/stat.c', 'int vfs_fstatat(', 'unsigned int lookup_flags = 0;', stat_call, 'KSU_NEXT_MANUAL_HOOK_STAT_CALL')

          reboot_extern = '#ifdef CONFIG_KSU\n/* KSU_NEXT_MANUAL_HOOK_REBOOT_EXTERN */\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif\n\n'
          insert_before('kernel/reboot.c', 'SYSCALL_DEFINE4(reboot', reboot_extern, 'KSU_NEXT_MANUAL_HOOK_REBOOT_EXTERN')
          reboot_call = '#ifdef CONFIG_KSU\n\t/* KSU_NEXT_MANUAL_HOOK_REBOOT_CALL */\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif'
          if not insert_after_in_func('kernel/reboot.c', 'SYSCALL_DEFINE4(reboot', 'int ret = 0;', reboot_call, 'KSU_NEXT_MANUAL_HOOK_REBOOT_CALL'):
              if not insert_after_brace('kernel/reboot.c', 'SYSCALL_DEFINE4(reboot', reboot_call, 'KSU_NEXT_MANUAL_HOOK_REBOOT_CALL'):
                  raise SystemExit('ERROR: kernel/reboot.c hook failed')

          # Backport path_umount expected by KernelSU Next/SuSFS on 4.9.
          ns = Path('fs/namespace.c')
          if ns.exists():
              txt = ns.read_text(errors='ignore')
              if 'KSU_NEXT_BACKPORT_PATH_UMOUNT' not in txt and 'int path_umount(struct path *path, int flags)' not in txt:
                  marker = 'static bool is_mnt_ns_file(struct dentry *dentry)'
                  block = '\n/* KSU_NEXT_BACKPORT_PATH_UMOUNT */\n#ifdef CONFIG_KSU\nstatic int ksu_next_can_umount(const struct path *path, int flags)\n{\n\tstruct mount *mnt = real_mount(path->mnt);\n\tif (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))\n\t\treturn -EINVAL;\n\tif (!may_mount())\n\t\treturn -EPERM;\n\tif (path->dentry != path->mnt->mnt_root)\n\t\treturn -EINVAL;\n\tif (!check_mnt(mnt))\n\t\treturn -EINVAL;\n\tif (mnt->mnt.mnt_flags & MNT_LOCKED)\n\t\treturn -EINVAL;\n\tif ((flags & MNT_FORCE) && !capable(CAP_SYS_ADMIN))\n\t\treturn -EPERM;\n\treturn 0;\n}\n\nint path_umount(struct path *path, int flags)\n{\n\tstruct mount *mnt = real_mount(path->mnt);\n\tint ret = ksu_next_can_umount(path, flags);\n\tif (!ret)\n\t\tret = do_umount(mnt, flags);\n\tdput(path->dentry);\n\tmntput_no_expire(mnt);\n\treturn ret;\n}\n#endif /* CONFIG_KSU */\n\n'
                  if marker in txt:
                      txt = txt.replace(marker, block + marker, 1)
                  else:
                      txt += block
                  ns.write_text(txt)
                  print('[PATCH] fs/namespace.c: path_umount backport')
          internal = Path('fs/internal.h')
          if internal.exists():
              it = internal.read_text(errors='ignore')
              proto = 'int path_umount(struct path *path, int flags);'
              if proto not in it:
                  it += '\n#ifdef CONFIG_KSU\n' + proto + '\n#endif\n'
                  internal.write_text(it)
                  print('[PATCH] fs/internal.h: path_umount prototype')

          # SuSFS core/Kbuild/Kconfig repair.
          fs_make = Path('fs/Makefile')
          if fs_make.exists():
              mt = fs_make.read_text(errors='ignore')
              if 'CONFIG_KSU_SUSFS' not in mt:
                  mt += '\n# SuSFS for KernelSU Next v113\nobj-$(CONFIG_KSU_SUSFS) += susfs.o\n'
                  fs_make.write_text(mt)
                  print('[PATCH] fs/Makefile: add susfs.o')

          sus = Path('fs/susfs.c')
          if sus.exists():
              s = sus.read_text(errors='ignore')
              s = s.replace('#include "../drivers/kernelsu/core_hook.h"', '/* KSU_NEXT_SUSFS_V113_REMOVED_OLD_CORE_HOOK */')
              if 'KSU_NEXT_SUSFS_V113_TRY_UMOUNT_COMPAT' not in s:
                  compat = '\n#ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT\n/* KSU_NEXT_SUSFS_V113_TRY_UMOUNT_COMPAT */\nstatic void try_umount(const char *mnt, bool check_mnt, int flags)\n{\n\tstruct path path;\n\tint err;\n\tif (!mnt)\n\t\treturn;\n\terr = kern_path(mnt, 0, &path);\n\tif (err)\n\t\treturn;\n\tif (check_mnt && path.dentry != path.mnt->mnt_root) {\n\t\tpath_put(&path);\n\t\treturn;\n\t}\n\tpath_umount(&path, flags);\n}\n#endif\n\n'
                  anchor = 'spinlock_t susfs_spin_lock;'
                  if anchor in s:
                      s = s.replace(anchor, compat + anchor, 1)
                  else:
                      s = compat + s
              sus.write_text(s)
              print('[PATCH] fs/susfs.c: KernelSU Next compatibility checked')

          # Samsung S9 stock 4.9 tree does not expose Android GKI KABI reserve fields
          # such as inode->android_kabi_reserved* / super_block->android_kabi_reserved*.
          # SuSFS 1.4.2's SUS_KSTAT patch assumes those fields and v109 failed in fs/stat.c.
          # Keep SuSFS path/mount/try_umount enabled, but force SUS_KSTAT off for this tree.
          fs_h = Path('include/linux/fs.h')
          st_p = Path('fs/stat.c')
          if fs_h.exists() and st_p.exists():
              fs_text = fs_h.read_text(errors='ignore')
              st_text = st_p.read_text(errors='ignore')
              if 'android_kabi_reserved' not in fs_text and 'android_kabi_reserved' in st_text:
                  if 'S9_V113_DISABLE_SUS_KSTAT_NO_ANDROID_KABI' not in st_text:
                      st_text = st_text.replace('#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT', '#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) && 0 /* S9_V113_DISABLE_SUS_KSTAT_NO_ANDROID_KABI */')
                      st_p.write_text(st_text)
                      print('[PATCH] fs/stat.c: disabled SUS_KSTAT block because android_kabi_reserved fields are absent')
                  else:
                      print('[OK] fs/stat.c: SUS_KSTAT no-Android-KABI guard already present')

          block = '''
          menu "KernelSU - SuSFS"

          config KSU_SUSFS
          	bool "KernelSU - SuSFS support"
          	depends on KSU
          	default y

          config KSU_SUSFS_HAS_MAGIC_MOUNT
          	bool "Enable magic mount support"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SUS_PATH
          	bool "Enable sus path"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SUS_MOUNT
          	bool "Enable sus mount"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          	bool "Auto add KernelSU default mounts to sus mount"
          	depends on KSU_SUSFS_SUS_MOUNT
          	default y

          config KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          	bool "Auto add bind mounts to sus mount"
          	depends on KSU_SUSFS_SUS_MOUNT
          	default y

          config KSU_SUSFS_SUS_KSTAT
          	bool "Enable sus kstat"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_TRY_UMOUNT
          	bool "Enable try_umount"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          	bool "Auto add bind mounts to SuSFS try_umount"
          	depends on KSU_SUSFS_TRY_UMOUNT
          	default y

          config KSU_SUSFS_SPOOF_UNAME
          	bool "Enable uname spoofing"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_ENABLE_LOG
          	bool "Enable SUSFS kernel log"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          	bool "Hide KSU/SUSFS symbols"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          	bool "Spoof cmdline or bootconfig"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_OPEN_REDIRECT
          	bool "Enable open redirect"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_SUS_SU
          	bool "Enable SUS-SU runtime mode"
          	depends on KSU_SUSFS && KPROBES
          	default n

          endmenu
          '''
          kconfigs = [p for p in ksu_dir.rglob('Kconfig')]
          if not kconfigs:
              raise SystemExit('ERROR: no KernelSU Kconfig found')
          for kc in kconfigs:
              insert_before_last_endmenu(kc, block, 'KSU_SUSFS_KCONFIG_V113')

          for kb in list(ksu_dir.rglob('Kbuild')) + list(ksu_dir.rglob('Makefile')):
              text = kb.read_text(errors='ignore')
              if 'KSU_NEXT_SUSFS_BRIDGE_V113' not in text:
                  text += '\n# KSU_NEXT_SUSFS_BRIDGE_V113\nccflags-y += -I$(srctree)/include\n'
                  kb.write_text(text)
                  print(f'[PATCH] {kb}: add include ccflags')

          # Insert susfs_init into the KernelSU init file when a kernelsu_init body is present.
          init_done = False
          for p in ksu_dir.rglob('*.c'):
              t = p.read_text(errors='ignore')
              if 'kernelsu_init' not in t:
                  continue
              if 'KSU_NEXT_SUSFS_INIT_V113' not in t:
                  lines = t.splitlines(True)
                  pos = 0
                  for i, line in enumerate(lines[:100]):
                      if line.lstrip().startswith('#include'):
                          pos = i + 1
                  lines.insert(pos, '#ifdef CONFIG_KSU_SUSFS\n/* KSU_NEXT_SUSFS_INCLUDE_V113 */\n#include <linux/susfs.h>\nextern void susfs_init(void);\n#endif\n')
                  t = ''.join(lines)
                  m = re.search(r'(?:static\s+)?int\s+(?:__init\s+)?kernelsu_init\s*\([^)]*\)\s*\{', t)
                  if m:
                      insert_at = m.end()
                      t = t[:insert_at] + '\n#ifdef CONFIG_KSU_SUSFS\n\t/* KSU_NEXT_SUSFS_INIT_V113 */\n\t/* v113: local prototype prevents implicit declaration with clang -Werror. */\n\textern void susfs_init(void);\n\tsusfs_init();\n#endif\n' + t[insert_at:]
                      p.write_text(t)
                      print(f'[PATCH] {p}: inserted susfs_init in kernelsu_init')
                      init_done = True
                      break
              else:
                  init_done = True
                  break
          # v113 hardening: make sure susfs_init() has a visible prototype in the same block.
          for p in ksu_dir.rglob('*.c'):
              t = p.read_text(errors='ignore')
              if 'KSU_NEXT_SUSFS_INIT_V113' not in t or 'susfs_init();' not in t:
                  continue
              if 'extern void susfs_init(void);' not in t[t.find('KSU_NEXT_SUSFS_INIT_V113')-200:t.find('KSU_NEXT_SUSFS_INIT_V113')+300]:
                  t = t.replace('/* KSU_NEXT_SUSFS_INIT_V113 */\n\tsusfs_init();', '/* KSU_NEXT_SUSFS_INIT_V113 */\n\t/* v113: local prototype prevents implicit declaration with clang -Werror. */\n\textern void susfs_init(void);\n\tsusfs_init();', 1)
                  p.write_text(t)
                  print(f'[PATCH] {p}: added local susfs_init prototype for clang -Werror')
              break

          report = Path('SuSFS-build-info.txt')
          report.write_text('\n'.join([
              'S9 stock Q v113 KernelSU Next + SuSFS bridge',
              f'KSU_DIR={ksu_dir}',
              'SUSFS_BRANCH=' + os.environ.get('SUSFS_BRANCH', ''),
              'SUSFS_REPO=' + os.environ.get('SUSFS_REPO', ''),
              'required_config=CONFIG_KSU=y CONFIG_KSU_MANUAL_HOOK=y CONFIG_KSU_SUSFS=y CONFIG_KSU_SUSFS_SUS_KSTAT=n',
              'uptime_design=unchanged from v113 timekeeping-only /proc uptime patch',
          ]) + '\n')
          print(report.read_text())

          print('===== BRIDGE MARKER SUMMARY =====')
          for f in ['fs/exec.c', 'fs/open.c', 'fs/read_write.c', 'fs/stat.c', 'kernel/reboot.c', 'fs/namespace.c', 'fs/Makefile', 'fs/susfs.c']:
              t = read(f)
              if t is not None:
                  markers = sum(t.count(x) for x in ['KSU_NEXT_', 'KSU_SUSFS', 'susfs'])
                  print(f'{f}: markers={markers}')
          PYKSU

          echo "===== VERIFY KSU/SUSFS MARKERS ====="
          grep -RIn "CONFIG_KSU\|KSU_NEXT_MANUAL_HOOK\|KSU_NEXT_SUSFS\|KSU_SUSFS\|susfs_init\|path_umount\|SUSFS_VERSION" \
            Kconfig Makefile drivers fs kernel include 2>/dev/null | head -500 || true
          cat SuSFS-build-info.txt


      - name: Build kernel and dtb.img
        shell: bash
        working-directory: kernel
        run: |
          set -eo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC="clang --target=aarch64-linux-gnu --prefix=/usr/bin/aarch64-linux-gnu- -no-integrated-as"
          export HOSTCC=gcc
          export HOSTCXX=g++
          export AS=aarch64-linux-gnu-as
          export LD=aarch64-linux-gnu-ld.bfd
          export AR=aarch64-linux-gnu-ar
          export NM=aarch64-linux-gnu-nm
          export OBJCOPY=aarch64-linux-gnu-objcopy
          export OBJDUMP=aarch64-linux-gnu-objdump
          export STRIP=aarch64-linux-gnu-strip
          export READELF=aarch64-linux-gnu-readelf
          export PLATFORM_VERSION="$PLATFORM_VERSION"
          export ANDROID_MAJOR_VERSION="$ANDROID_MAJOR_VERSION"
          export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          export KBUILD_BUILD_USER=khiconjk
          export KBUILD_BUILD_HOST=github-actions

          MAKE_ARGS=(
            V=0
            ARCH=arm64
            SUBARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
            "CC=clang --target=aarch64-linux-gnu --prefix=/usr/bin/aarch64-linux-gnu- -no-integrated-as"
            HOSTCC=gcc
            HOSTCXX=g++
            AS=aarch64-linux-gnu-as
            LD=aarch64-linux-gnu-ld.bfd
            AR=aarch64-linux-gnu-ar
            NM=aarch64-linux-gnu-nm
            OBJCOPY=aarch64-linux-gnu-objcopy
            OBJDUMP=aarch64-linux-gnu-objdump
            STRIP=aarch64-linux-gnu-strip
            READELF=aarch64-linux-gnu-readelf
            PLATFORM_VERSION="$PLATFORM_VERSION"
            ANDROID_MAJOR_VERSION="$ANDROID_MAJOR_VERSION"
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          )

          echo "===== COMPILER TEST ====="
          clang --target=aarch64-linux-gnu --prefix=/usr/bin/aarch64-linux-gnu- -no-integrated-as -x c -c /dev/null -o /tmp/clang-arm64-test.o
          file /tmp/clang-arm64-test.o

          BASE_DEFCONFIG="arch/arm64/configs/exynos9810_defconfig"
          DEVICE_DEFCONFIG_PATH="arch/arm64/configs/$DEVICE_DEFCONFIG"
          TEMP_DEFCONFIG_PATH="arch/arm64/configs/$TEMP_DEFCONFIG"

          if [ ! -f "$BASE_DEFCONFIG" ]; then
            echo "ERROR: Missing $BASE_DEFCONFIG"
            exit 1
          fi
          if [ ! -f "$DEVICE_DEFCONFIG_PATH" ]; then
            echo "ERROR: Missing $DEVICE_DEFCONFIG_PATH"
            exit 1
          fi

          cat "$BASE_DEFCONFIG" "$DEVICE_DEFCONFIG_PATH" > "$TEMP_DEFCONFIG_PATH"
          {
            echo "# v113 stock Android 10 safety config additions"
            echo "CONFIG_ANDROID=y"
            echo "CONFIG_ANDROID_BINDER_IPC=y"
            echo "CONFIG_ANDROID_LOW_MEMORY_KILLER=y"
            echo "CONFIG_EXYNOS_DTBTOOL=y"
            echo "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y"
            echo "# CONFIG_KSU_SUSFS_SUS_KSTAT is not set"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "# CONFIG_KSU_DEBUG is not set"
            echo "# CONFIG_KSU_KPROBES_HOOK is not set"
            echo "# CONFIG_KSU_KPROBE_HOOKS is not set"
            echo "# CONFIG_KSU_SUSFS_ENABLE_LOG is not set"
            echo "# CONFIG_KSU_SUSFS_SPOOF_UNAME is not set"
            echo "# CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG is not set"
            echo "# CONFIG_KSU_SUSFS_OPEN_REDIRECT is not set"
            echo "# CONFIG_KSU_SUSFS_SUS_SU is not set"
          } >> "$TEMP_DEFCONFIG_PATH"

          echo "===== DEFCONFIG ====="
          make "${MAKE_ARGS[@]}" "$TEMP_DEFCONFIG" 2>&1 | tee defconfig.log

          echo "===== OLDDEFCONFIG ====="
          make "${MAKE_ARGS[@]}" olddefconfig 2>&1 | tee olddefconfig.log

          echo "===== HARD REPAIR KSU/SUSFS CONFIG AFTER OLDDEFCONFIG ====="
          python3 - <<'PYCONFIG'
          from pathlib import Path
          p = Path('.config')
          text = p.read_text(errors='ignore').splitlines()
          set_y = {
              'CONFIG_KSU',
              'CONFIG_KSU_MANUAL_HOOK',
              'CONFIG_KSU_SUSFS',
              'CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT',
              'CONFIG_KSU_SUSFS_SUS_PATH',
              'CONFIG_KSU_SUSFS_SUS_MOUNT',
              'CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT',
              'CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT',
              'CONFIG_KSU_SUSFS_TRY_UMOUNT',
              'CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT',
              'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS',
          }
          set_n = {
              'CONFIG_KSU_DEBUG',
              'CONFIG_KSU_DISABLE_MANAGER',
              'CONFIG_KSU_DISABLE_POLICY',
              'CONFIG_KSU_ALLOWLIST_WORKAROUND',
              'CONFIG_KSU_KPROBES_HOOK',
              'CONFIG_KSU_KPROBE_HOOKS',
              'CONFIG_KSU_SUSFS_ENABLE_LOG',
              'CONFIG_KSU_SUSFS_SUS_KSTAT',
              'CONFIG_KSU_SUSFS_SUS_OVERLAYFS',
              'CONFIG_KSU_SUSFS_SPOOF_UNAME',
              'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG',
              'CONFIG_KSU_SUSFS_OPEN_REDIRECT',
              'CONFIG_KSU_SUSFS_SUS_SU',
          }
          keys = set_y | set_n
          out = []
          for line in text:
              stripped = line.strip()
              key = None
              if stripped.startswith('CONFIG_') and '=' in stripped:
                  key = stripped.split('=', 1)[0]
              elif stripped.startswith('# CONFIG_') and stripped.endswith(' is not set'):
                  key = stripped.split()[1]
              if key in keys:
                  continue
              out.append(line)
          out.append('')
          out.append('# KSU Next + SuSFS hard repair v113 after olddefconfig')
          for k in sorted(set_y):
              out.append(f'{k}=y')
          for k in sorted(set_n):
              out.append(f'# {k} is not set')
          p.write_text('\n'.join(out) + '\n')
          print('[PATCH] .config: force-wrote KSU/SuSFS options v113')
          PYCONFIG

          echo "===== OLDDEFCONFIG AFTER KSU/SUSFS HARD REPAIR ====="
          make "${MAKE_ARGS[@]}" olddefconfig 2>&1 | tee -a olddefconfig.log

          echo "===== VERIFY REQUIRED KSU/SUSFS CONFIG ====="
          grep -E "CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS" .config || true
          for REQUIRED in CONFIG_KSU CONFIG_KSU_MANUAL_HOOK CONFIG_KSU_SUSFS; do
            if ! grep -q "^${REQUIRED}=y" .config; then
              echo "ERROR: ${REQUIRED}=y was not preserved in .config"
              grep -n "${REQUIRED}" .config || true
              exit 1
            fi
          done

          echo "===== CONFIG CHECK ====="
          grep -E "CONFIG_SOC_EXYNOS9810|CONFIG_CAMERA_STAR|CONFIG_CAMERA_STAR2|CONFIG_CAMERA_CROWN|CONFIG_EXYNOS_DTBTOOL|CONFIG_BUILD_ARM64_APPENDED|CONFIG_MODULES|CONFIG_ANDROID|CONFIG_ANDROID_BINDER|CONFIG_ANDROID_LOW_MEMORY_KILLER|CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS" .config || true

          echo "===== BUILD IMAGE + DTBS + DTB.IMG ====="
          make -j"$(nproc --all)" "${MAKE_ARGS[@]}" Image Image.gz dtbs dtb.img 2>&1 | tee build.log

          echo "===== IF dtb.img IS STILL MISSING, TRY dtb.img AGAIN WITH V=1 ====="
          if [ ! -f "arch/arm64/boot/dtb.img" ]; then
            make -j"$(nproc --all)" "${MAKE_ARGS[@]}" V=1 dtb.img 2>&1 | tee -a build.log
          fi

          echo "===== OUTPUTS ====="
          ls -lah arch/arm64/boot || true
          find arch/arm64/boot -maxdepth 8 -type f \( -name "Image*" -o -name "*.dtb" -o -name "dtb.img" -o -name "*.ko" \) -print -exec ls -lh {} \; || true

      - name: Create v113 uptime check scripts and readable build log
        if: always()
        shell: bash
        run: |
          set +e
          OUT_DIR="$GITHUB_WORKSPACE/out"
          KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
          mkdir -p "$OUT_DIR/raw"

          cat > "$OUT_DIR/v113-stock-q-readme.txt" <<'EOF_README'
          ss-S9 stock Android 10 v113 random uptime + runtime surface build
          =================================================

          What this build does:
          - Builds Samsung Exynos 9810 kernel for stock Android 10 / Q.
          - Applies v113 delayed runtime-surface uptime patch.
          - Keeps CLOCK_REALTIME unchanged.
          - Fakes /proc/uptime, btime, CLOCK_BOOTTIME, CLOCK_MONOTONIC, CLOCK_MONOTONIC_RAW, and Android Runtime uptime after a 180 second boot grace period.
          - Patches kernel/time/timekeeping.c and lib/vdso/vgettimeofday.c for syscall + VDSO clock surfaces.
          - Hides ksu/susfs names from /proc/kallsyms seq output.
          - Does not patch WiFi, DHD, wificond, or vendor HAL.

          Files to send back to ChatGPT if build fails:
          1. chatgpt-readable-build-log-v113-stock-q.txt
          2. build.log
          3. defconfig.log
          4. olddefconfig.log
          5. uptime-v113-stock-q-apply.log
          6. s9-stock-q-random-uptime-v113-report.txt
          EOF_README

          cat > "$OUT_DIR/v113-stock-q-adb-check.bat" <<'EOF_BAT'
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          title S9 Stock Q v113 runtime surface check

          set "LOG=%~dp0s9_stock_q_v113_uptime_check.log"
          set "ADB=adb"
          if exist "%~dp0adb.exe" set "ADB=%~dp0adb.exe"
          set "MIN_DAYS=15"
          set "MAX_DAYS=20"

          >"%LOG%" echo ============================================================
          >>"%LOG%" echo S9 STOCK Q V113 RUNTIME SURFACE CHECK
          >>"%LOG%" echo Host start: %date% %time%
          >>"%LOG%" echo Expected fake uptime/runtime days after 180s grace: %MIN_DAYS%..%MAX_DAYS%
          >>"%LOG%" echo ============================================================

          echo [1/7] Checking ADB...
          "%ADB%" version >>"%LOG%" 2>&1
          if errorlevel 1 (
            echo ERROR: adb not found. Put adb.exe beside this BAT or add platform-tools to PATH.
            >>"%LOG%" echo ERROR: adb not found.
            goto :end
          )

          echo [2/7] Waiting for device...
          "%ADB%" wait-for-device >>"%LOG%" 2>&1
          "%ADB%" devices -l >>"%LOG%" 2>&1

          echo [3/7] Capturing identity...
          >>"%LOG%" echo.
          >>"%LOG%" echo [identity]
          "%ADB%" shell id >>"%LOG%" 2>&1
          "%ADB%" shell uname -a >>"%LOG%" 2>&1
          "%ADB%" shell getprop ro.product.device >>"%LOG%" 2>&1
          "%ADB%" shell getprop ro.product.model >>"%LOG%" 2>&1
          "%ADB%" shell getprop ro.build.version.release >>"%LOG%" 2>&1
          "%ADB%" shell getprop ro.build.version.sdk >>"%LOG%" 2>&1

          echo [4/7] Capturing uptime surfaces...
          >>"%LOG%" echo.
          >>"%LOG%" echo [uptime surfaces]
          "%ADB%" shell cat /proc/uptime >>"%LOG%" 2>&1
          "%ADB%" shell "cat /proc/stat | grep btime" >>"%LOG%" 2>&1
          "%ADB%" shell date +%%s >>"%LOG%" 2>&1
          "%ADB%" shell uptime >>"%LOG%" 2>&1

          for /f "tokens=1" %%A in ('"%ADB%" shell cat /proc/uptime 2^>nul') do set "UPRAW=%%A"
          for /f "tokens=1 delims=." %%A in ("%UPRAW%") do set "UPSEC=%%A"
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$up=[double]('%UPRAW%'.Trim()); $min=%MIN_DAYS%*86400; $max=(%MAX_DAYS%*86400)+3599; if($up -ge $min -and $up -le $max){'PASS_PROC_UPTIME_RANGE seconds=' + [int]$up + ' expected=' + $min + '..' + $max}else{'FAIL_PROC_UPTIME_RANGE seconds=' + [int]$up + ' expected=' + $min + '..' + $max}" >>"%LOG%" 2>&1

          echo [5/7] Capturing Android elapsed realtime note...
          >>"%LOG%" echo.
          >>"%LOG%" echo [android elapsedRealtime note]
          "%ADB%" shell dumpsys activity service com.android.systemui/.SystemUIService 1^>/dev/null 2^>nul
          "%ADB%" shell toybox date +nowRTC=%%s000 >>"%LOG%" 2>&1
          "%ADB%" shell "dumpsys alarm | grep -Ei 'nowELAPSED|Elapsed|RTC' | head -20" >>"%LOG%" 2>&1
          >>"%LOG%" echo NOTE: v113 expects Android nowELAPSED and Runtime uptime to be fake after the 180s boot grace period.

          echo [6/8] Checking KSU/SuSFS symbol surface...
          >>"%LOG%" echo.
          >>"%LOG%" echo [kallsyms ksu/susfs surface]
          "%ADB%" shell su -c "cat /proc/kallsyms 2>/dev/null | grep -iE 'kernelsu|ksu_|__ksu|anon_ksu|susfs|sus_su' | head -80" >>"%LOG%" 2>&1
          >>"%LOG%" echo EXPECTED: no output above, or only unrelated false positives.

          echo [7/8] Checking WiFi and bad kernel keywords...
          >>"%LOG%" echo.
          >>"%LOG%" echo [wifi]
          "%ADB%" shell cmd wifi status >>"%LOG%" 2>&1
          "%ADB%" shell "dumpsys wifi | grep -Ei 'Wifi is|curState=|mIfaceIsUp|mClientInterfaceName|Supplicant state|Link speed|RSSI|CMD_IP_CONFIGURATION_SUCCESSFUL|native daemons died|Vendor HAL died' | head -120" >>"%LOG%" 2>&1
          >>"%LOG%" echo.
          >>"%LOG%" echo [dmesg bad keyword scan]
          "%ADB%" shell "dmesg | grep -Ei 'dhdpcie_bus_suspend: Entering suspend state|send H2D_HOST_D3_INFORM|Got D3 Ack|D3_ACK|exynos-pcie.*link down|dhdpcie_linkdown_cb|Event HANG|CMD_RECOVERY_DISABLE_WIFI|WifiNative Failure|One of the native daemons died|Vendor HAL died|s9_random_uptime_v113' | tail -120" >>"%LOG%" 2>&1

          echo [8/8] Done.
          echo Log saved: %LOG%
          >>"%LOG%" echo.
          >>"%LOG%" echo DONE: %date% %time%

          :end
          echo.
          echo Send this log back to ChatGPT if anything fails:
          echo %LOG%
          pause
          exit /b

          EOF_BAT

          sed -i 's/^          //' "$OUT_DIR/v113-stock-q-readme.txt" "$OUT_DIR/v113-stock-q-adb-check.bat"

          LOG="$OUT_DIR/chatgpt-readable-build-log-v113-stock-q.txt"
          {
            echo "===== CHATGPT READABLE BUILD LOG V113 STOCK Q ====="
            echo "date_utc=$(date -u)"
            echo "workflow=v113-stock-q-rup"
            echo "repo=${GITHUB_REPOSITORY:-unknown}"
            echo "ref_to_build=${{ inputs.ref_to_build }}"
            echo "device=${DEVICE:-unknown}"
            echo "model=${MODEL_NAME:-unknown}"
            echo "platform=${PLATFORM_VERSION:-unknown} android_major=${ANDROID_MAJOR_VERSION:-unknown}"
            echo
            if [ -d "$KERNEL_DIR" ]; then
              cd "$KERNEL_DIR"
              echo "===== COMMIT ====="
              git rev-parse --short HEAD 2>/dev/null || true
              echo
              echo "===== KERNEL VERSION ====="
              grep -nE "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=" Makefile 2>/dev/null || true
              echo
              echo "===== UPTIME REPORT ====="
              cat s9-stock-q-random-uptime-v113-report.txt 2>/dev/null || true
              echo
              echo "===== UPTIME APPLY LOG ====="
              cat uptime-v113-stock-q-apply.log 2>/dev/null || true
              echo
              echo "===== KSU/SUSFS REPORT ====="
              cat SuSFS-build-info.txt 2>/dev/null || true
              echo
              echo "===== KSU/SUSFS APPLY LOG ====="
              cat ksu-susfs-v113-apply.log 2>/dev/null || true
              echo
              echo "===== RANDOM UPTIME MARKERS ====="
              grep -RniE "S9_RANDOM_UPTIME_V113|s9_random_uptime_apply_boot_offset|S9_RANDOM_UPTIME_SELECTED_DAYS|offs_boot = ktime_set|ktime_add\(tk->offs_boot" kernel/time/timekeeping.c 2>/dev/null || true
              echo
              echo "===== CONFIG SNAPSHOT ====="
              grep -E "CONFIG_SOC_EXYNOS9810|CONFIG_CAMERA_STAR|CONFIG_CAMERA_STAR2|CONFIG_CAMERA_CROWN|CONFIG_EXYNOS_DTBTOOL|CONFIG_BUILD_ARM64_APPENDED|CONFIG_MODULES|CONFIG_ANDROID|CONFIG_ANDROID_BINDER|CONFIG_ANDROID_LOW_MEMORY_KILLER" .config 2>/dev/null || true
              echo
              echo "===== BUILD ERRORS/WARNINGS SUMMARY ====="
              grep -nEi "error:|fatal error:|undefined reference|ld.lld|ld:|No such file|No rule to make target|FAILED|recipe for target|Stop\.|not found|Permission denied|unrecognized option|unknown argument|unsupported option|Illegal option|dtb.img" \
                clean.log defconfig.log olddefconfig.log build.log *.log 2>/dev/null | tail -350 || true
              echo
              echo "===== LAST 300 BUILD LINES ====="
              tail -300 build.log 2>/dev/null || true
            else
              echo "kernel directory missing"
            fi
            echo
            echo "===== OUT ARTIFACT TREE ====="
            find "$OUT_DIR" -maxdepth 3 -type f -print -exec ls -lh {} \; 2>/dev/null || true
          } > "$LOG" 2>&1

          echo "===== CHATGPT READABLE LOG PREVIEW ====="
          sed -n '1,260p' "$LOG" || true

      - name: Collect kernel outputs
        if: success()
        shell: bash
        working-directory: kernel
        run: |
          set -e
          OUT_DIR="$GITHUB_WORKSPACE/out"
          RAW_DIR="$OUT_DIR/raw"
          mkdir -p "$RAW_DIR"

          echo "===== REQUIRED OUTPUT CHECK ====="
          if [ ! -f "arch/arm64/boot/Image" ]; then
            echo "ERROR: arch/arm64/boot/Image not found"
            find arch/arm64/boot -maxdepth 8 -type f -print || true
            exit 1
          fi
          if [ ! -f "arch/arm64/boot/dtb.img" ]; then
            echo "ERROR: arch/arm64/boot/dtb.img not found"
            find arch/arm64/boot -maxdepth 8 -type f \( -name "*.dtb" -o -name "dtb.img" \) -print -exec ls -lh {} \; || true
            grep -n "CONFIG_EXYNOS_DTBTOOL" .config || true
            exit 1
          fi

          cp -av "arch/arm64/boot/Image" "$RAW_DIR/Image"
          cp -av "arch/arm64/boot/Image" "$RAW_DIR/zImage"
          cp -av "arch/arm64/boot/dtb.img" "$RAW_DIR/dtb.img"
          [ -f "arch/arm64/boot/Image.gz" ] && cp -av "arch/arm64/boot/Image.gz" "$RAW_DIR/Image.gz" || true
          [ -f "arch/arm64/boot/Image.gz-dtb" ] && cp -av "arch/arm64/boot/Image.gz-dtb" "$RAW_DIR/Image.gz-dtb" || true

          find . -type f -name "*.ko" -print0 > "$OUT_DIR/modules.list" || true
          if [ -s "$OUT_DIR/modules.list" ]; then
            tar --null -czf "$OUT_DIR/modules-${DEVICE}-${MODEL_NAME}.tar.gz" --files-from "$OUT_DIR/modules.list"
          else
            echo "No .ko modules found" > "$OUT_DIR/modules-${DEVICE}-${MODEL_NAME}.txt"
          fi

          cp -av clean.log "$OUT_DIR/clean.log" || true
          cp -av defconfig.log "$OUT_DIR/defconfig.log" || true
          cp -av olddefconfig.log "$OUT_DIR/olddefconfig.log" || true
          cp -av build.log "$OUT_DIR/build.log" || true
          cp -av uptime-v113-stock-q-apply.log "$OUT_DIR/uptime-v113-stock-q-apply.log" || true
          cp -av ksu-susfs-v113-apply.log "$OUT_DIR/ksu-susfs-v113-apply.log" || true
          cp -av SuSFS-build-info.txt "$OUT_DIR/SuSFS-build-info.txt" || true
          cp -av susfs-*.log "$OUT_DIR/" 2>/dev/null || true
          cp -av susfs-*.txt "$OUT_DIR/" 2>/dev/null || true
          cp -av ksu-*.txt "$OUT_DIR/" 2>/dev/null || true
          cp -av s9-stock-q-random-uptime-v113-report.txt "$OUT_DIR/s9-stock-q-random-uptime-v113-report.txt" || true
          cp -av .config "$OUT_DIR/kernel.config" || true
          echo "===== ARTIFACT TREE ====="
          find "$OUT_DIR" -maxdepth 3 -type f -print -exec ls -lh {} \;

      - name: Package AnyKernel3 zip
        if: success() && inputs.package_anykernel == 'true'
        shell: bash
        run: |
          set -e
          OUT_DIR="$GITHUB_WORKSPACE/out"
          RAW_DIR="$OUT_DIR/raw"
          AK_DIR="$GITHUB_WORKSPACE/AnyKernel3"
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          ZIP_NAME="ss-S9-${DEVICE}-${MODEL_NAME}-StockQ-v113-ksu-next-susfs-rup-${SHORT_SHA}.zip"

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 "$AK_DIR"
          cd "$AK_DIR"
          rm -rf .git .github
          rm -f Image Image.gz Image.gz-dtb Image-dtb zImage zImage-dtb dtb dtb.img dtbo.img
          cp -av "$RAW_DIR/zImage" ./zImage
          cp -av "$RAW_DIR/dtb.img" ./dtb.img
          rm -f anykernel.sh

          printf '%s\n' \
            "### AnyKernel3 Ramdisk Mod Script" \
            "## Auto-generated for ss-S9 stock Android 10" \
            "## Target: Samsung Galaxy S9 family ${MODEL_NAME} / ${DEVICE} / Stock Android 10 Q" \
            "" \
            "properties() { '" \
            "kernel.string=ss-S9 ${DEVICE} ${MODEL_NAME} Stock Android10 Q v113 KSU-Next SuSFS RandomUptime15-20d" \
            "do.devicecheck=1" \
            "do.modules=0" \
            "do.systemless=1" \
            "do.cleanup=1" \
            "do.cleanuponabort=0" \
            "device.name1=${AK_DEVICE_1}" \
            "device.name2=${AK_DEVICE_2}" \
            "device.name3=${AK_DEVICE_3}" \
            "device.name4=${AK_DEVICE_4}" \
            "device.name5=${AK_DEVICE_5}" \
            "device.name6=${DEVICE}" \
            "supported.versions=10" \
            "supported.patchlevels=" \
            "'; }" \
            "" \
            "BLOCK=boot" \
            "for CANDIDATE in \\" \
            "  /dev/block/platform/11120000.ufs/by-name/BOOT \\" \
            "  /dev/block/platform/11120000.ufs/by-name/boot \\" \
            "  /dev/block/bootdevice/by-name/boot \\" \
            "  /dev/block/by-name/boot" \
            "do" \
            '  if [ -e "$CANDIDATE" ]; then' \
            '    BLOCK="$CANDIDATE"' \
            "    break" \
            "  fi" \
            "done" \
            "" \
            "IS_SLOT_DEVICE=0" \
            "RAMDISK_COMPRESSION=auto" \
            "PATCH_VBMETA_FLAG=auto" \
            "" \
            ". tools/ak3-core.sh" \
            "" \
            "dump_boot" \
            "write_boot" \
            > anykernel.sh

          chmod +x anykernel.sh
          echo "===== anykernel.sh ====="
          cat anykernel.sh
          zip -r9 "$OUT_DIR/$ZIP_NAME" ./* -x "*.git*" "README.md"
          ls -lh "$OUT_DIR/$ZIP_NAME"

      - name: Show useful errors
        if: failure()
        shell: bash
        working-directory: kernel
        run: |
          echo "===== ERROR LINES ====="
          grep -nEi "error:|fatal error:|undefined reference|ld.lld|ld:|No such file|No rule to make target|FAILED|recipe for target|Stop\.|not found|Permission denied|unrecognized option|unknown argument|unsupported option|Illegal option|dtb.img" \
            clean.log defconfig.log olddefconfig.log build.log *.log 2>/dev/null | tail -350 || true
          echo "===== LAST 350 BUILD LINES ====="
          tail -350 build.log 2>/dev/null || true
          echo "===== LAST 180 DEFCONFIG LINES ====="
          tail -180 defconfig.log 2>/dev/null || true
          echo "===== BOOT OUTPUT TREE ====="
          find arch/arm64/boot -maxdepth 8 -type f -print -exec ls -lh {} \; 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss-S9-${{ steps.target.outputs.device }}-${{ steps.target.outputs.model }}-stock-q-v113-ksu-next-susfs-random-uptime
          path: |
            out/*.zip
            out/raw/*
            out/*.log
            out/*.txt
            out/*.bat
            out/kernel.config
            out/modules-*
            kernel/*.log
            kernel/*.txt
            kernel/.config
            kernel/**/*.rej
            kernel/**/*.orig
          if-no-files-found: ignore
          compression-level: 6
