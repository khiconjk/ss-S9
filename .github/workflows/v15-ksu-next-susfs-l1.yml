name: v15 KSU Next + SuSFS L1

"on":
  workflow_dispatch:
    inputs:
      ref_to_build:
        description: "Branch/ref to build"
        required: true
        default: "test_kernel"
      device:
        description: "Device target"
        required: true
        default: "starlte"
        type: choice
        options:
          - starlte
          - star2lte
          - crownlte

permissions:
  contents: read

concurrency:
  group: ss-s9-manual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  SUBARCH: arm64
  PLATFORM_VERSION: "10"
  ANDROID_MAJOR_VERSION: q
  TEMP_DEFCONFIG: exynos9810_temp_defconfig
  SUSFS_BRANCH: "1.4.2-kernel-4.9"
  SUSFS_REPO: "https://gitlab.com/1392726643/susfs4ksu.git"

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/local/share/boost || true
          sudo apt-get clean || true
          df -h

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref_to_build }}
          fetch-depth: 1
          path: kernel

      - name: Install packages
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            build-essential \
            ca-certificates \
            ccache \
            clang \
            cpio \
            flex \
            g++ \
            gcc \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            make \
            patch \
            pahole \
            perl \
            python3 \
            python-is-python3 \
            rsync \
            unzip \
            zip

          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

          echo "===== TOOLCHAIN ====="
          clang --version
          aarch64-linux-gnu-gcc --version
          aarch64-linux-gnu-as --version
          aarch64-linux-gnu-ld.bfd --version
          arm-linux-gnueabi-gcc --version
          arm-linux-gnueabi-as --version

      - name: Select device config
        id: target
        shell: bash
        run: |
          set -e

          DEVICE="${{ inputs.device }}"

          case "$DEVICE" in
            starlte)
              DEVICE_DEFCONFIG="exynos9810-starlte_defconfig"
              MODEL_NAME="G960NK"
              AK_DEVICE_1="starlte"
              AK_DEVICE_2="starlteks"
              AK_DEVICE_3="starltekor"
              AK_DEVICE_4="SM-G960N"
              ;;
            star2lte)
              DEVICE_DEFCONFIG="exynos9810-star2lte_defconfig"
              MODEL_NAME="G965"
              AK_DEVICE_1="star2lte"
              AK_DEVICE_2="star2lteks"
              AK_DEVICE_3="star2ltekor"
              AK_DEVICE_4="SM-G965N"
              ;;
            crownlte)
              DEVICE_DEFCONFIG="exynos9810-crownlte_defconfig"
              MODEL_NAME="N960"
              AK_DEVICE_1="crownlte"
              AK_DEVICE_2="crownlteks"
              AK_DEVICE_3="crownltekor"
              AK_DEVICE_4="SM-N960N"
              ;;
            *)
              echo "Unsupported device: $DEVICE"
              exit 1
              ;;
          esac

          {
            echo "DEVICE=$DEVICE"
            echo "DEVICE_DEFCONFIG=$DEVICE_DEFCONFIG"
            echo "MODEL_NAME=$MODEL_NAME"
            echo "AK_DEVICE_1=$AK_DEVICE_1"
            echo "AK_DEVICE_2=$AK_DEVICE_2"
            echo "AK_DEVICE_3=$AK_DEVICE_3"
            echo "AK_DEVICE_4=$AK_DEVICE_4"
          } >> "$GITHUB_ENV"

          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "model=$MODEL_NAME" >> "$GITHUB_OUTPUT"

      - name: Show source information
        shell: bash
        working-directory: kernel
        run: |
          set -e

          echo "===== COMMIT ====="
          git rev-parse --short HEAD

          echo "===== MAKEFILE VERSION ====="
          grep -nE "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=" Makefile || true

          echo "===== DEFCONFIG CHECK ====="
          ls -lah arch/arm64/configs | grep -E "exynos9810|starlte|star2lte|crownlte" || true

          echo "===== TARGET ====="
          echo "DEVICE=$DEVICE"
          echo "MODEL_NAME=$MODEL_NAME"
          echo "DEVICE_DEFCONFIG=$DEVICE_DEFCONFIG"
          echo "PLATFORM_VERSION=$PLATFORM_VERSION"
          echo "ANDROID_MAJOR_VERSION=$ANDROID_MAJOR_VERSION"

      - name: Clean source tree safely
        shell: bash
        working-directory: kernel
        run: |
          set -e

          echo "===== CLEAN BY GIT RESET/CLEAN =====" | tee clean.log
          git reset --hard HEAD | tee -a clean.log
          git clean -fdx | tee -a clean.log

          rm -f "arch/arm64/configs/$TEMP_DEFCONFIG"
          rm -f .config .config.old
          rm -rf include/config include/generated arch/arm64/include/generated
          rm -f build.log defconfig.log olddefconfig.log

          echo "Clean done" | tee -a clean.log


      - name: Patch kernel release to G960NK v15 KSU Next + SuSFS L1
        shell: bash
        working-directory: kernel
        run: |
          set -e

          echo "===== BEFORE VERSION PATCH ====="
          grep -nE "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=" Makefile || true

          python3 - <<'PY'
          from pathlib import Path
          import re

          makefile = Path("Makefile")
          text = makefile.read_text(errors="ignore")

          text = re.sub(r"^SUBLEVEL\s*=\s*.*$", "SUBLEVEL = 220", text, flags=re.MULTILINE)

          if re.search(r"^EXTRAVERSION\s*=", text, flags=re.MULTILINE):
              text = re.sub(r"^EXTRAVERSION\s*=\s*.*$", "EXTRAVERSION = -G960NK-v15-ksunext-susfs-l1", text, flags=re.MULTILINE)
          else:
              text = text.replace("SUBLEVEL = 220", "SUBLEVEL = 220\nEXTRAVERSION = -G960NK-v15-ksunext-susfs-l1", 1)

          makefile.write_text(text)
          PY

          echo "===== AFTER VERSION PATCH ====="
          grep -nE "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=" Makefile || true

          echo "Expected UTS_RELEASE prefix: 4.9.220-G960NK-v15-ksunext-susfs-l1"


      - name: Patch clang external assembler prefix
        shell: bash
        working-directory: kernel
        run: |
          set -e

          echo "===== BEFORE PATCH: clang prefix lines ====="
          grep -RIn -- "--prefix=" Makefile scripts arch/arm64 2>/dev/null || true
          grep -RIn -- "gcc-toolchain" Makefile scripts arch/arm64 2>/dev/null || true
          grep -RIn -- "no-integrated-as" Makefile scripts arch/arm64 2>/dev/null || true

          python3 - <<'PY'
          from pathlib import Path

          search_roots = [
              Path("Makefile"),
              Path("scripts"),
              Path("arch/arm64"),
          ]

          files = []
          for root in search_roots:
              if root.is_file():
                  files.append(root)
              elif root.is_dir():
                  files.extend([p for p in root.rglob("*") if p.is_file()])

          replacements = {
              "--prefix=$(GCC_TOOLCHAIN_DIR)": "--prefix=$(GCC_TOOLCHAIN_DIR)$(notdir $(CROSS_COMPILE))",
              "--prefix=$(dir $(shell which $(CROSS_COMPILE)elfedit))": "--prefix=$(dir $(shell which $(CROSS_COMPILE)elfedit))$(notdir $(CROSS_COMPILE))",
              "--prefix=$(dir $(shell which $(CROSS_COMPILE)gcc))": "--prefix=$(dir $(shell which $(CROSS_COMPILE)gcc))$(notdir $(CROSS_COMPILE))",
              "--prefix=$(dir $(shell which $(CROSS_COMPILE)ld))": "--prefix=$(dir $(shell which $(CROSS_COMPILE)ld))$(notdir $(CROSS_COMPILE))",
          }

          changed = []

          for path in files:
              try:
                  text = path.read_text(errors="ignore")
              except Exception:
                  continue

              original = text

              for old, new in replacements.items():
                  if old in text and new not in text:
                      text = text.replace(old, new)

              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          print("Changed files:")
          if changed:
              for item in changed:
                  print(" -", item)
          else:
              print(" - none")
          PY

          echo "===== AFTER PATCH: clang prefix lines ====="
          grep -RIn -- "--prefix=" Makefile scripts arch/arm64 2>/dev/null || true
          grep -RIn -- "gcc-toolchain" Makefile scripts arch/arm64 2>/dev/null || true
          grep -RIn -- "no-integrated-as" Makefile scripts arch/arm64 2>/dev/null || true

          echo "===== CHECK TARGET BINUTILS ====="
          command -v aarch64-linux-gnu-as
          command -v aarch64-linux-gnu-ld.bfd
          command -v aarch64-linux-gnu-gcc


      - name: Add KernelSU Next official legacy
        shell: bash
        working-directory: kernel
        run: |
          set -e

          echo "===== ADD KERNELSU NEXT OFFICIAL LEGACY v11 ====="
          rm -rf KernelSU KernelSU-Next drivers/kernelsu kernel/kernelsu
          rm -f ksu-path.log ksu-files-preview.txt ksu-markers.txt

          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

          echo "===== KERNELSU NEXT PATH AUTODETECT ====="
          KSU_DIR=""

          for CANDIDATE in KernelSU-Next KernelSU drivers/kernelsu kernel/kernelsu; do
            if [ -e "$CANDIDATE" ]; then
              KSU_DIR="$CANDIDATE"
              break
            fi
          done

          if [ -n "$KSU_DIR" ]; then
            echo "KSU_DIR=$KSU_DIR" | tee ksu-path.log
            find "$KSU_DIR" -maxdepth 3 -type f \( -name "Kconfig" -o -name "Makefile" -o -name "*.c" -o -name "*.h" \) > ksu-files-preview.txt || true
            sed -n '1,180p' ksu-files-preview.txt || true
          else
            echo "KernelSU Next directory not found by common names."
            echo "This can still be valid if setup.sh patched source directly."
            find . -maxdepth 2 -type d | sort > ksu-files-preview.txt || true
            sed -n '1,180p' ksu-files-preview.txt || true
          fi

          echo "===== KSU NEXT PATCH MARKERS ====="
          grep -RIn "KernelSU-Next\|KernelSU\|CONFIG_KSU\|source.*KSU\|kernelsu" Kconfig Makefile drivers fs kernel security arch > ksu-markers.txt 2>/dev/null || true
          sed -n '1,260p' ksu-markers.txt || true

          echo "===== VERIFY KSU NEXT INTEGRATION ====="
          if [ ! -s ksu-markers.txt ]; then
            echo "ERROR: KernelSU Next setup completed but no KSU marker was found"
            exit 1
          fi

          echo "KernelSU Next setup markers found."



      - name: Patch KernelSU Next manual hooks
        shell: bash
        working-directory: kernel
        run: |
          set -e

          echo "===== PATCH KERNELSU NEXT MANUAL HOOKS v12 ====="

          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              p = Path(path)
              if not p.exists():
                  print(f"[SKIP] {path}: missing")
                  return None
              return p.read_text(errors="ignore")

          def write(path, text):
              Path(path).write_text(text)

          def insert_before(path, marker, block, tag):
              text = read(path)
              if text is None:
                  return False
              if tag in text:
                  print(f"[OK] {path}: {tag} already present")
                  return True
              idx = text.find(marker)
              if idx < 0:
                  print(f"[WARN] {path}: marker not found for {tag}: {marker}")
                  return False
              text = text[:idx] + block + "\n" + text[idx:]
              write(path, text)
              print(f"[PATCH] {path}: inserted {tag}")
              return True

          def find_open_brace(text, start):
              brace = text.find("{", start)
              return brace

          def insert_after_brace(path, func_marker, block, tag):
              text = read(path)
              if text is None:
                  return False
              if tag in text:
                  print(f"[OK] {path}: {tag} already present")
                  return True
              start = text.find(func_marker)
              if start < 0:
                  print(f"[WARN] {path}: function marker not found for {tag}: {func_marker}")
                  return False
              brace = find_open_brace(text, start)
              if brace < 0:
                  print(f"[WARN] {path}: opening brace not found for {tag}")
                  return False
              insert_at = brace + 1
              text = text[:insert_at] + "\n" + block + text[insert_at:]
              write(path, text)
              print(f"[PATCH] {path}: inserted {tag}")
              return True

          def insert_after_in_func(path, func_marker, after_marker, block, tag):
              text = read(path)
              if text is None:
                  return False
              if tag in text:
                  print(f"[OK] {path}: {tag} already present")
                  return True
              start = text.find(func_marker)
              if start < 0:
                  print(f"[WARN] {path}: function marker not found for {tag}: {func_marker}")
                  return False
              idx = text.find(after_marker, start)
              if idx < 0:
                  print(f"[WARN] {path}: inner marker not found for {tag}: {after_marker}")
                  return False
              insert_at = idx + len(after_marker)
              text = text[:insert_at] + "\n" + block + text[insert_at:]
              write(path, text)
              print(f"[PATCH] {path}: inserted {tag}")
              return True

          # 1) fs/exec.c - native do_execve hook
          exec_extern = """#ifdef CONFIG_KSU
          /* KSU_NEXT_MANUAL_HOOK_EXEC_EXTERN */
          __attribute__((hot))
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
                          void *argv, void *envp, int *flags);
          #endif
          """
          insert_before(
              "fs/exec.c",
              "int do_execve(struct filename *filename",
              exec_extern,
              "KSU_NEXT_MANUAL_HOOK_EXEC_EXTERN",
          )

          exec_call = """#ifdef CONFIG_KSU
          \t/* KSU_NEXT_MANUAL_HOOK_EXEC_CALL */
          \tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);
          #endif"""
          ok_exec = insert_after_in_func(
              "fs/exec.c",
              "int do_execve(struct filename *filename",
              "struct user_arg_ptr envp = { .ptr.native = __envp };",
              exec_call,
              "KSU_NEXT_MANUAL_HOOK_EXEC_CALL",
          )
          if not ok_exec:
              print("[WARN] fs/exec.c: native do_execve hook was not applied; continuing because reboot hook is the Kbuild gate")

          # 2) fs/open.c - faccessat hook
          open_extern = """#ifdef CONFIG_KSU
          /* KSU_NEXT_MANUAL_HOOK_FACCESSAT_EXTERN */
          __attribute__((hot))
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,
                          int *mode, int *flags);
          #endif

          """
          open_text = read("fs/open.c")
          if open_text is not None:
              if "KSU_NEXT_MANUAL_HOOK_FACCESSAT_EXTERN" not in open_text:
                  markers = ["SYSCALL_DEFINE3(faccessat", "long do_faccessat("]
                  placed = False
                  for m in markers:
                      if m in open_text:
                          open_text = open_text.replace(m, open_extern + m, 1)
                          placed = True
                          break
                  if placed:
                      write("fs/open.c", open_text)
                      print("[PATCH] fs/open.c: inserted KSU_NEXT_MANUAL_HOOK_FACCESSAT_EXTERN")
                  else:
                      print("[WARN] fs/open.c: faccessat marker not found for extern")
              else:
                  print("[OK] fs/open.c: faccessat extern already present")

          open_call = """#ifdef CONFIG_KSU
          \t/* KSU_NEXT_MANUAL_HOOK_FACCESSAT_CALL */
          \tksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif"""
          ok_open = insert_after_in_func(
              "fs/open.c",
              "SYSCALL_DEFINE3(faccessat",
              "unsigned int lookup_flags = LOOKUP_FOLLOW;",
              open_call,
              "KSU_NEXT_MANUAL_HOOK_FACCESSAT_CALL",
          )
          if not ok_open:
              ok_open = insert_after_in_func(
                  "fs/open.c",
                  "long do_faccessat(",
                  "unsigned int lookup_flags = LOOKUP_FOLLOW;",
                  open_call,
                  "KSU_NEXT_MANUAL_HOOK_FACCESSAT_CALL",
              )
          if not ok_open:
              print("[WARN] fs/open.c: faccessat hook was not applied")

          # 3) fs/read_write.c - sys_read hook
          read_extern = """#ifdef CONFIG_KSU
          /* KSU_NEXT_MANUAL_HOOK_READ_EXTERN */
          extern bool ksu_vfs_read_hook __read_mostly;
          extern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd,
                          char __user **buf_ptr, size_t *count_ptr);
          #endif

          """
          rw_text = read("fs/read_write.c")
          if rw_text is not None:
              if "KSU_NEXT_MANUAL_HOOK_READ_EXTERN" not in rw_text:
                  marker = "SYSCALL_DEFINE3(read"
                  if marker in rw_text:
                      rw_text = rw_text.replace(marker, read_extern + marker, 1)
                      write("fs/read_write.c", rw_text)
                      print("[PATCH] fs/read_write.c: inserted KSU_NEXT_MANUAL_HOOK_READ_EXTERN")
                  else:
                      print("[WARN] fs/read_write.c: SYSCALL_DEFINE3(read marker not found for extern")
              else:
                  print("[OK] fs/read_write.c: read extern already present")

          read_call = """#ifdef CONFIG_KSU
          \t/* KSU_NEXT_MANUAL_HOOK_READ_CALL */
          \tif (unlikely(ksu_vfs_read_hook))
          \t\tksu_handle_sys_read(fd, (char __user **)&buf, &count);
          #endif"""
          ok_read = insert_after_in_func(
              "fs/read_write.c",
              "SYSCALL_DEFINE3(read",
              "ssize_t ret = -EBADF;",
              read_call,
              "KSU_NEXT_MANUAL_HOOK_READ_CALL",
          )
          if not ok_read:
              print("[WARN] fs/read_write.c: read hook was not applied")

          # 4) fs/stat.c - newfstatat hook
          stat_extern = """#ifdef CONFIG_KSU
          /* KSU_NEXT_MANUAL_HOOK_STAT_EXTERN */
          __attribute__((hot))
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user,
                          int *flags);
          #endif

          """
          stat_text = read("fs/stat.c")
          if stat_text is not None:
              if "KSU_NEXT_MANUAL_HOOK_STAT_EXTERN" not in stat_text:
                  markers = ["SYSCALL_DEFINE4(newfstatat", "int vfs_fstatat(", "int vfs_statx("]
                  placed = False
                  for m in markers:
                      if m in stat_text:
                          stat_text = stat_text.replace(m, stat_extern + m, 1)
                          placed = True
                          break
                  if placed:
                      write("fs/stat.c", stat_text)
                      print("[PATCH] fs/stat.c: inserted KSU_NEXT_MANUAL_HOOK_STAT_EXTERN")
                  else:
                      print("[WARN] fs/stat.c: stat marker not found for extern")
              else:
                  print("[OK] fs/stat.c: stat extern already present")

          stat_call = """#ifdef CONFIG_KSU
          \t/* KSU_NEXT_MANUAL_HOOK_STAT_CALL */
          \tksu_handle_stat(&dfd, &filename, &flag);
          #endif"""
          ok_stat = insert_after_in_func(
              "fs/stat.c",
              "SYSCALL_DEFINE4(newfstatat",
              "int error;",
              stat_call,
              "KSU_NEXT_MANUAL_HOOK_STAT_CALL",
          )
          if not ok_stat:
              # fallback for vfs_fstatat uses variable 'flag'
              ok_stat = insert_after_in_func(
                  "fs/stat.c",
                  "int vfs_fstatat(",
                  "unsigned int lookup_flags = 0;",
                  stat_call,
                  "KSU_NEXT_MANUAL_HOOK_STAT_CALL",
              )
          if not ok_stat:
              print("[WARN] fs/stat.c: stat hook was not applied")

          # 5) kernel/reboot.c - this is required by KernelSU-Next Kbuild to accept manual mode
          reboot_extern = """#ifdef CONFIG_KSU
          /* KSU_NEXT_MANUAL_HOOK_REBOOT_EXTERN */
          extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);
          #endif

          """
          insert_before(
              "kernel/reboot.c",
              "SYSCALL_DEFINE4(reboot",
              reboot_extern,
              "KSU_NEXT_MANUAL_HOOK_REBOOT_EXTERN",
          )

          reboot_call = """#ifdef CONFIG_KSU
          \t/* KSU_NEXT_MANUAL_HOOK_REBOOT_CALL */
          \tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
          #endif"""
          ok_reboot = insert_after_in_func(
              "kernel/reboot.c",
              "SYSCALL_DEFINE4(reboot",
              "int ret = 0;",
              reboot_call,
              "KSU_NEXT_MANUAL_HOOK_REBOOT_CALL",
          )
          if not ok_reboot:
              ok_reboot = insert_after_brace(
                  "kernel/reboot.c",
                  "SYSCALL_DEFINE4(reboot",
                  reboot_call,
                  "KSU_NEXT_MANUAL_HOOK_REBOOT_CALL",
              )

          if not ok_reboot:
              raise SystemExit("ERROR: kernel/reboot.c was not patched; KernelSU-Next Kbuild will fail manual mode")

          print("===== MANUAL HOOK PATCH SUMMARY =====")
          for f in ["fs/exec.c", "fs/open.c", "fs/read_write.c", "fs/stat.c", "kernel/reboot.c"]:
              text = read(f)
              if text is None:
                  continue
              count = text.count("KSU_NEXT_MANUAL_HOOK_")
              print(f"{f}: {count} KSU_NEXT_MANUAL_HOOK markers")

          reboot_text = read("kernel/reboot.c") or ""
          if "ksu_handle_sys_reboot" not in reboot_text:
              raise SystemExit("ERROR: ksu_handle_sys_reboot marker missing after patch")

          print("Manual hook patch done.")
          PY

          echo "===== VERIFY MANUAL HOOK MARKERS ====="
          grep -RIn "KSU_NEXT_MANUAL_HOOK\|ksu_handle_sys_reboot\|ksu_handle_execveat\|ksu_handle_faccessat\|ksu_handle_sys_read\|ksu_handle_stat" \
            fs/exec.c fs/open.c fs/read_write.c fs/stat.c kernel/reboot.c 2>/dev/null || true



      - name: Backport path_umount for KernelSU Next
        shell: bash
        working-directory: kernel
        run: |
          set -e

          echo "===== BACKPORT path_umount FOR KERNELSU NEXT v13 ====="

          python3 - <<'PY'
          from pathlib import Path

          ns = Path("fs/namespace.c")
          internal = Path("fs/internal.h")

          if not ns.exists():
              raise SystemExit("ERROR: fs/namespace.c not found")

          text = ns.read_text(errors="ignore")

          if "KSU_NEXT_BACKPORT_PATH_UMOUNT" in text or "int path_umount(struct path *path, int flags)" in text:
              print("[OK] fs/namespace.c already has path_umount backport")
          else:
              marker = "static bool is_mnt_ns_file(struct dentry *dentry)"
              if marker not in text:
                  raise SystemExit("ERROR: marker not found in fs/namespace.c: static bool is_mnt_ns_file")

              block = '''
          /*
           * KSU_NEXT_BACKPORT_PATH_UMOUNT
           *
           * Linux 4.9 does not provide path_umount(), but KernelSU Next expects it.
           * Backport a minimal wrapper using the existing do_umount() path from this
           * kernel tree. This mirrors newer VFS behavior closely enough for KSU Next.
           */
          #ifdef CONFIG_KSU
          static int ksu_next_can_umount(const struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);

          	if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
          		return -EINVAL;
          	if (!may_mount())
          		return -EPERM;
          	if (path->dentry != path->mnt->mnt_root)
          		return -EINVAL;
          	if (!check_mnt(mnt))
          		return -EINVAL;
          	if (mnt->mnt.mnt_flags & MNT_LOCKED)
          		return -EINVAL;
          	if ((flags & MNT_FORCE) && !capable(CAP_SYS_ADMIN))
          		return -EPERM;

          	return 0;
          }

          int path_umount(struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);
          	int ret;

          	ret = ksu_next_can_umount(path, flags);
          	if (!ret)
          		ret = do_umount(mnt, flags);

          	dput(path->dentry);
          	mntput_no_expire(mnt);

          	return ret;
          }
          #endif /* CONFIG_KSU */

          '''
              text = text.replace(marker, block + marker, 1)
              ns.write_text(text)
              print("[PATCH] fs/namespace.c: added CONFIG_KSU path_umount backport")

          if internal.exists():
              itext = internal.read_text(errors="ignore")
              proto = "int path_umount(struct path *path, int flags);"
              if proto in itext:
                  print("[OK] fs/internal.h already has path_umount prototype")
              else:
                  marker2 = "extern void __init mnt_init(void);"
                  if marker2 in itext:
                      itext = itext.replace(marker2, marker2 + "\n#ifdef CONFIG_KSU\n" + proto + "\n#endif", 1)
                  else:
                      itext += "\n#ifdef CONFIG_KSU\n" + proto + "\n#endif\n"
                  internal.write_text(itext)
                  print("[PATCH] fs/internal.h: added path_umount prototype")
          else:
              print("[WARN] fs/internal.h not found; skipping prototype")

          verify = ns.read_text(errors="ignore")
          required = ["do_umount(", "check_mnt(", "may_mount(", "mntput_no_expire("]
          missing = [item for item in required if item not in verify]
          if missing:
              print("[WARN] fs/namespace.c may be missing symbols used by backport:", ", ".join(missing))
          else:
              print("[OK] fs/namespace.c contains do_umount/check_mnt/may_mount/mntput_no_expire")

          if "int path_umount(struct path *path, int flags)" not in verify:
              raise SystemExit("ERROR: path_umount backport missing after patch")
          PY

          echo "===== VERIFY path_umount PATCH ====="
          grep -RIn "KSU_NEXT_BACKPORT_PATH_UMOUNT\|int path_umount(struct path \*path, int flags)\|ksu_next_can_umount" fs/namespace.c fs/internal.h 2>/dev/null || true



      - name: Add SuSFS 4.9 patches level 1
        shell: bash
        working-directory: kernel
        run: |
          set -eo pipefail

          echo "===== ADD SUSFS LEVEL 1 FOR EXYNOS9810 KERNEL 4.9 ====="
          rm -rf susfs4ksu
          rm -f susfs-*.log susfs-*.txt
          find . -name "*.rej" -o -name "*.orig" | xargs -r rm -f

          echo "===== CLONE SUSFS4KSU KERNEL 4.9 PATCHSET ====="
          if ! git clone --depth=1 -b "$SUSFS_BRANCH" "$SUSFS_REPO" susfs4ksu 2>&1 | tee susfs-clone.log; then
            echo "Primary GitLab clone failed, trying GitHub mirror main branch" | tee -a susfs-clone.log
            git clone --depth=1 https://github.com/Star-Seven/susfs4ksu.git susfs4ksu 2>&1 | tee -a susfs-clone.log
          fi

          echo "===== SUSFS PATCH FILES ====="
          find susfs4ksu/kernel_patches -maxdepth 3 -type f | sort | tee susfs-files.txt

          echo "===== COPY SUSFS CORE FILES ====="
          if [ ! -d susfs4ksu/kernel_patches/fs ]; then
            echo "ERROR: susfs4ksu/kernel_patches/fs not found"
            exit 1
          fi
          if [ ! -d susfs4ksu/kernel_patches/include/linux ]; then
            echo "ERROR: susfs4ksu/kernel_patches/include/linux not found"
            exit 1
          fi

          cp -av susfs4ksu/kernel_patches/fs/* fs/ 2>&1 | tee susfs-copy.log
          cp -av susfs4ksu/kernel_patches/include/linux/* include/linux/ 2>&1 | tee -a susfs-copy.log

          if [ ! -f fs/susfs.c ]; then
            echo "ERROR: fs/susfs.c was not copied"
            exit 1
          fi
          if [ ! -f include/linux/susfs.h ]; then
            echo "ERROR: include/linux/susfs.h was not copied"
            exit 1
          fi

          echo "===== PATCH KERNELSU NEXT FOR SUSFS ====="
          KSU_ROOT=""
          for CANDIDATE in KernelSU-Next KernelSU; do
            if [ -d "$CANDIDATE/kernel" ]; then
              KSU_ROOT="$CANDIDATE"
              break
            fi
          done

          if [ -z "$KSU_ROOT" ]; then
            echo "ERROR: KernelSU-Next root not found"
            find . -maxdepth 3 -type d | sort | sed -n '1,160p'
            exit 1
          fi

          echo "KSU_ROOT=$KSU_ROOT" | tee susfs-ksu-root.txt

          pushd "$KSU_ROOT" >/dev/null
          curl -L "https://raw.githubusercontent.com/galaxybuild-project/tools/refs/heads/main/Patches/0001_susfs_157_for_ksunext.patch" -o 0001_susfs_for_ksunext.patch

          if patch -p1 --dry-run < 0001_susfs_for_ksunext.patch 2>&1 | tee ../susfs-ksunext-dryrun.log; then
            patch -p1 < 0001_susfs_for_ksunext.patch 2>&1 | tee ../susfs-ksunext-apply.log
          else
            echo "KernelSU-Next-specific SuSFS patch failed dry-run; trying SUSFS repo KernelSU patch as fallback" | tee -a ../susfs-ksunext-dryrun.log
            if [ -f ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ] && \
               patch -p1 --dry-run < ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch 2>&1 | tee ../susfs-ksu-fallback-dryrun.log; then
              patch -p1 < ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch 2>&1 | tee ../susfs-ksu-fallback-apply.log
            else
              echo "ERROR: both KernelSU-Next SuSFS patches failed dry-run"
              find .. -name "*.rej" -o -name "*.orig" | sort | tee ../susfs-rejects.txt
              exit 1
            fi
          fi
          popd >/dev/null

          echo "===== PATCH KERNEL SOURCE FOR SUSFS 4.9 ====="
          KERNEL_PATCH=""
          for CANDIDATE in \
            susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch \
            susfs4ksu/kernel_patches/50_add_susfs_in_kernel_4.9.patch \
            susfs4ksu/kernel_patches/50_add_susfs_in_kernel.patch
          do
            if [ -f "$CANDIDATE" ]; then
              KERNEL_PATCH="$CANDIDATE"
              break
            fi
          done

          if [ -z "$KERNEL_PATCH" ]; then
            KERNEL_PATCH="$(find susfs4ksu/kernel_patches -maxdepth 1 -type f -name '*susfs*4.9*.patch' | head -n 1 || true)"
          fi

          if [ -z "$KERNEL_PATCH" ] || [ ! -f "$KERNEL_PATCH" ]; then
            echo "ERROR: SuSFS kernel 4.9 patch not found"
            find susfs4ksu/kernel_patches -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "Using kernel patch: $KERNEL_PATCH" | tee susfs-kernel-patch.txt

          if patch -p1 --dry-run < "$KERNEL_PATCH" 2>&1 | tee susfs-kernel-dryrun.log; then
            patch -p1 < "$KERNEL_PATCH" 2>&1 | tee susfs-kernel-apply.log
          else
            echo "ERROR: SuSFS kernel patch failed dry-run. Do not continue because partial SuSFS causes bootloop."
            find . -name "*.rej" -o -name "*.orig" | sort | tee susfs-rejects.txt
            exit 1
          fi

          echo "===== VERIFY SUSFS SOURCE INTEGRATION ====="
          {
            echo "SUSFS_BRANCH=$SUSFS_BRANCH"
            echo "SUSFS_REPO=$SUSFS_REPO"
            echo "KSU_ROOT=$KSU_ROOT"
            echo "KERNEL_PATCH=$KERNEL_PATCH"
            echo ""
            echo "--- SuSFS files ---"
            ls -lah fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h 2>/dev/null || true
            echo ""
            echo "--- SuSFS source markers ---"
            grep -RIn "CONFIG_KSU_SUSFS\|SUSFS\|susfs" fs include/linux "$KSU_ROOT/kernel" drivers/kernelsu 2>/dev/null | head -400 || true
          } | tee SuSFS-build-info.txt

          REQUIRED=(
            "fs/susfs.c"
            "include/linux/susfs.h"
            "include/linux/susfs_def.h"
          )

          for FILE in "${REQUIRED[@]}"; do
            if [ ! -s "$FILE" ]; then
              echo "ERROR: required SuSFS file missing or empty: $FILE"
              exit 1
            fi
          done

          if ! grep -q "CONFIG_KSU_SUSFS" "$KSU_ROOT/kernel/Kconfig"; then
            echo "ERROR: KernelSU-Next Kconfig does not contain CONFIG_KSU_SUSFS"
            exit 1
          fi

          if ! grep -q "susfs.o" fs/Makefile; then
            echo "ERROR: fs/Makefile does not build susfs.o"
            exit 1
          fi

          echo "SuSFS level 1 source integration passed."


      - name: Verify KernelSU Next integration v15
        shell: bash
        working-directory: kernel
        run: |
          set -e

          echo "===== VERIFY KERNELSU NEXT INTEGRATION v15 ====="

          {
            echo "Device: ${DEVICE}"
            echo "Model: ${MODEL_NAME}"
            echo "Android: ${PLATFORM_VERSION}/${ANDROID_MAJOR_VERSION}"
            echo "Kernel release target: 4.9.220-G960NK-v15-ksunext-susfs-l1"
            echo ""
          } > ksu-next-build-info.txt

          if [ -d "KernelSU-Next/.git" ]; then
            {
              echo "KernelSU Next directory: KernelSU-Next"
              echo "KernelSU Next branch: $(git -C KernelSU-Next rev-parse --abbrev-ref HEAD || true)"
              echo "KernelSU Next commit: $(git -C KernelSU-Next rev-parse HEAD || true)"
              echo "KernelSU Next short commit: $(git -C KernelSU-Next rev-parse --short HEAD || true)"
              echo "KernelSU Next latest commit:"
              git -C KernelSU-Next log -1 --oneline || true
            } >> ksu-next-build-info.txt
          elif [ -d "drivers/kernelsu/.git" ]; then
            {
              echo "KernelSU Next directory: drivers/kernelsu"
              echo "KernelSU Next branch: $(git -C drivers/kernelsu rev-parse --abbrev-ref HEAD || true)"
              echo "KernelSU Next commit: $(git -C drivers/kernelsu rev-parse HEAD || true)"
              echo "KernelSU Next short commit: $(git -C drivers/kernelsu rev-parse --short HEAD || true)"
              echo "KernelSU Next latest commit:"
              git -C drivers/kernelsu log -1 --oneline || true
            } >> ksu-next-build-info.txt
          else
            echo "KernelSU Next git directory not found; setup script may have used a symlink or copied tree." >> ksu-next-build-info.txt
          fi

          echo ""
          echo "===== REQUIRED SOURCE MARKERS =====" | tee -a ksu-next-build-info.txt

          REQUIRED_MARKERS=(
            "kernel/reboot.c:ksu_handle_sys_reboot"
            "fs/namespace.c:int path_umount(struct path *path, int flags)"
            "fs/exec.c:ksu_handle_execveat"
            "fs/open.c:ksu_handle_faccessat"
            "fs/read_write.c:ksu_handle_sys_read"
            "fs/stat.c:ksu_handle_stat"
          )

          for ITEM in "${REQUIRED_MARKERS[@]}"; do
            FILE="${ITEM%%:*}"
            MARKER="${ITEM#*:}"

            if grep -Fq "$MARKER" "$FILE"; then
              echo "[OK] $FILE contains $MARKER" | tee -a ksu-next-build-info.txt
            else
              echo "[WARN] $FILE missing $MARKER" | tee -a ksu-next-build-info.txt
            fi
          done

          echo ""
          echo "===== KSU MARKERS PREVIEW =====" | tee -a ksu-next-build-info.txt
          grep -RIn "CONFIG_KSU\|KSU_NEXT_MANUAL_HOOK\|KSU_NEXT_BACKPORT_PATH_UMOUNT\|ksu_handle_sys_reboot\|path_umount" \
            Kconfig Makefile drivers fs kernel 2>/dev/null > ksu-next-markers-v15.txt || true
          sed -n '1,260p' ksu-next-markers-v15.txt | tee -a ksu-next-build-info.txt || true

          if ! grep -q "ksu_handle_sys_reboot" kernel/reboot.c; then
            echo "ERROR: reboot manual hook is missing"
            exit 1
          fi

          if ! grep -q "int path_umount(struct path \*path, int flags)" fs/namespace.c; then
            echo "ERROR: path_umount backport is missing"
            exit 1
          fi

          echo "KernelSU Next v15 source verification passed."


      - name: Prepare defconfig
        shell: bash
        working-directory: kernel
        run: |
          set -e

          CONFIG_DIR="arch/arm64/configs"
          BASE_DEFCONFIG="$CONFIG_DIR/exynos9810_defconfig"
          DEVICE_CONFIG="$CONFIG_DIR/$DEVICE_DEFCONFIG"
          TEMP_CONFIG="$CONFIG_DIR/$TEMP_DEFCONFIG"

          if [ ! -f "$DEVICE_CONFIG" ]; then
            echo "Missing device defconfig: $DEVICE_CONFIG"
            exit 1
          fi

          rm -f "$TEMP_CONFIG"

          if [ -s "$BASE_DEFCONFIG" ]; then
            cat "$BASE_DEFCONFIG" > "$TEMP_CONFIG"
            printf '\n' >> "$TEMP_CONFIG"
            cat "$DEVICE_CONFIG" >> "$TEMP_CONFIG"
          else
            cp -f "$DEVICE_CONFIG" "$TEMP_CONFIG"
          fi

          printf '\n# GitHub Actions target: %s %s Android 10 Q\n' "$DEVICE" "$MODEL_NAME" >> "$TEMP_CONFIG"

          cat >> "$TEMP_CONFIG" <<'EOF'

          # KernelSU Next official legacy v15 SuSFS L1 manual hook
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KSU_KPROBES_HOOK is not set
          # CONFIG_KSU_KPROBE_HOOKS is not set

          # SuSFS level 1: keep useful core features, disable risky/extra features first
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          # CONFIG_KSU_SUSFS_SUS_OVERLAYFS is not set
          # CONFIG_KSU_SUSFS_SPOOF_UNAME is not set
          # CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG is not set
          # CONFIG_KSU_SUSFS_OPEN_REDIRECT is not set
          # CONFIG_KSU_SUSFS_SUS_SU is not set
          EOF

          echo "===== TEMP DEFCONFIG ====="
          ls -lah "$TEMP_CONFIG"
          tail -80 "$TEMP_CONFIG" || true

      - name: Build kernel and dtb.img
        shell: bash
        working-directory: kernel
        run: |
          set -eo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC="clang --target=aarch64-linux-gnu --prefix=/usr/bin/aarch64-linux-gnu- -no-integrated-as"
          export HOSTCC=gcc
          export HOSTCXX=g++
          export AS=aarch64-linux-gnu-as
          export LD=aarch64-linux-gnu-ld.bfd
          export AR=aarch64-linux-gnu-ar
          export NM=aarch64-linux-gnu-nm
          export OBJCOPY=aarch64-linux-gnu-objcopy
          export OBJDUMP=aarch64-linux-gnu-objdump
          export STRIP=aarch64-linux-gnu-strip
          export READELF=aarch64-linux-gnu-readelf
          export PLATFORM_VERSION="$PLATFORM_VERSION"
          export ANDROID_MAJOR_VERSION="$ANDROID_MAJOR_VERSION"
          export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          export KBUILD_BUILD_USER=khiconjk
          export KBUILD_BUILD_HOST=github-actions

          MAKE_ARGS=(
            V=0
            ARCH=arm64
            SUBARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
            "CC=clang --target=aarch64-linux-gnu --prefix=/usr/bin/aarch64-linux-gnu- -no-integrated-as"
            HOSTCC=gcc
            HOSTCXX=g++
            AS=aarch64-linux-gnu-as
            LD=aarch64-linux-gnu-ld.bfd
            AR=aarch64-linux-gnu-ar
            NM=aarch64-linux-gnu-nm
            OBJCOPY=aarch64-linux-gnu-objcopy
            OBJDUMP=aarch64-linux-gnu-objdump
            STRIP=aarch64-linux-gnu-strip
            READELF=aarch64-linux-gnu-readelf
            PLATFORM_VERSION="$PLATFORM_VERSION"
            ANDROID_MAJOR_VERSION="$ANDROID_MAJOR_VERSION"
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          )

          echo "===== COMPILER TEST ====="
          clang --target=aarch64-linux-gnu --prefix=/usr/bin/aarch64-linux-gnu- -no-integrated-as -x c -c /dev/null -o /tmp/clang-arm64-test.o
          file /tmp/clang-arm64-test.o

          echo "===== DEFCONFIG ====="
          make "${MAKE_ARGS[@]}" "$TEMP_DEFCONFIG" 2>&1 | tee defconfig.log

          echo "===== OLDDEFCONFIG ====="
          make "${MAKE_ARGS[@]}" olddefconfig 2>&1 | tee olddefconfig.log

          echo "===== CONFIG CHECK ====="
          grep -E "CONFIG_SOC_EXYNOS9810|CONFIG_CAMERA_STAR|CONFIG_CAMERA_STAR2|CONFIG_CAMERA_CROWN|CONFIG_EXYNOS_DTBTOOL|CONFIG_BUILD_ARM64_APPENDED|CONFIG_MODULES|CONFIG_ANDROID|CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS|CONFIG_KSU_KPROBES_HOOK|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS" .config || true

          if ! grep -q "^CONFIG_KSU=y" .config; then
            echo "ERROR: CONFIG_KSU was not enabled"
            exit 1
          fi

          if ! grep -q "^CONFIG_KSU_MANUAL_HOOK=y" .config; then
            echo "ERROR: CONFIG_KSU_MANUAL_HOOK was not enabled"
            exit 1
          fi
          if ! grep -q "^CONFIG_KSU_SUSFS=y" .config; then
            echo "ERROR: CONFIG_KSU_SUSFS was not enabled"
            grep -n "KSU_SUSFS" .config || true
            exit 1
          fi

          if [ ! -f fs/susfs.c ] || [ ! -f include/linux/susfs.h ]; then
            echo "ERROR: SuSFS files missing before build"
            ls -lah fs/susfs.c include/linux/susfs.h 2>/dev/null || true
            exit 1
          fi

          if ! grep -q "ksu_handle_sys_reboot" kernel/reboot.c; then
            echo "ERROR: manual reboot hook marker missing; KernelSU-Next Kbuild will reject manual mode"
            exit 1
          fi

          echo "===== BUILD IMAGE + DTBS + DTB.IMG ====="
          make -j"$(nproc --all)" "${MAKE_ARGS[@]}" Image Image.gz dtbs dtb.img 2>&1 | tee build.log

          echo "===== IF dtb.img IS STILL MISSING, TRY dtb.img AGAIN WITH V=1 ====="
          if [ ! -f "arch/arm64/boot/dtb.img" ]; then
            make -j"$(nproc --all)" "${MAKE_ARGS[@]}" V=1 dtb.img 2>&1 | tee -a build.log
          fi

          echo "===== OUTPUTS ====="
          ls -lah arch/arm64/boot || true
          find arch/arm64/boot -maxdepth 8 -type f \( -name "Image*" -o -name "*.dtb" -o -name "dtb.img" -o -name "*.ko" \) -print -exec ls -lh {} \; || true

      - name: Show useful errors
        if: failure()
        shell: bash
        working-directory: kernel
        run: |
          echo "===== ERROR LINES ====="
          grep -nEi "error:|fatal error:|undefined reference|ld.lld|ld:|No such file|No rule to make target|FAILED|recipe for target|Stop\.|not found|Permission denied|unrecognized option|unknown argument|unsupported option|Illegal option|dtb.img" \
            clean.log defconfig.log olddefconfig.log build.log 2>/dev/null | tail -350 || true

          echo "===== LAST 350 BUILD LINES ====="
          tail -350 build.log 2>/dev/null || true

          echo "===== LAST 180 DEFCONFIG LINES ====="
          tail -180 defconfig.log 2>/dev/null || true

          echo "===== BOOT OUTPUT TREE ====="
          find arch/arm64/boot -maxdepth 8 -type f -print -exec ls -lh {} \; 2>/dev/null || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ss-S9-${{ steps.target.outputs.device }}-${{ steps.target.outputs.model }}-failure-diagnostics-v15-ksunext-susfs-l1
          path: |
            kernel/*.log
            kernel/*.txt
            kernel/.config
            kernel/**/*.rej
            kernel/**/*.orig
          if-no-files-found: ignore
          compression-level: 6

      - name: Collect kernel outputs
        shell: bash
        working-directory: kernel
        run: |
          set -e

          OUT_DIR="$GITHUB_WORKSPACE/out"
          RAW_DIR="$OUT_DIR/raw"

          mkdir -p "$RAW_DIR"

          echo "===== REQUIRED OUTPUT CHECK ====="

          if [ ! -f "arch/arm64/boot/Image" ]; then
            echo "ERROR: arch/arm64/boot/Image not found"
            find arch/arm64/boot -maxdepth 8 -type f -print || true
            exit 1
          fi

          if [ ! -f "arch/arm64/boot/dtb.img" ]; then
            echo "ERROR: arch/arm64/boot/dtb.img not found"
            echo "Available dtb files:"
            find arch/arm64/boot -maxdepth 8 -type f \( -name "*.dtb" -o -name "dtb.img" \) -print -exec ls -lh {} \; || true
            echo "CONFIG_EXYNOS_DTBTOOL:"
            grep -n "CONFIG_EXYNOS_DTBTOOL" .config || true
            exit 1
          fi

          cp -av "arch/arm64/boot/Image" "$RAW_DIR/Image"
          cp -av "arch/arm64/boot/Image" "$RAW_DIR/zImage"
          cp -av "arch/arm64/boot/dtb.img" "$RAW_DIR/dtb.img"

          [ -f "arch/arm64/boot/Image.gz" ] && cp -av "arch/arm64/boot/Image.gz" "$RAW_DIR/Image.gz" || true
          [ -f "arch/arm64/boot/Image.gz-dtb" ] && cp -av "arch/arm64/boot/Image.gz-dtb" "$RAW_DIR/Image.gz-dtb" || true

          find . -type f -name "*.ko" -print0 > "$OUT_DIR/modules.list" || true

          if [ -s "$OUT_DIR/modules.list" ]; then
            tar --null -czf "$OUT_DIR/modules-${DEVICE}-${MODEL_NAME}.tar.gz" --files-from "$OUT_DIR/modules.list"
          else
            echo "No .ko modules found" > "$OUT_DIR/modules-${DEVICE}-${MODEL_NAME}.txt"
          fi

          cp -av clean.log "$OUT_DIR/clean.log" || true
          cp -av defconfig.log "$OUT_DIR/defconfig.log" || true
          cp -av olddefconfig.log "$OUT_DIR/olddefconfig.log" || true
          cp -av build.log "$OUT_DIR/build.log" || true
          cp -av ksu-next-build-info.txt "$OUT_DIR/KernelSU-Next-build-info.txt" 2>/dev/null || true
          cp -av SuSFS-build-info.txt "$OUT_DIR/SuSFS-build-info.txt" 2>/dev/null || true
          cp -av susfs-*.log "$OUT_DIR/" 2>/dev/null || true
          cp -av susfs-*.txt "$OUT_DIR/" 2>/dev/null || true
          cp -av ksu-next-markers-v15.txt "$OUT_DIR/KernelSU-Next-markers-v15.txt" 2>/dev/null || true
          grep -RIn "KSU_NEXT_MANUAL_HOOK\|ksu_handle_sys_reboot\|ksu_handle_execveat\|ksu_handle_faccessat\|ksu_handle_sys_read\|ksu_handle_stat" fs/exec.c fs/open.c fs/read_write.c fs/stat.c kernel/reboot.c > "$OUT_DIR/KernelSU-manual-hooks.txt" 2>/dev/null || true
          grep -RIn "KSU_NEXT_BACKPORT_PATH_UMOUNT\|int path_umount(struct path \*path, int flags)\|ksu_next_can_umount" fs/namespace.c fs/internal.h > "$OUT_DIR/KernelSU-path-umount.txt" 2>/dev/null || true
          grep -RIn "CONFIG_KSU_SUSFS\|SUSFS\|susfs" fs include/linux KernelSU-Next drivers/kernelsu 2>/dev/null > "$OUT_DIR/SuSFS-markers.txt" || true
          cp -av .config "$OUT_DIR/kernel.config" || true
          for KSU_CANDIDATE in KernelSU-Next KernelSU drivers/kernelsu kernel/kernelsu; do
            if [ -e "$KSU_CANDIDATE" ]; then
              find "$KSU_CANDIDATE" -maxdepth 3 -type f | sort > "$OUT_DIR/KernelSU-files.txt" || true
              break
            fi
          done
          grep -E "CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS|CONFIG_KSU_KPROBES_HOOK|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS" .config > "$OUT_DIR/KernelSU-config.txt" || true

          echo "===== ARTIFACT TREE ====="
          find "$OUT_DIR" -maxdepth 3 -type f -print -exec ls -lh {} \;

      - name: Package AnyKernel3 zip
        shell: bash
        run: |
          set -e

          OUT_DIR="$GITHUB_WORKSPACE/out"
          RAW_DIR="$OUT_DIR/raw"
          AK_DIR="$GITHUB_WORKSPACE/AnyKernel3"
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          ZIP_NAME="ss-S9-${DEVICE}-${MODEL_NAME}-OneUI2.5-Q-v15-ksunext-susfs-l1-${SHORT_SHA}.zip"

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 "$AK_DIR"

          cd "$AK_DIR"

          rm -rf .git .github
          rm -f Image Image.gz Image.gz-dtb Image-dtb zImage zImage-dtb dtb dtb.img dtbo.img
          cp -av "$RAW_DIR/zImage" ./zImage
          cp -av "$RAW_DIR/dtb.img" ./dtb.img

          rm -f anykernel.sh

          printf '%s\n' \
            "### AnyKernel3 Ramdisk Mod Script" \
            "## Auto-generated for ss-S9" \
            "## Target: Samsung Galaxy S9 ${MODEL_NAME} / ${DEVICE} / One UI 2.5 Android 10" \
            "" \
            "properties() { '" \
            "kernel.string=ss-S9 ${DEVICE} ${MODEL_NAME} OneUI2.5 Android10 Q v15 KernelSU Next SuSFS L1" \
            "do.devicecheck=1" \
            "do.modules=0" \
            "do.systemless=1" \
            "do.cleanup=1" \
            "do.cleanuponabort=0" \
            "device.name1=${AK_DEVICE_1}" \
            "device.name2=${AK_DEVICE_2}" \
            "device.name3=${AK_DEVICE_3}" \
            "device.name4=${AK_DEVICE_4}" \
            "device.name5=${DEVICE}" \
            "supported.versions=" \
            "supported.patchlevels=" \
            "'; }" \
            "" \
            "BLOCK=boot" \
            "for CANDIDATE in \\" \
            "  /dev/block/platform/11120000.ufs/by-name/BOOT \\" \
            "  /dev/block/platform/11120000.ufs/by-name/boot \\" \
            "  /dev/block/bootdevice/by-name/boot \\" \
            "  /dev/block/by-name/boot" \
            "do" \
            '  if [ -e "$CANDIDATE" ]; then' \
            '    BLOCK="$CANDIDATE"' \
            "    break" \
            "  fi" \
            "done" \
            "" \
            "IS_SLOT_DEVICE=0" \
            "RAMDISK_COMPRESSION=auto" \
            "PATCH_VBMETA_FLAG=auto" \
            "" \
            ". tools/ak3-core.sh" \
            "" \
            "dump_boot" \
            "write_boot" \
            > anykernel.sh

          chmod +x anykernel.sh

          echo "===== anykernel.sh ====="
          cat anykernel.sh

          zip -r9 "$OUT_DIR/$ZIP_NAME" ./* -x "*.git*" "README.md"
          ls -lh "$OUT_DIR/$ZIP_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ss-S9-${{ steps.target.outputs.device }}-${{ steps.target.outputs.model }}-kernel-v15-ksunext-susfs-l1
          path: |
            out/*.zip
            out/raw/*
            out/*.log
            out/kernel.config
            out/modules-*
            out/KernelSU-*.txt
            out/SuSFS-*.txt
            out/susfs-*.log
            out/susfs-*.txt
            out/KernelSU-manual-hooks.txt
            out/KernelSU-path-umount.txt
            out/KernelSU-Next-build-info.txt
            out/KernelSU-Next-markers-v15.txt
          if-no-files-found: error
          compression-level: 6
