name: v81 KSU Next + SuSFS CLOCK_BOOTTIME VDSO WiFiFix L66

"on":
  workflow_dispatch:
    inputs:
      ref_to_build:
        description: "Branch/ref to build"
        required: true
        default: "test_kernel"
      device:
        description: "Device target"
        required: true
        default: "starlte"
        type: choice
        options:
          - starlte
          - star2lte
          - crownlte

permissions:
  contents: read

concurrency:
  group: ss-s9-manual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  SUBARCH: arm64
  PLATFORM_VERSION: "10"
  ANDROID_MAJOR_VERSION: q
  TEMP_DEFCONFIG: exynos9810_temp_defconfig
  SUSFS_BRANCH: "1.4.2-kernel-4.9"
  SUSFS_REPO: "https://gitlab.com/1392726643/susfs4ksu.git"

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/local/share/boost || true
          sudo apt-get clean || true
          df -h

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref_to_build }}
          fetch-depth: 1
          path: kernel

      - name: Install packages
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            build-essential \
            ca-certificates \
            ccache \
            clang \
            cpio \
            flex \
            g++ \
            gcc \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            make \
            patch \
            pahole \
            perl \
            python3 \
            python-is-python3 \
            rsync \
            unzip \
            zip

          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

          echo "===== TOOLCHAIN ====="
          clang --version
          aarch64-linux-gnu-gcc --version
          aarch64-linux-gnu-as --version
          aarch64-linux-gnu-ld.bfd --version
          arm-linux-gnueabi-gcc --version
          arm-linux-gnueabi-as --version

      - name: Select device config
        id: target
        shell: bash
        run: |
          set -e

          DEVICE="${{ inputs.device }}"

          case "$DEVICE" in
            starlte)
              DEVICE_DEFCONFIG="exynos9810-starlte_defconfig"
              MODEL_NAME="G960NK"
              AK_DEVICE_1="starlte"
              AK_DEVICE_2="starlteks"
              AK_DEVICE_3="starltekor"
              AK_DEVICE_4="SM-G960N"
              ;;
            star2lte)
              DEVICE_DEFCONFIG="exynos9810-star2lte_defconfig"
              MODEL_NAME="G965"
              AK_DEVICE_1="star2lte"
              AK_DEVICE_2="star2lteks"
              AK_DEVICE_3="star2ltekor"
              AK_DEVICE_4="SM-G965N"
              ;;
            crownlte)
              DEVICE_DEFCONFIG="exynos9810-crownlte_defconfig"
              MODEL_NAME="N960"
              AK_DEVICE_1="crownlte"
              AK_DEVICE_2="crownlteks"
              AK_DEVICE_3="crownltekor"
              AK_DEVICE_4="SM-N960N"
              ;;
            *)
              echo "Unsupported device: $DEVICE"
              exit 1
              ;;
          esac

          {
            echo "DEVICE=$DEVICE"
            echo "DEVICE_DEFCONFIG=$DEVICE_DEFCONFIG"
            echo "MODEL_NAME=$MODEL_NAME"
            echo "AK_DEVICE_1=$AK_DEVICE_1"
            echo "AK_DEVICE_2=$AK_DEVICE_2"
            echo "AK_DEVICE_3=$AK_DEVICE_3"
            echo "AK_DEVICE_4=$AK_DEVICE_4"
          } >> "$GITHUB_ENV"

          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "model=$MODEL_NAME" >> "$GITHUB_OUTPUT"

      - name: Show source information
        shell: bash
        working-directory: kernel
        run: |
          set -e

          echo "===== COMMIT ====="
          git rev-parse --short HEAD

          echo "===== MAKEFILE VERSION ====="
          grep -nE "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=" Makefile || true

          echo "===== DEFCONFIG CHECK ====="
          ls -lah arch/arm64/configs | grep -E "exynos9810|starlte|star2lte|crownlte" || true

          echo "===== TARGET ====="
          echo "DEVICE=$DEVICE"
          echo "MODEL_NAME=$MODEL_NAME"
          echo "DEVICE_DEFCONFIG=$DEVICE_DEFCONFIG"
          echo "PLATFORM_VERSION=$PLATFORM_VERSION"
          echo "ANDROID_MAJOR_VERSION=$ANDROID_MAJOR_VERSION"

      - name: Clean source tree safely
        shell: bash
        working-directory: kernel
        run: |
          set -e

          echo "===== CLEAN BY GIT RESET/CLEAN =====" | tee clean.log
          git reset --hard HEAD | tee -a clean.log
          git clean -fdx | tee -a clean.log

          rm -f "arch/arm64/configs/$TEMP_DEFCONFIG"
          rm -f .config .config.old
          rm -rf include/config include/generated arch/arm64/include/generated
          rm -f build.log defconfig.log olddefconfig.log

          echo "Clean done" | tee -a clean.log


      - name: Patch kernel release to G960NK v81 KSU Next + SuSFS CLOCK_BOOTTIME VDSO WiFiFix L66
        shell: bash
        working-directory: kernel
        run: |
          set -e

          echo "===== BEFORE VERSION PATCH ====="
          grep -nE "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=" Makefile || true

          python3 - <<'PY'
          from pathlib import Path
          import re

          makefile = Path("Makefile")
          text = makefile.read_text(errors="ignore")

          text = re.sub(r"^SUBLEVEL\s*=\s*.*$", "SUBLEVEL = 220", text, flags=re.MULTILINE)

          if re.search(r"^EXTRAVERSION\s*=", text, flags=re.MULTILINE):
              text = re.sub(r"^EXTRAVERSION\s*=\s*.*$", "EXTRAVERSION = -G960NK-v81-ksunext-susfs-boottime-vdso-wififix-l66", text, flags=re.MULTILINE)
          else:
              text = text.replace("SUBLEVEL = 220", "SUBLEVEL = 220\nEXTRAVERSION = -G960NK-v81-ksunext-susfs-boottime-vdso-wififix-l66", 1)

          makefile.write_text(text)
          PY

          echo "===== AFTER VERSION PATCH ====="
          grep -nE "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=" Makefile || true

          echo "Expected UTS_RELEASE prefix: 4.9.220-G960NK-v81-ksunext-susfs-boottime-vdso-wififix-l66"


      - name: Patch clang external assembler prefix
        shell: bash
        working-directory: kernel
        run: |
          set -e

          echo "===== BEFORE PATCH: clang prefix lines ====="
          grep -RIn -- "--prefix=" Makefile scripts arch/arm64 2>/dev/null || true
          grep -RIn -- "gcc-toolchain" Makefile scripts arch/arm64 2>/dev/null || true
          grep -RIn -- "no-integrated-as" Makefile scripts arch/arm64 2>/dev/null || true

          python3 - <<'PY'
          from pathlib import Path

          search_roots = [
              Path("Makefile"),
              Path("scripts"),
              Path("arch/arm64"),
          ]

          files = []
          for root in search_roots:
              if root.is_file():
                  files.append(root)
              elif root.is_dir():
                  files.extend([p for p in root.rglob("*") if p.is_file()])

          replacements = {
              "--prefix=$(GCC_TOOLCHAIN_DIR)": "--prefix=$(GCC_TOOLCHAIN_DIR)$(notdir $(CROSS_COMPILE))",
              "--prefix=$(dir $(shell which $(CROSS_COMPILE)elfedit))": "--prefix=$(dir $(shell which $(CROSS_COMPILE)elfedit))$(notdir $(CROSS_COMPILE))",
              "--prefix=$(dir $(shell which $(CROSS_COMPILE)gcc))": "--prefix=$(dir $(shell which $(CROSS_COMPILE)gcc))$(notdir $(CROSS_COMPILE))",
              "--prefix=$(dir $(shell which $(CROSS_COMPILE)ld))": "--prefix=$(dir $(shell which $(CROSS_COMPILE)ld))$(notdir $(CROSS_COMPILE))",
          }

          changed = []

          for path in files:
              try:
                  text = path.read_text(errors="ignore")
              except Exception:
                  continue

              original = text

              for old, new in replacements.items():
                  if old in text and new not in text:
                      text = text.replace(old, new)

              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          print("Changed files:")
          if changed:
              for item in changed:
                  print(" -", item)
          else:
              print(" - none")
          PY

          echo "===== AFTER PATCH: clang prefix lines ====="
          grep -RIn -- "--prefix=" Makefile scripts arch/arm64 2>/dev/null || true
          grep -RIn -- "gcc-toolchain" Makefile scripts arch/arm64 2>/dev/null || true
          grep -RIn -- "no-integrated-as" Makefile scripts arch/arm64 2>/dev/null || true

          echo "===== CHECK TARGET BINUTILS ====="
          command -v aarch64-linux-gnu-as
          command -v aarch64-linux-gnu-ld.bfd
          command -v aarch64-linux-gnu-gcc


      - name: Add KernelSU Next official legacy
        shell: bash
        working-directory: kernel
        run: |
          set -e

          echo "===== ADD KERNELSU NEXT OFFICIAL LEGACY v11 ====="
          rm -rf KernelSU KernelSU-Next drivers/kernelsu kernel/kernelsu
          rm -f ksu-path.log ksu-files-preview.txt ksu-markers.txt

          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

          echo "===== KERNELSU NEXT PATH AUTODETECT ====="
          KSU_DIR=""

          for CANDIDATE in KernelSU-Next KernelSU drivers/kernelsu kernel/kernelsu; do
            if [ -e "$CANDIDATE" ]; then
              KSU_DIR="$CANDIDATE"
              break
            fi
          done

          if [ -n "$KSU_DIR" ]; then
            echo "KSU_DIR=$KSU_DIR" | tee ksu-path.log
            find "$KSU_DIR" -maxdepth 3 -type f \( -name "Kconfig" -o -name "Makefile" -o -name "*.c" -o -name "*.h" \) > ksu-files-preview.txt || true
            sed -n '1,180p' ksu-files-preview.txt || true
          else
            echo "KernelSU Next directory not found by common names."
            echo "This can still be valid if setup.sh patched source directly."
            find . -maxdepth 2 -type d | sort > ksu-files-preview.txt || true
            sed -n '1,180p' ksu-files-preview.txt || true
          fi

          echo "===== KSU NEXT PATCH MARKERS ====="
          grep -RIn "KernelSU-Next\|KernelSU\|CONFIG_KSU\|source.*KSU\|kernelsu" Kconfig Makefile drivers fs kernel security arch > ksu-markers.txt 2>/dev/null || true
          sed -n '1,260p' ksu-markers.txt || true

          echo "===== VERIFY KSU NEXT INTEGRATION ====="
          if [ ! -s ksu-markers.txt ]; then
            echo "ERROR: KernelSU Next setup completed but no KSU marker was found"
            exit 1
          fi

          echo "KernelSU Next setup markers found."



      - name: Patch KernelSU Next manual hooks
        shell: bash
        working-directory: kernel
        run: |
          set -e

          echo "===== PATCH KERNELSU NEXT MANUAL HOOKS v12 ====="

          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              p = Path(path)
              if not p.exists():
                  print(f"[SKIP] {path}: missing")
                  return None
              return p.read_text(errors="ignore")

          def write(path, text):
              Path(path).write_text(text)

          def insert_before(path, marker, block, tag):
              text = read(path)
              if text is None:
                  return False
              if tag in text:
                  print(f"[OK] {path}: {tag} already present")
                  return True
              idx = text.find(marker)
              if idx < 0:
                  print(f"[WARN] {path}: marker not found for {tag}: {marker}")
                  return False
              text = text[:idx] + block + "\n" + text[idx:]
              write(path, text)
              print(f"[PATCH] {path}: inserted {tag}")
              return True

          def find_open_brace(text, start):
              brace = text.find("{", start)
              return brace

          def insert_after_brace(path, func_marker, block, tag):
              text = read(path)
              if text is None:
                  return False
              if tag in text:
                  print(f"[OK] {path}: {tag} already present")
                  return True
              start = text.find(func_marker)
              if start < 0:
                  print(f"[WARN] {path}: function marker not found for {tag}: {func_marker}")
                  return False
              brace = find_open_brace(text, start)
              if brace < 0:
                  print(f"[WARN] {path}: opening brace not found for {tag}")
                  return False
              insert_at = brace + 1
              text = text[:insert_at] + "\n" + block + text[insert_at:]
              write(path, text)
              print(f"[PATCH] {path}: inserted {tag}")
              return True

          def insert_after_in_func(path, func_marker, after_marker, block, tag):
              text = read(path)
              if text is None:
                  return False
              if tag in text:
                  print(f"[OK] {path}: {tag} already present")
                  return True
              start = text.find(func_marker)
              if start < 0:
                  print(f"[WARN] {path}: function marker not found for {tag}: {func_marker}")
                  return False
              idx = text.find(after_marker, start)
              if idx < 0:
                  print(f"[WARN] {path}: inner marker not found for {tag}: {after_marker}")
                  return False
              insert_at = idx + len(after_marker)
              text = text[:insert_at] + "\n" + block + text[insert_at:]
              write(path, text)
              print(f"[PATCH] {path}: inserted {tag}")
              return True

          # 1) fs/exec.c - native do_execve hook
          exec_extern = """#ifdef CONFIG_KSU
          /* KSU_NEXT_MANUAL_HOOK_EXEC_EXTERN */
          __attribute__((hot))
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
                          void *argv, void *envp, int *flags);
          #endif
          """
          insert_before(
              "fs/exec.c",
              "int do_execve(struct filename *filename",
              exec_extern,
              "KSU_NEXT_MANUAL_HOOK_EXEC_EXTERN",
          )

          exec_call = """#ifdef CONFIG_KSU
          \t/* KSU_NEXT_MANUAL_HOOK_EXEC_CALL */
          \tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);
          #endif"""
          ok_exec = insert_after_in_func(
              "fs/exec.c",
              "int do_execve(struct filename *filename",
              "struct user_arg_ptr envp = { .ptr.native = __envp };",
              exec_call,
              "KSU_NEXT_MANUAL_HOOK_EXEC_CALL",
          )
          if not ok_exec:
              print("[WARN] fs/exec.c: native do_execve hook was not applied; continuing because reboot hook is the Kbuild gate")

          # 2) fs/open.c - faccessat hook
          open_extern = """#ifdef CONFIG_KSU
          /* KSU_NEXT_MANUAL_HOOK_FACCESSAT_EXTERN */
          __attribute__((hot))
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,
                          int *mode, int *flags);
          #endif

          """
          open_text = read("fs/open.c")
          if open_text is not None:
              if "KSU_NEXT_MANUAL_HOOK_FACCESSAT_EXTERN" not in open_text:
                  markers = ["SYSCALL_DEFINE3(faccessat", "long do_faccessat("]
                  placed = False
                  for m in markers:
                      if m in open_text:
                          open_text = open_text.replace(m, open_extern + m, 1)
                          placed = True
                          break
                  if placed:
                      write("fs/open.c", open_text)
                      print("[PATCH] fs/open.c: inserted KSU_NEXT_MANUAL_HOOK_FACCESSAT_EXTERN")
                  else:
                      print("[WARN] fs/open.c: faccessat marker not found for extern")
              else:
                  print("[OK] fs/open.c: faccessat extern already present")

          open_call = """#ifdef CONFIG_KSU
          \t/* KSU_NEXT_MANUAL_HOOK_FACCESSAT_CALL */
          \tksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif"""
          ok_open = insert_after_in_func(
              "fs/open.c",
              "SYSCALL_DEFINE3(faccessat",
              "unsigned int lookup_flags = LOOKUP_FOLLOW;",
              open_call,
              "KSU_NEXT_MANUAL_HOOK_FACCESSAT_CALL",
          )
          if not ok_open:
              ok_open = insert_after_in_func(
                  "fs/open.c",
                  "long do_faccessat(",
                  "unsigned int lookup_flags = LOOKUP_FOLLOW;",
                  open_call,
                  "KSU_NEXT_MANUAL_HOOK_FACCESSAT_CALL",
              )
          if not ok_open:
              print("[WARN] fs/open.c: faccessat hook was not applied")

          # 3) fs/read_write.c - sys_read hook
          read_extern = """#ifdef CONFIG_KSU
          /* KSU_NEXT_MANUAL_HOOK_READ_EXTERN */
          extern bool ksu_vfs_read_hook __read_mostly;
          extern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd,
                          char __user **buf_ptr, size_t *count_ptr);
          #endif

          """
          rw_text = read("fs/read_write.c")
          if rw_text is not None:
              if "KSU_NEXT_MANUAL_HOOK_READ_EXTERN" not in rw_text:
                  marker = "SYSCALL_DEFINE3(read"
                  if marker in rw_text:
                      rw_text = rw_text.replace(marker, read_extern + marker, 1)
                      write("fs/read_write.c", rw_text)
                      print("[PATCH] fs/read_write.c: inserted KSU_NEXT_MANUAL_HOOK_READ_EXTERN")
                  else:
                      print("[WARN] fs/read_write.c: SYSCALL_DEFINE3(read marker not found for extern")
              else:
                  print("[OK] fs/read_write.c: read extern already present")

          read_call = """#ifdef CONFIG_KSU
          \t/* KSU_NEXT_MANUAL_HOOK_READ_CALL */
          \tif (unlikely(ksu_vfs_read_hook))
          \t\tksu_handle_sys_read(fd, (char __user **)&buf, &count);
          #endif"""
          ok_read = insert_after_in_func(
              "fs/read_write.c",
              "SYSCALL_DEFINE3(read",
              "ssize_t ret = -EBADF;",
              read_call,
              "KSU_NEXT_MANUAL_HOOK_READ_CALL",
          )
          if not ok_read:
              print("[WARN] fs/read_write.c: read hook was not applied")

          # 4) fs/stat.c - newfstatat hook
          stat_extern = """#ifdef CONFIG_KSU
          /* KSU_NEXT_MANUAL_HOOK_STAT_EXTERN */
          __attribute__((hot))
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user,
                          int *flags);
          #endif

          """
          stat_text = read("fs/stat.c")
          if stat_text is not None:
              if "KSU_NEXT_MANUAL_HOOK_STAT_EXTERN" not in stat_text:
                  markers = ["SYSCALL_DEFINE4(newfstatat", "int vfs_fstatat(", "int vfs_statx("]
                  placed = False
                  for m in markers:
                      if m in stat_text:
                          stat_text = stat_text.replace(m, stat_extern + m, 1)
                          placed = True
                          break
                  if placed:
                      write("fs/stat.c", stat_text)
                      print("[PATCH] fs/stat.c: inserted KSU_NEXT_MANUAL_HOOK_STAT_EXTERN")
                  else:
                      print("[WARN] fs/stat.c: stat marker not found for extern")
              else:
                  print("[OK] fs/stat.c: stat extern already present")

          stat_call = """#ifdef CONFIG_KSU
          \t/* KSU_NEXT_MANUAL_HOOK_STAT_CALL */
          \tksu_handle_stat(&dfd, &filename, &flag);
          #endif"""
          ok_stat = insert_after_in_func(
              "fs/stat.c",
              "SYSCALL_DEFINE4(newfstatat",
              "int error;",
              stat_call,
              "KSU_NEXT_MANUAL_HOOK_STAT_CALL",
          )
          if not ok_stat:
              # fallback for vfs_fstatat uses variable 'flag'
              ok_stat = insert_after_in_func(
                  "fs/stat.c",
                  "int vfs_fstatat(",
                  "unsigned int lookup_flags = 0;",
                  stat_call,
                  "KSU_NEXT_MANUAL_HOOK_STAT_CALL",
              )
          if not ok_stat:
              print("[WARN] fs/stat.c: stat hook was not applied")

          # 5) kernel/reboot.c - this is required by KernelSU-Next Kbuild to accept manual mode
          reboot_extern = """#ifdef CONFIG_KSU
          /* KSU_NEXT_MANUAL_HOOK_REBOOT_EXTERN */
          extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);
          #endif

          """
          insert_before(
              "kernel/reboot.c",
              "SYSCALL_DEFINE4(reboot",
              reboot_extern,
              "KSU_NEXT_MANUAL_HOOK_REBOOT_EXTERN",
          )

          reboot_call = """#ifdef CONFIG_KSU
          \t/* KSU_NEXT_MANUAL_HOOK_REBOOT_CALL */
          \tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
          #endif"""
          ok_reboot = insert_after_in_func(
              "kernel/reboot.c",
              "SYSCALL_DEFINE4(reboot",
              "int ret = 0;",
              reboot_call,
              "KSU_NEXT_MANUAL_HOOK_REBOOT_CALL",
          )
          if not ok_reboot:
              ok_reboot = insert_after_brace(
                  "kernel/reboot.c",
                  "SYSCALL_DEFINE4(reboot",
                  reboot_call,
                  "KSU_NEXT_MANUAL_HOOK_REBOOT_CALL",
              )

          if not ok_reboot:
              raise SystemExit("ERROR: kernel/reboot.c was not patched; KernelSU-Next Kbuild will fail manual mode")

          print("===== MANUAL HOOK PATCH SUMMARY =====")
          for f in ["fs/exec.c", "fs/open.c", "fs/read_write.c", "fs/stat.c", "kernel/reboot.c"]:
              text = read(f)
              if text is None:
                  continue
              count = text.count("KSU_NEXT_MANUAL_HOOK_")
              print(f"{f}: {count} KSU_NEXT_MANUAL_HOOK markers")

          reboot_text = read("kernel/reboot.c") or ""
          if "ksu_handle_sys_reboot" not in reboot_text:
              raise SystemExit("ERROR: ksu_handle_sys_reboot marker missing after patch")

          print("Manual hook patch done.")
          PY

          echo "===== VERIFY MANUAL HOOK MARKERS ====="
          grep -RIn "KSU_NEXT_MANUAL_HOOK\|ksu_handle_sys_reboot\|ksu_handle_execveat\|ksu_handle_faccessat\|ksu_handle_sys_read\|ksu_handle_stat" \
            fs/exec.c fs/open.c fs/read_write.c fs/stat.c kernel/reboot.c 2>/dev/null || true



      - name: Backport path_umount for KernelSU Next
        shell: bash
        working-directory: kernel
        run: |
          set -e

          echo "===== BACKPORT path_umount FOR KERNELSU NEXT v13 ====="

          python3 - <<'PY'
          from pathlib import Path

          ns = Path("fs/namespace.c")
          internal = Path("fs/internal.h")

          if not ns.exists():
              raise SystemExit("ERROR: fs/namespace.c not found")

          text = ns.read_text(errors="ignore")

          if "KSU_NEXT_BACKPORT_PATH_UMOUNT" in text or "int path_umount(struct path *path, int flags)" in text:
              print("[OK] fs/namespace.c already has path_umount backport")
          else:
              marker = "static bool is_mnt_ns_file(struct dentry *dentry)"
              if marker not in text:
                  raise SystemExit("ERROR: marker not found in fs/namespace.c: static bool is_mnt_ns_file")

              block = '''
          /*
           * KSU_NEXT_BACKPORT_PATH_UMOUNT
           *
           * Linux 4.9 does not provide path_umount(), but KernelSU Next expects it.
           * Backport a minimal wrapper using the existing do_umount() path from this
           * kernel tree. This mirrors newer VFS behavior closely enough for KSU Next.
           */
          #ifdef CONFIG_KSU
          static int ksu_next_can_umount(const struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);

          	if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
          		return -EINVAL;
          	if (!may_mount())
          		return -EPERM;
          	if (path->dentry != path->mnt->mnt_root)
          		return -EINVAL;
          	if (!check_mnt(mnt))
          		return -EINVAL;
