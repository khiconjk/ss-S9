      - name: Patch missing WireGuard Kconfig safely
        shell: bash
        working-directory: kernel
        run: |
          set -e

          LOG="wireguard-kconfig-fix-l66.log"
          : > "$LOG"
          echo "===== WIREGUARD KCONFIG SAFE FIX L66 =====" | tee -a "$LOG"

          if grep -qE '^[[:space:]]*(source|rsource)[[:space:]]+"net/wireguard/Kconfig"' net/Kconfig 2>/dev/null; then
            echo "net/Kconfig references net/wireguard/Kconfig" | tee -a "$LOG"

            if [ ! -f net/wireguard/Kconfig ]; then
              echo "net/wireguard/Kconfig is missing; disabling stale source line before defconfig" | tee -a "$LOG"
              cp -av net/Kconfig net/Kconfig.before-wireguard-l66 2>&1 | tee -a "$LOG"
              sed -i -E 's@^([[:space:]]*)(source|rsource)([[:space:]]+)"net/wireguard/Kconfig".*@\1# L66 disabled stale missing WireGuard Kconfig source@' net/Kconfig
            else
              echo "net/wireguard/Kconfig exists; keeping source line" | tee -a "$LOG"
            fi
          else
            echo "No stale net/wireguard/Kconfig source line found" | tee -a "$LOG"
          fi

          # Guard against leftover CONFIG_WIREGUARD forcing a missing menu.
          for CFG in arch/arm64/configs/*.config arch/arm64/configs/*_defconfig arch/arm64/configs/*defconfig; do
            [ -f "$CFG" ] || continue
            if grep -qE '^CONFIG_WIREGUARD=' "$CFG"; then
              echo "Disabling CONFIG_WIREGUARD in $CFG" | tee -a "$LOG"
              sed -i 's/^CONFIG_WIREGUARD=.*/# CONFIG_WIREGUARD is not set/' "$CFG"
            fi
          done

          echo "===== net/Kconfig wireguard lines after fix =====" | tee -a "$LOG"
          grep -nEi 'wireguard' net/Kconfig 2>/dev/null | tee -a "$LOG" || true

          echo "WireGuard Kconfig safe fix L66 completed" | tee -a "$LOG"

      - name: Patch missing SipHash weak compat object safely
        shell: bash
        working-directory: kernel
        run: |
          set -e

          LOG="siphash-linkfix-l66.log"
          : > "$LOG"
          echo "===== SIPHASH WEAK COMPAT LINK FIX L66 =====" | tee -a "$LOG"

          echo "===== siphash references before fix =====" | tee -a "$LOG"
          grep -RIn "siphash_4u64\|siphash_3u32\|__siphash_aligned\|siphash.o\|CONFIG_SIPHASH" \
            include lib net kernel 2>/dev/null | head -260 | tee -a "$LOG" || true

          mkdir -p kernel
          cat > kernel/siphash_compat_l66.c <<'EOF_SIPHASH_COMPAT'
          /*
           * KSU_NEXT_SIPHASH_COMPAT_L66
           * Legacy Exynos9810 tree: net/ uses siphash symbols while the object
           * is not reliably linked into vmlinux. These weak definitions are
           * linked from kernel/built-in.o. If the tree later links a real strong
           * implementation, the strong one will win.
           */
          #include <linux/types.h>
          #include <linux/kernel.h>
          #include <linux/string.h>
          #include <linux/siphash.h>

          #ifndef __weak
          #define __weak __attribute__((weak))
          #endif

          #ifndef rol64
          #define rol64(x, n) (((x) << (n)) | ((x) >> (64 - (n))))
          #endif

          #define KSU_SIPHASH_ROUND do { \
              v0 += v1; v1 = rol64(v1, 13); v1 ^= v0; v0 = rol64(v0, 32); \
              v2 += v3; v3 = rol64(v3, 16); v3 ^= v2; \
              v0 += v3; v3 = rol64(v3, 21); v3 ^= v0; \
              v2 += v1; v1 = rol64(v1, 17); v1 ^= v2; v2 = rol64(v2, 32); \
          } while (0)

          static inline u64 ksu_get_unaligned_le64_l66(const void *p)
          {
              const u8 *b = p;
              return ((u64)b[0]) | ((u64)b[1] << 8) | ((u64)b[2] << 16) | ((u64)b[3] << 24) |
                     ((u64)b[4] << 32) | ((u64)b[5] << 40) | ((u64)b[6] << 48) | ((u64)b[7] << 56);
          }

          __weak u64 __siphash_aligned(const void *data, size_t len, const siphash_key_t *key)
          {
              const u8 *in = data;
              const u64 *k = (const u64 *)key;
              u64 k0 = k[0];
              u64 k1 = k[1];
              u64 v0 = 0x736f6d6570736575ULL ^ k0;
              u64 v1 = 0x646f72616e646f6dULL ^ k1;
              u64 v2 = 0x6c7967656e657261ULL ^ k0;
              u64 v3 = 0x7465646279746573ULL ^ k1;
              u64 b = ((u64)len) << 56;
              u64 m;

              while (len >= 8) {
                  m = ksu_get_unaligned_le64_l66(in);
                  v3 ^= m;
                  KSU_SIPHASH_ROUND;
                  KSU_SIPHASH_ROUND;
                  v0 ^= m;
                  in += 8;
                  len -= 8;
              }

              switch (len) {
              case 7: b |= ((u64)in[6]) << 48;
              case 6: b |= ((u64)in[5]) << 40;
              case 5: b |= ((u64)in[4]) << 32;
              case 4: b |= ((u64)in[3]) << 24;
              case 3: b |= ((u64)in[2]) << 16;
              case 2: b |= ((u64)in[1]) << 8;
              case 1: b |= ((u64)in[0]);
              default: break;
              }

              v3 ^= b;
              KSU_SIPHASH_ROUND;
              KSU_SIPHASH_ROUND;
              v0 ^= b;
              v2 ^= 0xff;
              KSU_SIPHASH_ROUND;
              KSU_SIPHASH_ROUND;
              KSU_SIPHASH_ROUND;
              KSU_SIPHASH_ROUND;
              return v0 ^ v1 ^ v2 ^ v3;
          }

          __weak u64 siphash_3u32(const u32 a, const u32 b, const u32 c, const siphash_key_t *key)
          {
              u32 data[3] = { a, b, c };
              return __siphash_aligned(data, sizeof(data), key);
          }

          __weak u64 siphash_4u64(const u64 a, const u64 b, const u64 c, const u64 d, const siphash_key_t *key)
          {
              u64 data[4] = { a, b, c, d };
              return __siphash_aligned(data, sizeof(data), key);
          }
          EOF_SIPHASH_COMPAT

          if grep -q "KSU_NEXT_SIPHASH_COMPAT_L66" kernel/Makefile; then
            echo "kernel/Makefile already has KSU_NEXT_SIPHASH_COMPAT_L66" | tee -a "$LOG"
          else
            {
              echo ""
              echo "# KSU_NEXT_SIPHASH_COMPAT_L66: provide weak siphash symbols for net/built-in.o link."
              echo "obj-y += siphash_compat_l66.o"
            } >> kernel/Makefile
            echo "[PATCH] kernel/Makefile: obj-y += siphash_compat_l66.o" | tee -a "$LOG"
          fi

          # Keep previous safer hints too, but do not rely on them. This helps if the
          # tree has an official CONFIG_SIPHASH path while the compat object remains weak.
          if grep -Rqs "config SIPHASH" lib Kconfig crypto net; then
            echo "CONFIG_SIPHASH=y" >> arch/arm64/configs/$TEMP_DEFCONFIG
            echo "[PATCH] TEMP_DEFCONFIG: appended CONFIG_SIPHASH=y" | tee -a "$LOG"
          else
            echo "No CONFIG_SIPHASH Kconfig entry found; weak kernel object is the active fix" | tee -a "$LOG"
          fi

          echo "===== kernel/Makefile siphash lines after fix =====" | tee -a "$LOG"
          grep -n "siphash_compat_l66\|KSU_NEXT_SIPHASH_COMPAT_L66" kernel/Makefile | tee -a "$LOG" || true
          echo "===== compat source preview =====" | tee -a "$LOG"
          ls -lah kernel/siphash_compat_l66.c | tee -a "$LOG"
          grep -n "__siphash_aligned\|siphash_3u32\|siphash_4u64\|__weak" kernel/siphash_compat_l66.c | tee -a "$LOG" || true

          echo "SipHash weak compat link fix L66 completed" | tee -a "$LOG"

      - name: Apply clean S9 ghost uptime proc surface L66
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail
          echo "===== APPLY CLEAN S9 GHOST UPTIME L66 ====="
          mkdir -p scripts include/linux kernel
          cat > scripts/ci_apply_s9_ghost_uptime_l66.py <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          TIMEKEEPING = ROOT / 'kernel/time/timekeeping.c'
          STAT = ROOT / 'fs/stat.c'
          PROC_UPTIME = ROOT / 'fs/proc/uptime.c'
          PROC_STAT = ROOT / 'fs/proc/stat.c'
          SYS = ROOT / 'kernel/sys.c'
          HEADER = ROOT / 'include/linux/ghost_uptime.h'
          MODULE = ROOT / 'kernel/ghost_uptime.c'
          KMAKE = ROOT / 'kernel/Makefile'
          REPORT = ROOT / 's9-ghost-uptime-l66-report.txt'

          def die(msg):
              raise SystemExit('ERROR: ' + msg)

          def read(path):
              if not path.exists():
                  die(f'missing {path}')
              return path.read_text(errors='ignore')

          def write(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(data)

          def add_include_once(data, include_line):
              if include_line in data:
                  return data
              matches = list(re.finditer(r'#include\s+<[^>]+>', data))
              if not matches:
                  die(f'no include anchor for {include_line}')
              m = matches[-1]
              return data[:m.end()] + '\n' + include_line + data[m.end():]

          report = []

          write(HEADER, '''#ifndef _LINUX_GHOST_UPTIME_H
          #define _LINUX_GHOST_UPTIME_H

          #include <linux/types.h>
          #include <linux/time64.h>

          struct inode;
          struct kstat;
          struct timespec;
          struct timespec64;
          struct sysinfo;

          extern u64 ghost_uptime_offset_ns;
          void ghost_uptime_apply_boot_time(struct timespec64 *boot_time, time64_t wall_sec);
          void ghost_uptime_apply_stat(struct inode *inode, struct kstat *stat);
          u64 ghost_uptime_get_offset_ns(void);
          void ghost_uptime_apply_proc_uptime_ts(struct timespec *uptime);
          void ghost_uptime_apply_proc_uptime_pair(struct timespec *uptime, struct timespec *idle);
          void ghost_uptime_apply_proc_btime64(struct timespec64 *boottime);
          void ghost_uptime_apply_sysinfo(struct sysinfo *info);

          #endif /* _LINUX_GHOST_UPTIME_H */
          ''')

          write(MODULE, '''// SPDX-License-Identifier: GPL-2.0
          /*
           * S9/Exynos9810 clean ghost uptime helper L66.
           *
           * Design:
           * - one module owns the offset
           * - timekeeping_get_delta(), raw clock, sched_clock and fast clocks stay untouched
           * - timekeeping_init() only shifts the boot-time source once
           * - generic_fillattr() reuses the same offset for selected virtual fs timestamps
           */

          #include <linux/ghost_uptime.h>
          #include <linux/export.h>
          #include <linux/fs.h>
          #include <linux/jiffies.h>
          #include <linux/kernel.h>
          #include <linux/math64.h>
          #include <linux/printk.h>
          #include <linux/stat.h>
          #include <linux/time.h>
          #include <linux/time64.h>

          #define GHOST_UPTIME_MIN_DAYS 15ULL
          #define GHOST_UPTIME_MAX_DAYS 25ULL
          #define GHOST_UPTIME_DAY_SECS 86400ULL
          #define GHOST_UPTIME_MIN_SECS (GHOST_UPTIME_MIN_DAYS * GHOST_UPTIME_DAY_SECS)
          #define GHOST_UPTIME_RANGE_SECS ((GHOST_UPTIME_MAX_DAYS - GHOST_UPTIME_MIN_DAYS + 1ULL) * GHOST_UPTIME_DAY_SECS)

          u64 ghost_uptime_offset_ns __read_mostly;
          EXPORT_SYMBOL_GPL(ghost_uptime_offset_ns);

          static bool ghost_uptime_ready __read_mostly;

          static u64 ghost_uptime_mix64(u64 x)
          {
              x ^= x >> 33;
              x *= 0xff51afd7ed558ccdULL;
              x ^= x >> 33;
              x *= 0xc4ceb9fe1a85ec53ULL;
              x ^= x >> 33;
              return x;
          }

          static u64 ghost_uptime_read_counter(void)
          {
              u64 counter = 0;
          #if defined(CONFIG_ARM64)
              asm volatile("mrs %0, cntpct_el0" : "=r" (counter));
          #endif
              return counter;
          }

          static u64 ghost_uptime_make_offset_secs(time64_t wall_sec)
          {
              u64 seed = ghost_uptime_read_counter();
              u64 secs;

              seed ^= (u64)jiffies << 32;
              seed ^= (u64)wall_sec;
              seed ^= (u64)(unsigned long)&seed;
              seed = ghost_uptime_mix64(seed);

              secs = GHOST_UPTIME_MIN_SECS + (seed % GHOST_UPTIME_RANGE_SECS);
              if (wall_sec > 0)
                  secs += (u64)(wall_sec % 1800);
              return secs;
          }

          void ghost_uptime_apply_boot_time(struct timespec64 *boot_time, time64_t wall_sec)
          {
              u64 secs;

              if (!boot_time || ghost_uptime_ready)
                  return;

              secs = ghost_uptime_make_offset_secs(wall_sec);

              if (boot_time->tv_sec > (time64_t)secs)
                  boot_time->tv_sec -= (time64_t)secs;
              else if (wall_sec > (time64_t)secs)
                  boot_time->tv_sec = wall_sec - (time64_t)secs;
              else
                  boot_time->tv_sec = 0;

              ghost_uptime_offset_ns = secs * NSEC_PER_SEC;
              ghost_uptime_ready = true;

          #ifndef CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
              pr_info("ghost_uptime_l66: offset_secs=%llu offset_days=%llu\n",
                      secs, div64_u64(secs, GHOST_UPTIME_DAY_SECS));
          #endif
          }
          EXPORT_SYMBOL_GPL(ghost_uptime_apply_boot_time);

          u64 ghost_uptime_get_offset_ns(void)
          {
              return ghost_uptime_offset_ns;
          }
          EXPORT_SYMBOL_GPL(ghost_uptime_get_offset_ns);

          static u64 ghost_uptime_offset_secs(void)
          {
              if (!ghost_uptime_offset_ns)
                  return 0;
              return div64_u64(ghost_uptime_offset_ns, NSEC_PER_SEC);
          }

          void ghost_uptime_apply_proc_uptime_pair(struct timespec *uptime, struct timespec *idle)
          {
              u64 off = ghost_uptime_offset_secs();

              if (!off)
                  return;
              if (uptime)
                  uptime->tv_sec += (time_t)off;
              if (idle)
                  idle->tv_sec += (time_t)off;
          }
          EXPORT_SYMBOL_GPL(ghost_uptime_apply_proc_uptime_pair);

          void ghost_uptime_apply_proc_uptime_ts(struct timespec *uptime)
          {
              ghost_uptime_apply_proc_uptime_pair(uptime, NULL);
          }
          EXPORT_SYMBOL_GPL(ghost_uptime_apply_proc_uptime_ts);

          void ghost_uptime_apply_sysinfo(struct sysinfo *info)
          {
              u64 off = ghost_uptime_offset_secs();

              if (!info || !off)
                  return;
              info->uptime += (long)off;
          }
          EXPORT_SYMBOL_GPL(ghost_uptime_apply_sysinfo);

          void ghost_uptime_apply_proc_btime64(struct timespec64 *boottime)
          {
              u64 off;

              if (!boottime || !ghost_uptime_offset_ns)
                  return;
              off = ghost_uptime_offset_secs();
              if (boottime->tv_sec > (time64_t)off)
                  boottime->tv_sec -= (time64_t)off;
              else
                  boottime->tv_sec = 0;
          }
          EXPORT_SYMBOL_GPL(ghost_uptime_apply_proc_btime64);

          static bool ghost_uptime_stat_magic_allowed(unsigned long magic)
          {
              switch (magic) {
              case 0x9fa0:
              case 0x62656572:
              case 0x1021994:
              case 0x64626720:
              case 0x73636673:
              case 0x27e0eb:
              case 0x6e736673:
              case 0x1373:
                  return true;
              default:
                  return false;
              }
          }

          static void ghost_uptime_sub_time64(struct timespec64 *ts, u64 off)
          {
              if (!ts)
                  return;
              if (ts->tv_sec > 0 && (u64)ts->tv_sec > off)
                  ts->tv_sec -= off;
          }

          void ghost_uptime_apply_stat(struct inode *inode, struct kstat *stat)
          {
              u64 off;

              if (!inode || !inode->i_sb || !stat || !ghost_uptime_offset_ns)
                  return;
              if (!ghost_uptime_stat_magic_allowed(inode->i_sb->s_magic))
                  return;

              off = div64_u64(ghost_uptime_offset_ns, NSEC_PER_SEC);
              ghost_uptime_sub_time64(&stat->atime, off);
              ghost_uptime_sub_time64(&stat->mtime, off);
              ghost_uptime_sub_time64(&stat->ctime, off);
          }
          EXPORT_SYMBOL_GPL(ghost_uptime_apply_stat);
          ''')
          report.append('wrote include/linux/ghost_uptime.h')
          report.append('wrote kernel/ghost_uptime.c')

          km = read(KMAKE)
          # S9 kernel/Makefile defines obj-y after the file header, so adding
          # obj-y at the very top can be overwritten later.  Force a bottom
          # append marker to guarantee ghost_uptime.o is linked into vmlinux.
          km = re.sub(r'(?m)^obj-y\s*\+=\s*ghost_uptime\.o\s*\n', '', km)
          marker = '# S9_GHOST_UPTIME_L66_LINK_OBJECT\nobj-y += ghost_uptime.o\n'
          if 'S9_GHOST_UPTIME_L66_LINK_OBJECT' not in km:
              km = km.rstrip() + '\n\n' + marker
              write(KMAKE, km)
              report.append('kernel/Makefile appended obj-y += ghost_uptime.o at bottom')
          else:
              report.append('kernel/Makefile already contains bottom ghost_uptime.o marker')

          tk = read(TIMEKEEPING)
          tk_orig = tk
          tk = add_include_once(tk, '#include <linux/ghost_uptime.h>')
          tk = re.sub(r'\n?\s*static\s+inline\s+u64\s+get_fake_boottime(?:_ns)?\s*\(\s*void\s*\)\s*\{.*?\}\s*', '\n', tk, flags=re.S)
          tk = re.sub(r'return\s+delta\s*\+\s*get_fake_boottime(?:_ns)?\s*\(\s*\)\s*;', 'return delta;', tk)
          tk = re.sub(r'return\s+tk_clock_read\s*\(\s*tkr\s*\)\s*-\s*tkr->cycle_last\s*\+\s*get_fake_boottime(?:_ns)?\s*\(\s*\)\s*;', 'return tk_clock_read(tkr) - tkr->cycle_last;', tk)
          tk = re.sub(r'\s*\+\s*get_fake_boottime(?:_ns)?\s*\(\s*\)', '', tk)
          tk = re.sub(r'\bu64\s+arch_sys_boot_offset\s*(?:=\s*0)?\s*;\s*(?:EXPORT_SYMBOL_GPL\s*\(\s*arch_sys_boot_offset\s*\)\s*;)?', '', tk)

          call = '\n\tghost_uptime_apply_boot_time(&boot, now.tv_sec);'
          if 'ghost_uptime_apply_boot_time(&boot, now.tv_sec)' not in tk:
              pattern = r'(if\s*\(\s*boot\.tv_sec\s*==\s*0\s*&&\s*boot\.tv_nsec\s*==\s*0\s*\)\s*boot\s*=\s*tk_xtime\s*\(\s*tk\s*\)\s*;)'
              tk, n = re.subn(pattern, r'\1' + call, tk, count=1)
              if n != 1:
                  die('cannot find S9 boot=tk_xtime anchor in timekeeping_init()')
          if 'get_fake_boottime' in tk:
              die('old get_fake_boottime remains in timekeeping.c')
          if re.search(r'return\s+delta\s*\+', tk):
              die('suspicious return delta + remains in timekeeping.c')
          if tk.count('ghost_uptime_apply_boot_time(&boot, now.tv_sec)') != 1:
              die('ghost_uptime_apply_boot_time call count is not exactly 1')
          write(TIMEKEEPING, tk)
          report.append(f'timekeeping.c changed={tk != tk_orig}')

          st = read(STAT)
          st_orig = st
          st = add_include_once(st, '#include <linux/ghost_uptime.h>')
          st = re.sub(r'\n?\s*extern\s+u64\s+arch_sys_boot_offset\s*;\s*', '\n', st)
          if 'ghost_uptime_apply_stat(inode, stat);' not in st:
              st, n = re.subn(r'(stat->blocks\s*=\s*inode->i_blocks\s*;)', r'\1\n\tghost_uptime_apply_stat(inode, stat);', st, count=1)
              if n != 1:
                  die('cannot find stat->blocks anchor in fs/stat.c')
          if st.count('ghost_uptime_apply_stat(inode, stat);') != 1:
              die('ghost_uptime_apply_stat call count is not exactly 1')
          if 'arch_sys_boot_offset' in st:
              die('old arch_sys_boot_offset reference remains in fs/stat.c')
          write(STAT, st)
          report.append(f'stat.c changed={st != st_orig}')


          # /proc/uptime and /proc/stat are Android-visible uptime surfaces.
          # L66 also adjusts /proc/uptime idle field and sysinfo(2), which toybox uptime often uses.
          # Keep real CLOCK_MONOTONIC / RAW untouched; only change exported display values.
          pu = read(PROC_UPTIME)
          pu_orig = pu
          pu = add_include_once(pu, '#include <linux/ghost_uptime.h>')
          pu = pu.replace('ghost_uptime_apply_proc_uptime_ts(&uptime);', '')
          if 'ghost_uptime_apply_proc_uptime_pair(&uptime, &idle);' not in pu:
              pu, n = re.subn(r'(idle\.tv_nsec\s*=\s*(?:\(long\))?rem\s*;)', r'\1\n\tghost_uptime_apply_proc_uptime_pair(&uptime, &idle);', pu, count=1)
              if n != 1:
                  die('cannot find idle.tv_nsec = rem anchor in fs/proc/uptime.c')
          if pu.count('ghost_uptime_apply_proc_uptime_pair(&uptime, &idle);') != 1:
              die('ghost_uptime_apply_proc_uptime_pair call count is not exactly 1')
          write(PROC_UPTIME, pu)
          report.append(f'proc/uptime.c pair-sync changed={pu != pu_orig}')

          sysc = read(SYS)
          sysc_orig = sysc
          sysc = add_include_once(sysc, '#include <linux/ghost_uptime.h>')
          # kernel/sys.c is compiled as old GNU C with -Werror=declaration-after-statement.
          # Force a file-scope prototype near the include area because the previous
          # header include can land inside vendor/KSU #ifdef include regions on this tree.
          sysc = re.sub(r'\n\s*/\* S9_GHOST_UPTIME_SYSINFO_PROTO_L66 \*/\s*\n\s*extern\s+void\s+ghost_uptime_apply_sysinfo\s*\(\s*struct\s+sysinfo\s*\*\s*info\s*\)\s*;\s*', '\n', sysc)
          sysc = re.sub(r'\n\s*extern\s+void\s+ghost_uptime_apply_sysinfo\s*\(\s*struct\s+sysinfo\s*\*\s*info\s*\)\s*;\s*\n\s*ghost_uptime_apply_sysinfo\s*\(\s*info\s*\)\s*;', '\n\tghost_uptime_apply_sysinfo(info);', sysc)
          sysc = re.sub(r'\n\s*extern\s+void\s+ghost_uptime_apply_sysinfo\s*\(\s*struct\s+sysinfo\s*\*\s*info\s*\)\s*;', '\n', sysc)
          proto = '\n/* S9_GHOST_UPTIME_SYSINFO_PROTO_L66 */\nextern void ghost_uptime_apply_sysinfo(struct sysinfo *info);\n'
          if 'S9_GHOST_UPTIME_SYSINFO_PROTO_L66' not in sysc:
              anchor = '#include <linux/syscalls.h>'
              if anchor in sysc:
                  sysc = sysc.replace(anchor, anchor + proto, 1)
              else:
                  m = re.search(r'(?m)^(#include\s+<[^>]+>\s*)', sysc)
                  if not m:
                      die('cannot find safe top-level include anchor in kernel/sys.c for sysinfo prototype')
                  sysc = sysc[:m.end()] + proto + sysc[m.end():]
          if 'ghost_uptime_apply_sysinfo(info);' not in sysc:
              sysc, n = re.subn(r'(info->uptime\s*=\s*[^;]+;)', r'\1\n\tghost_uptime_apply_sysinfo(info);', sysc, count=1)
              if n != 1:
                  die('cannot find info->uptime assignment anchor in kernel/sys.c')
          if sysc.count('ghost_uptime_apply_sysinfo(info);') != 1:
              die('ghost_uptime_apply_sysinfo call count is not exactly 1')
          if 'S9_GHOST_UPTIME_SYSINFO_PROTO_L66' not in sysc:
              die('ghost_uptime sysinfo top-level prototype marker missing in kernel/sys.c')
          if '#include <linux/ghost_uptime.h>' not in sysc:
              die('ghost_uptime header include missing in kernel/sys.c')
          write(SYS, sysc)
          report.append(f'kernel/sys.c sysinfo-sync top-level-prototype changed={sysc != sysc_orig}')

          ps = read(PROC_STAT)
          ps_orig = ps
          ps = add_include_once(ps, '#include <linux/ghost_uptime.h>')
          if 'ghost_uptime_apply_proc_btime64(&boottime);' not in ps:
              ps, n = re.subn(r'(getboottime64\s*\(\s*&boottime\s*\)\s*;)', r'\1\n\tghost_uptime_apply_proc_btime64(&boottime);', ps, count=1)
              if n != 1:
                  die('cannot find getboottime64(&boottime) anchor in fs/proc/stat.c')
          if ps.count('ghost_uptime_apply_proc_btime64(&boottime);') != 1:
              die('ghost_uptime_apply_proc_btime64 call count is not exactly 1')
          write(PROC_STAT, ps)
          report.append(f'proc/stat.c changed={ps != ps_orig}')

          REPORT.write_text('\n'.join(report) + '\n')
          print(REPORT.read_text())
          PY
          python3 scripts/ci_apply_s9_ghost_uptime_l66.py
          echo "===== VERIFY S9 GHOST UPTIME L66 ====="
          grep -RniE "ghost_uptime_apply_boot_time|ghost_uptime_apply_stat|ghost_uptime_apply_proc_uptime_pair|ghost_uptime_apply_sysinfo|ghost_uptime_apply_proc_uptime_ts|ghost_uptime_apply_proc_btime64|ghost_uptime_offset_ns|ghost_uptime_l66|get_fake_boottime|arch_sys_boot_offset|return[[:space:]]+delta[[:space:]]*\\+" \
            kernel/time/timekeeping.c fs/stat.c fs/proc/uptime.c fs/proc/stat.c kernel/sys.c include/linux/ghost_uptime.h kernel/ghost_uptime.c kernel/Makefile 2>/dev/null || true
          if grep -RniE "get_fake_boottime|arch_sys_boot_offset|return[[:space:]]+delta[[:space:]]*\\+" kernel/time/timekeeping.c fs/stat.c include/linux/ghost_uptime.h 2>/dev/null; then
            echo "ERROR: old/dirty uptime pattern still exists"
            exit 1
          fi
          grep -q "ghost_uptime_apply_boot_time(&boot, now.tv_sec)" kernel/time/timekeeping.c
          grep -q "ghost_uptime_apply_stat(inode, stat);" fs/stat.c
          grep -q "S9_GHOST_UPTIME_L66_LINK_OBJECT" kernel/Makefile
          grep -q "ghost_uptime_apply_proc_uptime_pair(&uptime, &idle);" fs/proc/uptime.c
          grep -q "ghost_uptime_apply_sysinfo(info);" kernel/sys.c
          grep -q "S9_GHOST_UPTIME_SYSINFO_PROTO_L66" kernel/sys.c
          grep -q "ghost_uptime_apply_proc_btime64(&boottime);" fs/proc/stat.c
          cp -f s9-ghost-uptime-l66-report.txt ../s9-ghost-uptime-l66-report.txt

      - name: Patch CLOCK_BOOTTIME user surface L66
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail
          echo "===== PATCH CLOCK_BOOTTIME USER SURFACE L66 ====="
          cat > scripts/ci_patch_s9_boottime_surface_l66.py <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          HEADER = ROOT / 'include/linux/ghost_uptime.h'
          MODULE = ROOT / 'kernel/ghost_uptime.c'
          CANDIDATES = [
              ROOT / 'kernel/time/posix-timers.c',
              ROOT / 'kernel/time/posix-stubs.c',
          ]
          REPORT = ROOT / 's9-boottime-surface-l66-report.txt'

          def die(msg):
              raise SystemExit('ERROR: ' + msg)

          def read(path):
              if not path.exists():
                  die(f'missing {path}')
              return path.read_text(errors='ignore')

          def write(path, data):
              path.write_text(data)

          def add_include_once(data, include_line):
              if include_line in data:
                  return data
              matches = list(re.finditer(r'#include\s+<[^>]+>', data))
              if not matches:
                  die(f'no include anchor for {include_line}')
              m = matches[-1]
              return data[:m.end()] + '\n' + include_line + data[m.end():]

          report = []

          h = read(HEADER)
          if 'ghost_uptime_apply_boottime_ts(struct timespec *ts)' not in h:
              h = h.replace('void ghost_uptime_apply_sysinfo(struct sysinfo *info);',
                  'void ghost_uptime_apply_sysinfo(struct sysinfo *info);\n'
                  'void ghost_uptime_apply_boottime_ts(struct timespec *ts);\n'
                  'void ghost_uptime_apply_boottime_ts64(struct timespec64 *ts);')
              write(HEADER, h)
              report.append('header added boottime prototypes')
          else:
              report.append('header boottime prototypes already present')

          m = read(MODULE)
          if 'ghost_uptime_apply_boottime_ts(struct timespec *ts)' not in m:
              block = r'''

          void ghost_uptime_apply_boottime_ts(struct timespec *ts)
          {
              u64 off = ghost_uptime_offset_secs();

              if (!ts || !off)
                  return;
              ts->tv_sec += (time_t)off;
          }
          EXPORT_SYMBOL_GPL(ghost_uptime_apply_boottime_ts);

          void ghost_uptime_apply_boottime_ts64(struct timespec64 *ts)
          {
              u64 off = ghost_uptime_offset_secs();

              if (!ts || !off)
                  return;
              ts->tv_sec += (time64_t)off;
          }
          EXPORT_SYMBOL_GPL(ghost_uptime_apply_boottime_ts64);
          '''
              marker = 'void ghost_uptime_apply_proc_btime64(struct timespec64 *boottime)'
              idx = m.find(marker)
              if idx < 0:
                  die('cannot find proc_btime64 anchor in ghost_uptime.c')
              m = m[:idx] + block + '\n' + m[idx:]
              write(MODULE, m)
              report.append('module added boottime apply helpers')
          else:
              report.append('module boottime apply helpers already present')

          patched = []
          for path in CANDIDATES:
              if not path.exists():
                  report.append(f'{path}: missing, skipped')
                  continue
              txt = read(path)
              orig = txt
              if 'posix_get_boottime' not in txt and 'CLOCK_BOOTTIME' not in txt:
                  report.append(f'{path}: no boottime symbols, skipped')
                  continue
              txt = add_include_once(txt, '#include <linux/ghost_uptime.h>')

              def patch_func(match):
                  body = match.group(0)
                  if 'ghost_uptime_apply_boottime_ts(' in body or 'ghost_uptime_apply_boottime_ts64(' in body:
                      return body
                  sig = body.split('{', 1)[0]
                  m_ts = re.search(r'struct\s+timespec\s*\*\s*(\w+)', sig)
                  m_ts64 = re.search(r'struct\s+timespec64\s*\*\s*(\w+)', sig)
                  if m_ts:
                      var = m_ts.group(1)
                      body2, n = re.subn(r'(get_monotonic_boottime\s*\(\s*' + re.escape(var) + r'\s*\)\s*;)',
                                         r'\1\n\tghost_uptime_apply_boottime_ts(' + var + r');', body, count=1)
                      if n == 0:
                          body2, n = re.subn(r'(ktime_get_boottime_ts\s*\(\s*' + re.escape(var) + r'\s*\)\s*;)',
                                             r'\1\n\tghost_uptime_apply_boottime_ts(' + var + r');', body, count=1)
                      if n == 0:
                          body2, n = re.subn(r'(return\s+0\s*;)', r'ghost_uptime_apply_boottime_ts(' + var + r');\n\t\1', body, count=1)
                      if n:
                          return body2
                  if m_ts64:
                      var = m_ts64.group(1)
                      body2, n = re.subn(r'(ktime_get_boottime_ts64\s*\(\s*' + re.escape(var) + r'\s*\)\s*;)',
                                         r'\1\n\tghost_uptime_apply_boottime_ts64(' + var + r');', body, count=1)
                      if n == 0:
                          body2, n = re.subn(r'(return\s+0\s*;)', r'ghost_uptime_apply_boottime_ts64(' + var + r');\n\t\1', body, count=1)
                      if n:
                          return body2
                  return body

              func_pat = re.compile(r'static\s+int\s+posix_get_boottime\s*\([^)]*\)\s*\{[^{}]*\}', re.S)
              txt2, n = func_pat.subn(patch_func, txt, count=1)
              txt = txt2
              if n == 0 and 'get_monotonic_boottime(tp);' in txt and 'ghost_uptime_apply_boottime_ts(tp);' not in txt:
                  txt = txt.replace('get_monotonic_boottime(tp);', 'get_monotonic_boottime(tp);\n\tghost_uptime_apply_boottime_ts(tp);', 1)
                  n = 1

              if txt != orig:
                  write(path, txt)
                  patched.append(str(path))
                  report.append(f'{path}: patched boottime user surface')
              else:
                  report.append(f'{path}: unchanged')

          if not patched:
              report.append('WARNING: no posix boottime surface patched; v81 will behave like v69 for elapsedRealtime')
          else:
              report.append('patched_files=' + ','.join(patched))

          REPORT.write_text('\n'.join(report) + '\n')
          print(REPORT.read_text())
          PY
          python3 scripts/ci_patch_s9_boottime_surface_l66.py
          echo "===== VERIFY CLOCK_BOOTTIME USER SURFACE L66 ====="
          cat s9-boottime-surface-l66-report.txt
          grep -RniE "ghost_uptime_apply_boottime_ts|posix_get_boottime|CLOCK_BOOTTIME|get_monotonic_boottime|ktime_get_boottime" \
            include/linux/ghost_uptime.h kernel/ghost_uptime.c kernel/time/posix-timers.c kernel/time/posix-stubs.c 2>/dev/null || true
          cp -f s9-boottime-surface-l66-report.txt ../s9-boottime-surface-l66-report.txt

      - name: Patch CLOCK_BOOTTIME VDSO data surface L66
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail
          echo "===== PATCH CLOCK_BOOTTIME VDSO DATA SURFACE L66 ====="
          cat > scripts/ci_patch_s9_boottime_vdso_l66.py <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          VDSO = ROOT / 'arch/arm64/kernel/vdso.c'
          HEADER = ROOT / 'include/linux/ghost_uptime.h'
          MODULE = ROOT / 'kernel/ghost_uptime.c'
          REPORT = ROOT / 's9-boottime-vdso-l66-report.txt'

          def die(msg):
              raise SystemExit('ERROR: ' + msg)

          def read(path):
              if not path.exists():
                  die(f'missing {path}')
              return path.read_text(errors='ignore')

          def write(path, data):
              path.write_text(data)

          report = []

          h = read(HEADER)
          if 'ghost_uptime_apply_boottime_ts(struct timespec *ts)' not in h:
              anchor = 'void ghost_uptime_apply_sysinfo(struct sysinfo *info);'
              if anchor not in h:
                  die('missing sysinfo prototype anchor in ghost_uptime.h')
              h = h.replace(anchor, anchor + '\nvoid ghost_uptime_apply_boottime_ts(struct timespec *ts);\nvoid ghost_uptime_apply_boottime_ts64(struct timespec64 *ts);')
              write(HEADER, h)
              report.append('header added boottime prototypes')
          else:
              report.append('header already has boottime prototypes')

          m = read(MODULE)
          if 'ghost_uptime_apply_boottime_ts(struct timespec *ts)' not in m:
              block = """

          void ghost_uptime_apply_boottime_ts(struct timespec *ts)
          {
              u64 off = ghost_uptime_offset_secs();

              if (!ts || !off)
                  return;
              ts->tv_sec += (time_t)off;
          }
          EXPORT_SYMBOL_GPL(ghost_uptime_apply_boottime_ts);

          void ghost_uptime_apply_boottime_ts64(struct timespec64 *ts)
          {
              u64 off = ghost_uptime_offset_secs();

              if (!ts || !off)
                  return;
              ts->tv_sec += (time64_t)off;
          }
          EXPORT_SYMBOL_GPL(ghost_uptime_apply_boottime_ts64);
          """
              anchor = 'void ghost_uptime_apply_proc_btime64(struct timespec64 *boottime)'
              idx = m.find(anchor)
              if idx < 0:
                  die('missing proc_btime64 anchor in ghost_uptime.c')
              m = m[:idx] + block + '\n' + m[idx:]
              write(MODULE, m)
              report.append('module added boottime helpers')
          else:
              report.append('module already has boottime helpers')

          txt = read(VDSO)
          orig = txt
          if '#include <linux/ghost_uptime.h>' not in txt:
              if '#include <linux/timekeeper_internal.h>' in txt:
                  txt = txt.replace('#include <linux/timekeeper_internal.h>', '#include <linux/timekeeper_internal.h>\n#include <linux/ghost_uptime.h>', 1)
              elif '#include "datapage.h"' in txt:
                  txt = txt.replace('#include "datapage.h"', '#include "datapage.h"\n#include <linux/ghost_uptime.h>', 1)
              else:
                  txt = txt.replace('struct vdso_mappings', '#include <linux/ghost_uptime.h>\nstruct vdso_mappings', 1)
              report.append('vdso.c added ghost_uptime include')

          if 'S9_GHOST_BOOTTIME_VDSO_L66' not in txt:
              pat = 'struct timespec btm = ktime_to_timespec(tk->offs_boot);'
              if pat in txt:
                  txt = txt.replace(pat, pat + '\n\t\t/* S9_GHOST_BOOTTIME_VDSO_L66 */\n\t\tghost_uptime_apply_boottime_ts(&btm);', 1)
                  report.append('vdso.c patched tk->offs_boot btm fast path')
              else:
                  txt2, n = re.subn(
                      r'(struct\s+timespec\s+btm\s*=\s*ktime_to_timespec\s*\(\s*tk->offs_boot\s*\)\s*;)',
                      r'\1\n\t\t/* S9_GHOST_BOOTTIME_VDSO_L66 */\n\t\tghost_uptime_apply_boottime_ts(&btm);',
                      txt,
                      count=1,
                  )
                  if n != 1:
                      die('cannot patch vdso btm fast path')
                  txt = txt2
                  report.append('vdso.c patched tk->offs_boot btm fast path via regex')
          else:
              report.append('vdso.c vdso marker already present')

          if txt != orig:
              write(VDSO, txt)
          if 'S9_GHOST_BOOTTIME_VDSO_L66' not in read(VDSO):
              die('vdso marker missing after patch')
          REPORT.write_text('\n'.join(report) + '\n')
          print(REPORT.read_text())
          PY
          python3 scripts/ci_patch_s9_boottime_vdso_l66.py
          echo "===== VERIFY CLOCK_BOOTTIME VDSO L66 ====="
          cat s9-boottime-vdso-l66-report.txt
          grep -RniE "S9_GHOST_BOOTTIME_VDSO_L66|ghost_uptime_apply_boottime_ts|btm_sec|offs_boot" \
            arch/arm64/kernel/vdso.c include/linux/ghost_uptime.h kernel/ghost_uptime.c 2>/dev/null | tee s9-boottime-vdso-l66-verify.log || true
          cp -f s9-boottime-vdso-l66-report.txt ../s9-boottime-vdso-l66-report.txt
          cp -f s9-boottime-vdso-l66-verify.log ../s9-boottime-vdso-l66-verify.log

      - name: Prepare defconfig
        shell: bash
        working-directory: kernel
        run: |
          set -e

          CONFIG_DIR="arch/arm64/configs"
          BASE_DEFCONFIG="$CONFIG_DIR/exynos9810_defconfig"
          DEVICE_CONFIG="$CONFIG_DIR/$DEVICE_DEFCONFIG"
          TEMP_CONFIG="$CONFIG_DIR/$TEMP_DEFCONFIG"

          if [ ! -f "$DEVICE_CONFIG" ]; then
            echo "Missing device defconfig: $DEVICE_CONFIG"
            exit 1
          fi

          rm -f "$TEMP_CONFIG"

          if [ -s "$BASE_DEFCONFIG" ]; then
            cat "$BASE_DEFCONFIG" > "$TEMP_CONFIG"
            printf '\n' >> "$TEMP_CONFIG"
            cat "$DEVICE_CONFIG" >> "$TEMP_CONFIG"
          else
            cp -f "$DEVICE_CONFIG" "$TEMP_CONFIG"
          fi

          printf '\n# GitHub Actions target: %s %s Android 10 Q\n' "$DEVICE" "$MODEL_NAME" >> "$TEMP_CONFIG"

          cat >> "$TEMP_CONFIG" <<'EOF'

          # KernelSU Next official legacy v57 SuSFS Bridge L66 manual hook
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KSU_KPROBES_HOOK is not set
          # CONFIG_KSU_KPROBE_HOOKS is not set

          # SuSFS level 1: keep useful core features, disable risky/extra features first
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          # CONFIG_KSU_SUSFS_ENABLE_LOG is not set
          # CONFIG_KSU_SUSFS_SUS_OVERLAYFS is not set
          # CONFIG_KSU_SUSFS_SPOOF_UNAME is not set
          # CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG is not set
          # CONFIG_KSU_SUSFS_OPEN_REDIRECT is not set
          # CONFIG_KSU_SUSFS_SUS_SU is not set
          EOF

          echo "===== TEMP DEFCONFIG ====="
          ls -lah "$TEMP_CONFIG"
          tail -80 "$TEMP_CONFIG" || true

      - name: Build kernel and dtb.img
        shell: bash
        working-directory: kernel
        run: |
          set -eo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC="clang --target=aarch64-linux-gnu --prefix=/usr/bin/aarch64-linux-gnu- -no-integrated-as"
          export HOSTCC=gcc
          export HOSTCXX=g++
          export AS=aarch64-linux-gnu-as
          export LD=aarch64-linux-gnu-ld.bfd
          export AR=aarch64-linux-gnu-ar
          export NM=aarch64-linux-gnu-nm
          export OBJCOPY=aarch64-linux-gnu-objcopy
          export OBJDUMP=aarch64-linux-gnu-objdump
          export STRIP=aarch64-linux-gnu-strip
          export READELF=aarch64-linux-gnu-readelf
          export PLATFORM_VERSION="$PLATFORM_VERSION"
          export ANDROID_MAJOR_VERSION="$ANDROID_MAJOR_VERSION"
          export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          export KBUILD_BUILD_USER=khiconjk
          export KBUILD_BUILD_HOST=github-actions

          MAKE_ARGS=(
            V=0
            ARCH=arm64
            SUBARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
            "CC=clang --target=aarch64-linux-gnu --prefix=/usr/bin/aarch64-linux-gnu- -no-integrated-as"
            HOSTCC=gcc
            HOSTCXX=g++
            AS=aarch64-linux-gnu-as
            LD=aarch64-linux-gnu-ld.bfd
            AR=aarch64-linux-gnu-ar
            NM=aarch64-linux-gnu-nm
            OBJCOPY=aarch64-linux-gnu-objcopy
            OBJDUMP=aarch64-linux-gnu-objdump
            STRIP=aarch64-linux-gnu-strip
            READELF=aarch64-linux-gnu-readelf
            PLATFORM_VERSION="$PLATFORM_VERSION"
            ANDROID_MAJOR_VERSION="$ANDROID_MAJOR_VERSION"
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          )

          echo "===== COMPILER TEST ====="
          clang --target=aarch64-linux-gnu --prefix=/usr/bin/aarch64-linux-gnu- -no-integrated-as -x c -c /dev/null -o /tmp/clang-arm64-test.o
          file /tmp/clang-arm64-test.o

          echo "===== DEFCONFIG ====="
          make "${MAKE_ARGS[@]}" "$TEMP_DEFCONFIG" 2>&1 | tee defconfig.log

          echo "===== OLDDEFCONFIG ====="
          make "${MAKE_ARGS[@]}" olddefconfig 2>&1 | tee olddefconfig.log

          echo "===== HARD REPAIR KSU/SUSFS CONFIG AFTER OLDDEFCONFIG L66 ====="
          if [ -f "drivers/kernelsu/Kconfig" ]; then
            if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then
              if grep -q '^endmenu' drivers/Kconfig; then
                sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
              else
                printf '\nsource "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig
              fi
              echo "[PATCH] drivers/Kconfig: re-added source drivers/kernelsu/Kconfig"
            else
              echo "[OK] drivers/Kconfig already sources drivers/kernelsu/Kconfig"
            fi

            if ! grep -q 'kernelsu/' drivers/Makefile; then
              printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
              echo "[PATCH] drivers/Makefile: re-added obj-$(CONFIG_KSU) += kernelsu/"
            else
              echo "[OK] drivers/Makefile already includes kernelsu/"
            fi
          else
            echo "[WARN] drivers/kernelsu/Kconfig missing before config force"
          fi

          python3 - <<'PYCONFIG'
          from pathlib import Path
          p = Path('.config')
          if not p.exists():
              raise SystemExit('ERROR: .config missing before hard repair')
          text = p.read_text(errors='ignore').splitlines()
          set_y = {
              'CONFIG_KSU',
              'CONFIG_KSU_MANUAL_HOOK',
              'CONFIG_KSU_SUSFS',
              'CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT',
              'CONFIG_KSU_SUSFS_SUS_PATH',
              'CONFIG_KSU_SUSFS_SUS_MOUNT',
              'CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT',
              'CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT',
              'CONFIG_KSU_SUSFS_SUS_KSTAT',
              'CONFIG_KSU_SUSFS_TRY_UMOUNT',
              'CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT',
              'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS',
          }
          set_n = {
              'CONFIG_KSU_DEBUG',
              'CONFIG_KSU_DISABLE_MANAGER',
              'CONFIG_KSU_DISABLE_POLICY',
              'CONFIG_KSU_ALLOWLIST_WORKAROUND',
              'CONFIG_KSU_KPROBES_HOOK',
              'CONFIG_KSU_KPROBE_HOOKS',
              'CONFIG_KSU_SUSFS_ENABLE_LOG',
              'CONFIG_KSU_SUSFS_SUS_OVERLAYFS',
              'CONFIG_KSU_SUSFS_SPOOF_UNAME',
              'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG',
              'CONFIG_KSU_SUSFS_OPEN_REDIRECT',
              'CONFIG_KSU_SUSFS_SUS_SU',
          }
          keys = set_y | set_n
          out = []
          for line in text:
              stripped = line.strip()
              key = None
              if stripped.startswith('CONFIG_') and '=' in stripped:
                  key = stripped.split('=', 1)[0]
              elif stripped.startswith('# CONFIG_') and stripped.endswith(' is not set'):
                  key = stripped.split()[1]
              if key in keys:
                  continue
              out.append(line)
          out.append('')
          out.append('# KSU/SuSFS hard repair L66 after olddefconfig')
          for k in sorted(set_y):
              out.append(f'{k}=y')
          for k in sorted(set_n):
              out.append(f'# {k} is not set')
          p.write_text('\n'.join(out) + '\n')
          print('[PATCH] .config: force-wrote KSU/SuSFS options L66')
          PYCONFIG

          echo "===== OLDDEFCONFIG AFTER KSU/SUSFS HARD REPAIR L66 ====="
          make "${MAKE_ARGS[@]}" olddefconfig 2>&1 | tee -a olddefconfig.log

          echo "===== CONFIG CHECK ====="
          grep -E "CONFIG_SOC_EXYNOS9810|CONFIG_CAMERA_STAR|CONFIG_CAMERA_STAR2|CONFIG_CAMERA_CROWN|CONFIG_EXYNOS_DTBTOOL|CONFIG_BUILD_ARM64_APPENDED|CONFIG_MODULES|CONFIG_ANDROID|CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS|CONFIG_KSU_KPROBES_HOOK|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS" .config || true

          if ! grep -q "^CONFIG_KSU=y" .config; then
            echo "ERROR: CONFIG_KSU was not enabled"
            exit 1
          fi

          if ! grep -q "^CONFIG_KSU_MANUAL_HOOK=y" .config; then
            echo "ERROR: CONFIG_KSU_MANUAL_HOOK was not enabled"
            exit 1
          fi
          if ! grep -q "^CONFIG_KSU_SUSFS=y" .config; then
            echo "ERROR: CONFIG_KSU_SUSFS was not enabled"
            grep -n "KSU_SUSFS" .config || true
            exit 1
          fi

          if [ ! -f fs/susfs.c ] || [ ! -f include/linux/susfs.h ]; then
            echo "ERROR: SuSFS files missing before build"
            ls -lah fs/susfs.c include/linux/susfs.h 2>/dev/null || true
            exit 1
          fi

          if ! grep -q "ksu_handle_sys_reboot" kernel/reboot.c; then
            echo "ERROR: manual reboot hook marker missing; KernelSU-Next Kbuild will reject manual mode"
            exit 1
          fi

          echo "===== BUILD IMAGE + DTBS + DTB.IMG ====="
          make -j"$(nproc --all)" "${MAKE_ARGS[@]}" Image Image.gz dtbs dtb.img 2>&1 | tee build.log

          echo "===== IF dtb.img IS STILL MISSING, TRY dtb.img AGAIN WITH V=1 ====="
          if [ ! -f "arch/arm64/boot/dtb.img" ]; then
            make -j"$(nproc --all)" "${MAKE_ARGS[@]}" V=1 dtb.img 2>&1 | tee -a build.log
          fi

          echo "===== OUTPUTS ====="
          ls -lah arch/arm64/boot || true
          find arch/arm64/boot -maxdepth 8 -type f \( -name "Image*" -o -name "*.dtb" -o -name "dtb.img" -o -name "*.ko" \) -print -exec ls -lh {} \; || true

      - name: Build v81 clock surface diagnostic probe
        shell: bash
        working-directory: kernel
        run: |
          set -e

          OUT_DIR="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT_DIR"

          cat > "$OUT_DIR/v81-clock-probe.c" <<'EOF_CPROBE'
          #define _GNU_SOURCE
          #include <errno.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <time.h>
          #include <unistd.h>
          #include <sys/sysinfo.h>

          #ifndef CLOCK_MONOTONIC_RAW
          #define CLOCK_MONOTONIC_RAW 4
          #endif
          #ifndef CLOCK_BOOTTIME
          #define CLOCK_BOOTTIME 7
          #endif

          static double ts_sec(struct timespec ts) {
              return (double)ts.tv_sec + (double)ts.tv_nsec / 1000000000.0;
          }

          static double read_proc_uptime_first(double *idle_out) {
              FILE *f = fopen("/proc/uptime", "r");
              double up = -1.0, idle = -1.0;
              if (!f) return -1.0;
              if (fscanf(f, "%lf %lf", &up, &idle) != 2) up = -1.0;
              fclose(f);
              if (idle_out) *idle_out = idle;
              return up;
          }

          static long long read_btime(void) {
              FILE *f = fopen("/proc/stat", "r");
              char line[512];
              long long b = -1;
              if (!f) return -1;
              while (fgets(line, sizeof(line), f)) {
                  if (sscanf(line, "btime %lld", &b) == 1) break;
              }
              fclose(f);
              return b;
          }

          int main(void) {
              printf("===== V81 native clock surface probe =====\n");
              printf("pid=%ld uid=%ld\n", (long)getpid(), (long)getuid());
              printf("CLOCK ids: REALTIME=%d MONOTONIC=%d MONOTONIC_RAW=%d BOOTTIME=%d\n",
                     CLOCK_REALTIME, CLOCK_MONOTONIC, CLOCK_MONOTONIC_RAW, CLOCK_BOOTTIME);

              for (int i = 0; i < 6; ++i) {
                  struct timespec rt = {0}, mono = {0}, raw = {0}, boot = {0};
                  struct sysinfo si;
                  double idle = -1.0;
                  double proc_up = read_proc_uptime_first(&idle);
                  long long btime = read_btime();
                  time_t now = time(NULL);
                  int er = 0;

                  er |= clock_gettime(CLOCK_REALTIME, &rt);
                  er |= clock_gettime(CLOCK_MONOTONIC, &mono);
                  er |= clock_gettime(CLOCK_MONOTONIC_RAW, &raw);
                  er |= clock_gettime(CLOCK_BOOTTIME, &boot);
                  memset(&si, 0, sizeof(si));
                  if (sysinfo(&si) != 0) si.uptime = -1;

                  double rt_s = ts_sec(rt);
                  double mono_s = ts_sec(mono);
                  double raw_s = ts_sec(raw);
                  double boot_s = ts_sec(boot);

                  printf("\n--- sample %d ---\n", i + 1);
                  printf("CLOCK_REALTIME      %.9f\n", rt_s);
                  printf("CLOCK_MONOTONIC     %.9f\n", mono_s);
                  printf("CLOCK_MONOTONIC_RAW %.9f\n", raw_s);
                  printf("CLOCK_BOOTTIME      %.9f\n", boot_s);
                  printf("sysinfo.uptime      %ld\n", (long)si.uptime);
                  printf("/proc/uptime        %.2f %.2f\n", proc_up, idle);
                  printf("/proc/stat btime    %lld\n", btime);
                  printf("time(NULL)          %lld\n", (long long)now);
                  printf("date_minus_btime    %lld\n", btime > 0 ? (long long)now - btime : -1LL);
                  printf("diff proc-boot      %.6f\n", proc_up - boot_s);
                  printf("diff proc-mono      %.6f\n", proc_up - mono_s);
                  printf("diff boot-mono      %.6f\n", boot_s - mono_s);
                  printf("diff mono-raw       %.6f\n", mono_s - raw_s);
                  printf("diff sysinfo-boot   %.6f\n", (double)si.uptime - boot_s);
                  printf("clock_errors_or     %d errno=%d(%s)\n", er, errno, strerror(errno));
                  fflush(stdout);
                  sleep(1);
              }
              return 0;
          }
          EOF_CPROBE

          sed -i 's/^          //' "$OUT_DIR/v81-clock-probe.c"

          echo "===== BUILD ARM64 CLOCK PROBE ROBUST L66 ====="
          PROBE_LOG="$OUT_DIR/v81-clock-probe-build.log"
          : > "$PROBE_LOG"

          set +e
          echo "[TRY] aarch64-linux-gnu-gcc static + -lrt" | tee -a "$PROBE_LOG"
          aarch64-linux-gnu-gcc -O2 -static -Wall -Wextra "$OUT_DIR/v81-clock-probe.c" -o "$OUT_DIR/v81-clock-probe-arm64" -lrt >> "$PROBE_LOG" 2>&1
          RC=$?

          if [ "$RC" -ne 0 ]; then
            echo "[TRY] aarch64-linux-gnu-gcc dynamic + -lrt" | tee -a "$PROBE_LOG"
            aarch64-linux-gnu-gcc -O2 -Wall -Wextra "$OUT_DIR/v81-clock-probe.c" -o "$OUT_DIR/v81-clock-probe-arm64" -lrt >> "$PROBE_LOG" 2>&1
            RC=$?
          fi

          if [ "$RC" -ne 0 ]; then
            echo "[TRY] clang target aarch64-linux-gnu with sysroot" | tee -a "$PROBE_LOG"
            clang --target=aarch64-linux-gnu --sysroot=/usr/aarch64-linux-gnu -O2 -Wall -Wextra "$OUT_DIR/v81-clock-probe.c" -o "$OUT_DIR/v81-clock-probe-arm64" -lrt >> "$PROBE_LOG" 2>&1
            RC=$?
          fi

          set -e
          if [ "$RC" -eq 0 ] && [ -s "$OUT_DIR/v81-clock-probe-arm64" ]; then
            file "$OUT_DIR/v81-clock-probe-arm64" | tee -a "$PROBE_LOG"
            chmod +x "$OUT_DIR/v81-clock-probe-arm64"
            echo "[OK] native clock probe built" | tee -a "$PROBE_LOG"
          else
            echo "[WARN] native clock probe build failed; keeping kernel artifact and shell diagnostic only" | tee -a "$PROBE_LOG"
            cat > "$OUT_DIR/v81-clock-probe-arm64.README.txt" <<'EOF_README'
          Native clock probe did not compile on the runner.
          Kernel build should still continue. Use v81-clock-surface-check.bat for shell/proc/dumpsys checks, or send v81-clock-probe-build.log for probe compile diagnosis.
          EOF_README
          fi

          cat > "$OUT_DIR/v81-clock-surface-check.bat" <<'EOF_BAT'
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          set ADB=adb
          if exist "D:\platform-tools\adb.exe" set ADB=D:\platform-tools\adb.exe
          set BIN=%~dp0v81-clock-probe-arm64
          set LOG=%~dp0v81-clock-surface-check.log

          echo ===== V81 CLOCK SURFACE CHECK ===== > "%LOG%"
          echo Generated at: %DATE% %TIME% >> "%LOG%"
          echo ADB: %ADB% >> "%LOG%"
          echo. >> "%LOG%"

          echo ===== ADB DEVICES ===== >> "%LOG%"
          "%ADB%" devices >> "%LOG%" 2>&1
          echo. >> "%LOG%"

          echo ===== BASIC ROOT / KERNEL ===== >> "%LOG%"
          "%ADB%" shell "su -c 'id; uname -a'" >> "%LOG%" 2>&1
          echo. >> "%LOG%"

          echo ===== GHOST/SUSFS SYMBOLS ===== >> "%LOG%"
          "%ADB%" shell "su -c 'cat /proc/kallsyms 2>/dev/null | grep -i ghost_uptime | head -120; cat /proc/kallsyms 2>/dev/null | grep -i susfs | head -80'" >> "%LOG%" 2>&1
          echo. >> "%LOG%"

          echo ===== PROC / SYSINFO SURFACES ===== >> "%LOG%"
          "%ADB%" shell "su -c 'cat /proc/uptime; toybox uptime 2>/dev/null || uptime 2>/dev/null; cat /proc/stat | grep btime; date +%%s'" >> "%LOG%" 2>&1
          echo. >> "%LOG%"

          echo ===== ANDROID ELAPSEDREALTIME SURFACE ===== >> "%LOG%"
          "%ADB%" shell "dumpsys alarm | grep -iE 'nowRTC|nowELAPSED|RuntimeStarted|Runtime uptime'" >> "%LOG%" 2>&1
          echo. >> "%LOG%"

          if not exist "%BIN%" (
            echo WARN: Missing native probe binary: %BIN% >> "%LOG%"
            echo Continue with shell/proc/dumpsys checks only. >> "%LOG%"
            echo. >> "%LOG%"
          ) else (
            echo ===== PUSH NATIVE CLOCK PROBE ===== >> "%LOG%"
            "%ADB%" push "%BIN%" /data/local/tmp/v81-clock-probe >> "%LOG%" 2>&1
            "%ADB%" shell "chmod 755 /data/local/tmp/v81-clock-probe" >> "%LOG%" 2>&1
            echo. >> "%LOG%"

            echo ===== RUN NATIVE CLOCK PROBE WITHOUT SU ===== >> "%LOG%"
            "%ADB%" shell "/data/local/tmp/v81-clock-probe" >> "%LOG%" 2>&1
            echo. >> "%LOG%"

            echo ===== RUN NATIVE CLOCK PROBE WITH SU ===== >> "%LOG%"
            "%ADB%" shell "su -c /data/local/tmp/v81-clock-probe" >> "%LOG%" 2>&1
            echo. >> "%LOG%"
          )

          echo ===== TIMER_LIST / DMESG ===== >> "%LOG%"
          "%ADB%" shell "su -c 'cat /proc/timer_list 2>/dev/null | head -60; dmesg | grep -iE \"ghost_uptime|ksud|KernelSU|denied\" | tail -120'" >> "%LOG%" 2>&1
          echo. >> "%LOG%"

          type "%LOG%"
          echo.
          echo Saved log: "%LOG%"
          endlocal
          EOF_BAT

          sed -i 's/^          //' "$OUT_DIR/v81-clock-surface-check.bat"

          cat > "$OUT_DIR/v81-clock-surface-check-device.sh" <<'EOF_SH'
          #!/system/bin/sh
          echo "===== V81 CLOCK SURFACE CHECK DEVICE SH ====="
          id
          uname -a
          echo "-- proc uptime/stat --"
          cat /proc/uptime
          grep '^btime ' /proc/stat
          date +%s
          echo "-- Android elapsedRealtime --"
          dumpsys alarm | grep -iE 'nowRTC|nowELAPSED|RuntimeStarted|Runtime uptime'
          echo "-- native clock probe --"
          if [ -x /data/local/tmp/v81-clock-probe ]; then
            /data/local/tmp/v81-clock-probe
          else
            echo "Missing /data/local/tmp/v81-clock-probe"
          fi
          EOF_SH
          sed -i 's/^          //' "$OUT_DIR/v81-clock-surface-check-device.sh"
          chmod +x "$OUT_DIR/v81-clock-surface-check-device.sh"

          ls -lh "$OUT_DIR"/v81-clock-*

      - name: Show useful errors
        if: failure()
        shell: bash
        working-directory: kernel
        run: |
          echo "===== ERROR LINES ====="
          grep -nEi "error:|fatal error:|undefined reference|ld.lld|ld:|No such file|No rule to make target|FAILED|recipe for target|Stop\.|not found|Permission denied|unrecognized option|unknown argument|unsupported option|Illegal option|dtb.img" \
            clean.log defconfig.log olddefconfig.log build.log 2>/dev/null | tail -350 || true

          echo "===== LAST 350 BUILD LINES ====="
          tail -350 build.log 2>/dev/null || true

          echo "===== LAST 180 DEFCONFIG LINES ====="
          tail -180 defconfig.log 2>/dev/null || true

          echo "===== BOOT OUTPUT TREE ====="
          find arch/arm64/boot -maxdepth 8 -type f -print -exec ls -lh {} \; 2>/dev/null || true

      - name: Prepare failure diagnostics files
        if: failure()
        shell: bash
        working-directory: kernel
        run: |
          set +e
          touch build.log
          {
            echo "===== KernelSU config snapshot ====="
            if [ -f .config ]; then
              grep -E "CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS|CONFIG_KSU_KPROBES_HOOK|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS" .config || true
            else
              echo ".config not generated yet"
            fi
          } > KernelSU-config.txt
          {
            echo "===== SuSFS build info snapshot ====="
            echo "workflow=v81-ksunext-susfs-boottime-vdso-wififix-l66"
            echo "date=$(date -u)"
            echo "DEVICE=${DEVICE:-unknown}"
            echo "MODEL_NAME=${MODEL_NAME:-unknown}"
            echo "KSU_ROOT=${KSU_ROOT:-unknown}"
            echo "KERNEL_PATCH=${KERNEL_PATCH:-unknown}"
            echo ""
            echo "--- available susfs logs ---"
            ls -lah susfs-*.log susfs-*.txt 2>/dev/null || true
            echo ""
            echo "--- susfs markers ---"
            grep -RIn "KSU_NEXT_SUSFS_BRIDGE_L66|CONFIG_KSU_SUSFS|config KSU_SUSFS|CMD_SUSFS|susfs" KernelSU-Next drivers/kernelsu fs include/linux 2>/dev/null | head -500 || true
          } > SuSFS-build-info.txt
          ls -lah build.log KernelSU-config.txt SuSFS-build-info.txt || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ss-S9-${{ steps.target.outputs.device }}-${{ steps.target.outputs.model }}-failure-diagnostics-v81-ksunext-susfs-boottime-vdso-wififix-l66
          path: |
            kernel/*.log
            kernel/*.txt
            kernel/.config
            kernel/**/*.rej
            kernel/**/*.orig
          if-no-files-found: ignore
          compression-level: 6

      - name: Collect kernel outputs
        shell: bash
        working-directory: kernel
        run: |
          set -e

          OUT_DIR="$GITHUB_WORKSPACE/out"
          RAW_DIR="$OUT_DIR/raw"

          mkdir -p "$RAW_DIR"

          echo "===== REQUIRED OUTPUT CHECK ====="

          if [ ! -f "arch/arm64/boot/Image" ]; then
            echo "ERROR: arch/arm64/boot/Image not found"
            find arch/arm64/boot -maxdepth 8 -type f -print || true
            exit 1
          fi

          if [ ! -f "arch/arm64/boot/dtb.img" ]; then
            echo "ERROR: arch/arm64/boot/dtb.img not found"
            echo "Available dtb files:"
            find arch/arm64/boot -maxdepth 8 -type f \( -name "*.dtb" -o -name "dtb.img" \) -print -exec ls -lh {} \; || true
            echo "CONFIG_EXYNOS_DTBTOOL:"
            grep -n "CONFIG_EXYNOS_DTBTOOL" .config || true
            exit 1
          fi

          cp -av "arch/arm64/boot/Image" "$RAW_DIR/Image"
          cp -av "arch/arm64/boot/Image" "$RAW_DIR/zImage"
          cp -av "arch/arm64/boot/dtb.img" "$RAW_DIR/dtb.img"

          [ -f "arch/arm64/boot/Image.gz" ] && cp -av "arch/arm64/boot/Image.gz" "$RAW_DIR/Image.gz" || true
          [ -f "arch/arm64/boot/Image.gz-dtb" ] && cp -av "arch/arm64/boot/Image.gz-dtb" "$RAW_DIR/Image.gz-dtb" || true

          find . -type f -name "*.ko" -print0 > "$OUT_DIR/modules.list" || true

          if [ -s "$OUT_DIR/modules.list" ]; then
            tar --null -czf "$OUT_DIR/modules-${DEVICE}-${MODEL_NAME}.tar.gz" --files-from "$OUT_DIR/modules.list"
          else
            echo "No .ko modules found" > "$OUT_DIR/modules-${DEVICE}-${MODEL_NAME}.txt"
          fi

          cp -av clean.log "$OUT_DIR/clean.log" || true
          cp -av defconfig.log "$OUT_DIR/defconfig.log" || true
          cp -av olddefconfig.log "$OUT_DIR/olddefconfig.log" || true
          cp -av build.log "$OUT_DIR/build.log" || true
          cp -av ksu-next-build-info.txt "$OUT_DIR/KernelSU-Next-build-info.txt" 2>/dev/null || true
          cp -av SuSFS-build-info.txt "$OUT_DIR/SuSFS-build-info.txt" 2>/dev/null || true
          cp -av susfs-*.log "$OUT_DIR/" 2>/dev/null || true
          cp -av susfs-*.txt "$OUT_DIR/" 2>/dev/null || true
          cp -av ksu-next-markers-v57.txt "$OUT_DIR/KernelSU-Next-markers-v57.txt" 2>/dev/null || true
          grep -RIn "KSU_NEXT_MANUAL_HOOK\|ksu_handle_sys_reboot\|ksu_handle_execveat\|ksu_handle_faccessat\|ksu_handle_sys_read\|ksu_handle_stat" fs/exec.c fs/open.c fs/read_write.c fs/stat.c kernel/reboot.c > "$OUT_DIR/KernelSU-manual-hooks.txt" 2>/dev/null || true
          grep -RIn "KSU_NEXT_BACKPORT_PATH_UMOUNT\|int path_umount(struct path \*path, int flags)\|ksu_next_can_umount" fs/namespace.c fs/internal.h > "$OUT_DIR/KernelSU-path-umount.txt" 2>/dev/null || true
          grep -RIn "CONFIG_KSU_SUSFS\|SUSFS\|susfs" fs include/linux KernelSU-Next drivers/kernelsu 2>/dev/null > "$OUT_DIR/SuSFS-markers.txt" || true
          cp -av .config "$OUT_DIR/kernel.config" || true
          for KSU_CANDIDATE in KernelSU-Next KernelSU drivers/kernelsu kernel/kernelsu; do
            if [ -e "$KSU_CANDIDATE" ]; then
              find "$KSU_CANDIDATE" -maxdepth 3 -type f | sort > "$OUT_DIR/KernelSU-files.txt" || true
              break
            fi
          done
          grep -E "CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS|CONFIG_KSU_KPROBES_HOOK|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS" .config > "$OUT_DIR/KernelSU-config.txt" || true

          echo "===== ARTIFACT TREE ====="
          find "$OUT_DIR" -maxdepth 3 -type f -print -exec ls -lh {} \;

      - name: Package AnyKernel3 zip
        shell: bash
        run: |
          set -e

          OUT_DIR="$GITHUB_WORKSPACE/out"
          RAW_DIR="$OUT_DIR/raw"
          AK_DIR="$GITHUB_WORKSPACE/AnyKernel3"
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          ZIP_NAME="ss-S9-${DEVICE}-${MODEL_NAME}-OneUI2.5-Q-v81-ksunext-susfs-boottime-vdso-wififix-l66-${SHORT_SHA}.zip"

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 "$AK_DIR"

          cd "$AK_DIR"

          rm -rf .git .github
          rm -f Image Image.gz Image.gz-dtb Image-dtb zImage zImage-dtb dtb dtb.img dtbo.img
          cp -av "$RAW_DIR/zImage" ./zImage
          cp -av "$RAW_DIR/dtb.img" ./dtb.img

          rm -f anykernel.sh

          printf '%s\n' \
            "### AnyKernel3 Ramdisk Mod Script" \
            "## Auto-generated for ss-S9" \
            "## Target: Samsung Galaxy S9 ${MODEL_NAME} / ${DEVICE} / One UI 2.5 Android 10" \
            "" \
            "properties() { '" \
            "kernel.string=ss-S9 ${DEVICE} ${MODEL_NAME} OneUI2.5 Android10 Q v81 KernelSU Next SuSFS Clock Diagnostic L66" \
            "do.devicecheck=1" \
            "do.modules=0" \
            "do.systemless=1" \
            "do.cleanup=1" \
            "do.cleanuponabort=0" \
            "device.name1=${AK_DEVICE_1}" \
            "device.name2=${AK_DEVICE_2}" \
            "device.name3=${AK_DEVICE_3}" \
            "device.name4=${AK_DEVICE_4}" \
            "device.name5=${DEVICE}" \
            "supported.versions=" \
            "supported.patchlevels=" \
            "'; }" \
            "" \
            "BLOCK=boot" \
            "for CANDIDATE in \\" \
            "  /dev/block/platform/11120000.ufs/by-name/BOOT \\" \
            "  /dev/block/platform/11120000.ufs/by-name/boot \\" \
            "  /dev/block/bootdevice/by-name/boot \\" \
            "  /dev/block/by-name/boot" \
            "do" \
            '  if [ -e "$CANDIDATE" ]; then' \
            '    BLOCK="$CANDIDATE"' \
            "    break" \
            "  fi" \
            "done" \
            "" \
            "IS_SLOT_DEVICE=0" \
            "RAMDISK_COMPRESSION=auto" \
            "PATCH_VBMETA_FLAG=auto" \
            "" \
            ". tools/ak3-core.sh" \
            "" \
            "dump_boot" \
            "write_boot" \
            > anykernel.sh

          chmod +x anykernel.sh

          echo "===== anykernel.sh ====="
          cat anykernel.sh

          zip -r9 "$OUT_DIR/$ZIP_NAME" ./* -x "*.git*" "README.md"
          ls -lh "$OUT_DIR/$ZIP_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ss-S9-${{ steps.target.outputs.device }}-${{ steps.target.outputs.model }}-kernel-v81-ksunext-susfs-boottime-vdso-wififix-l66
          path: |
            out/*.zip
            out/raw/*
            out/*.log
            out/v81-clock-*
            out/kernel.config
            out/modules-*
            out/KernelSU-*.txt
            out/SuSFS-*.txt
            out/susfs-*.log
            out/susfs-*.txt
            out/KernelSU-manual-hooks.txt
            out/KernelSU-path-umount.txt
            out/KernelSU-Next-build-info.txt
            out/KernelSU-Next-markers-v57.txt
          if-no-files-found: error
          compression-level: 6
