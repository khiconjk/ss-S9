          fn_pos = itxt.rfind("int __init kernelsu_init", 0, itxt.find("susfs_init();") if "susfs_init();" in itxt else len(itxt))
          call_pos = itxt.find("susfs_init();", fn_pos if fn_pos >= 0 else 0)
          if fn_pos >= 0 and call_pos >= 0:
              visible = itxt[fn_pos:call_pos]
              if "extern void susfs_init(void);" not in visible:
                  itxt = itxt[:call_pos] + "\textern void susfs_init(void);\n" + itxt[call_pos:]
                  write(init, itxt)
                  print(f"[PATCH] {init}: forced local susfs_init prototype before call")
          print(f"[PATCH] {init}: added susfs_init bridge")

          dispatch = kdir / "supercall" / "dispatch.c"
          dtxt = read(dispatch)
          if "KSU_NEXT_SUSFS_BRIDGE_L21_INCLUDE" not in dtxt:
              lines = dtxt.splitlines(True)
              pos = 0
              for i, line in enumerate(lines[:120]):
                  if line.lstrip().startswith("#include"):
                      pos = i + 1
              inc = "#ifdef CONFIG_KSU_SUSFS\n/* KSU_NEXT_SUSFS_BRIDGE_L21_INCLUDE */\n#include <linux/susfs.h>\n#include <linux/uaccess.h>\n#endif\n"
              lines.insert(pos, inc)
              dtxt = "".join(lines)

          if "KSU_NEXT_SUSFS_BRIDGE_L21_HANDLERS" not in dtxt:
              handler = r'''

          #ifdef CONFIG_KSU_SUSFS
          /* KSU_NEXT_SUSFS_BRIDGE_L21_HANDLERS */
          bool susfs_is_allow_su(void)
          {
          	if (is_manager())
          		return true;
          	return ksu_is_allow_uid_for_current(current_uid().val);
          }

          #ifdef CONFIG_KSU_SUSFS_SUS_PATH
          static int do_susfs_add_sus_path(void __user *arg)
          {
          	return susfs_add_sus_path((struct st_susfs_sus_path __user *)arg);
          }
          #endif

          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          static int do_susfs_add_sus_mount(void __user *arg)
          {
          	return susfs_add_sus_mount((struct st_susfs_sus_mount __user *)arg);
          }
          #endif

          #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT
          static int do_susfs_add_sus_kstat(void __user *arg)
          {
          	return susfs_add_sus_kstat((struct st_susfs_sus_kstat __user *)arg);
          }
          #endif

          #ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT
          static int do_susfs_add_try_umount(void __user *arg)
          {
          	return susfs_add_try_umount((struct st_susfs_try_umount __user *)arg);
          }
          #endif

          #ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME
          static int do_susfs_set_uname(void __user *arg)
          {
          	return susfs_set_uname((struct st_susfs_uname __user *)arg);
          }
          #endif

          #ifdef CONFIG_KSU_SUSFS_ENABLE_LOG
          static int do_susfs_enable_log(void __user *arg)
          {
          	int enabled = 0;
          	if (!arg)
          		return -EINVAL;
          	if (copy_from_user(&enabled, arg, sizeof(enabled)))
          		return -EFAULT;
          	susfs_set_log(enabled != 0);
          	return 0;
          }
          #endif
          #endif /* CONFIG_KSU_SUSFS */
          '''
              marker = "// IOCTL handlers mapping table"
              if marker in dtxt:
                  dtxt = dtxt.replace(marker, handler + "\n" + marker, 1)
              else:
                  table = "static const struct ksu_ioctl_cmd_map ksu_ioctl_handlers[]"
                  if table not in dtxt:
                      raise SystemExit("ERROR: mapping table anchor not found in supercall/dispatch.c")
                  dtxt = dtxt.replace(table, handler + "\n" + table, 1)
              print(f"[PATCH] {dispatch}: inserted SUSFS command handlers")

          if "SUSFS_ADD_SUS_PATH" not in dtxt:
              mappings = r'''
          #ifdef CONFIG_KSU_SUSFS
          #ifdef CONFIG_KSU_SUSFS_SUS_PATH
          	{ .cmd = CMD_SUSFS_ADD_SUS_PATH, .name = "SUSFS_ADD_SUS_PATH", .handler = do_susfs_add_sus_path, .perm_check = manager_or_root },
          	{ .cmd = CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY, .name = "SUSFS_ADD_SUS_KSTAT_STATICALLY", .handler = do_susfs_add_sus_kstat, .perm_check = manager_or_root },
          #endif
          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          	{ .cmd = CMD_SUSFS_ADD_SUS_MOUNT, .name = "SUSFS_ADD_SUS_MOUNT", .handler = do_susfs_add_sus_mount, .perm_check = manager_or_root },
          #endif
          #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT
          	{ .cmd = CMD_SUSFS_ADD_SUS_KSTAT, .name = "SUSFS_ADD_SUS_KSTAT", .handler = do_susfs_add_sus_kstat, .perm_check = manager_or_root },
          	{ .cmd = CMD_SUSFS_UPDATE_SUS_KSTAT, .name = "SUSFS_UPDATE_SUS_KSTAT", .handler = do_susfs_add_sus_kstat, .perm_check = manager_or_root },
          #endif
          #ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT
          	{ .cmd = CMD_SUSFS_ADD_TRY_UMOUNT, .name = "SUSFS_ADD_TRY_UMOUNT", .handler = do_susfs_add_try_umount, .perm_check = manager_or_root },
          #endif
          #ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME
          	{ .cmd = CMD_SUSFS_SET_UNAME, .name = "SUSFS_SET_UNAME", .handler = do_susfs_set_uname, .perm_check = manager_or_root },
          #endif
          #ifdef CONFIG_KSU_SUSFS_ENABLE_LOG
          	{ .cmd = CMD_SUSFS_ENABLE_LOG, .name = "SUSFS_ENABLE_LOG", .handler = do_susfs_enable_log, .perm_check = manager_or_root },
          #endif
          #endif
          '''
              sentinel_re = re.compile(r'^(?P<indent>[ \t]*)\{\s*\.cmd\s*=\s*0\s*,\s*\.name\s*=\s*NULL\s*,\s*\.handler\s*=\s*NULL\s*,\s*\.perm_check\s*=\s*NULL\s*\}\s*,?\s*(?://[^\n]*)?$', re.MULTILINE)
              m = sentinel_re.search(dtxt)
              if m:
                  dtxt = dtxt[:m.start()] + mappings + "\n" + dtxt[m.start():]
                  print(f"[PATCH] {dispatch}: inserted SUSFS mappings before sentinel")
              else:
                  close_re = re.compile(r'^(?P<indent>[ \t]*)\};\s*//\s*clang-format on', re.MULTILINE)
                  m = close_re.search(dtxt)
                  if not m:
                      raise SystemExit("ERROR: neither sentinel nor mapping table close found in supercall/dispatch.c")
                  dtxt = dtxt[:m.start()] + mappings + "\n" + dtxt[m.start():]
                  print(f"[PATCH] {dispatch}: sentinel missing, inserted SUSFS mappings before table close")
          else:
              print(f"[OK] {dispatch}: SUSFS mappings already present")

          write(dispatch, dtxt)
          print(f"[PATCH] {dispatch}: added robust SUSFS command bridge")

          kumount = kdir / "feature" / "kernel_umount.c"
          utxt = read(kumount)
          if "KSU_NEXT_SUSFS_BRIDGE_L21_INCLUDE" not in utxt:
              lines = utxt.splitlines(True)
              pos = 0
              for i, line in enumerate(lines[:100]):
                  if line.lstrip().startswith("#include"):
                      pos = i + 1
              lines.insert(pos, "#ifdef CONFIG_KSU_SUSFS\n/* KSU_NEXT_SUSFS_BRIDGE_L21_INCLUDE */\n#include <linux/susfs.h>\n#endif\n")
              utxt = "".join(lines)
          if "KSU_NEXT_SUSFS_BRIDGE_L21_TRY_UMOUNT_CALL" not in utxt:
              marker = "pr_info(\"handle umount for uid: %d, pid: %d\\n\", new_uid, current->pid);"
              call = "\n#ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT\n\t/* KSU_NEXT_SUSFS_BRIDGE_L21_TRY_UMOUNT_CALL */\n\tsusfs_try_umount(new_uid);\n#endif"
              if marker in utxt:
                  utxt = utxt.replace(marker, marker + call, 1)
              else:
                  print("[WARN] kernel_umount.c: umount marker not found; skipping susfs_try_umount call")
          write(kumount, utxt)
          print(f"[PATCH] {kumount}: added optional susfs_try_umount call")

          rules = kdir / "selinux" / "rules.c"
          rtxt = read(rules)
          # KSU_NEXT_SUSFS_BRIDGE_L21_SEPOLICY_SAFE_SKIP
          # Do not inject a standalone ksu_allow() line into rules.c.
          # On this KernelSU-Next legacy layout, inserting near rcu_read_unlock()
          # can land outside apply_kernelsu_rules_fn() and causes:
          #   error: expected identifier / conflicting types for ksu_allow
          # SuSFS can build without this optional zygote labeledfs allow rule.
          broken = (
              "\n#ifdef CONFIG_KSU_SUSFS\n"
              "\t/* KSU_NEXT_SUSFS_BRIDGE_L21_SEPOLICY */\n"
              "\tksu_allow(db, \"zygote\", \"labeledfs\", \"filesystem\", \"unmount\");\n"
              "#endif\n"
          )
          if broken in rtxt:
              rtxt = rtxt.replace(broken, "\n")
              write(rules, rtxt)
              print(f"[FIX] {rules}: removed unsafe standalone zygote labeledfs allow block")
          else:
              print(f"[SKIP] {rules}: skipped optional zygote labeledfs allow for compile-safe L21")

          print("===== BRIDGE MARKERS =====")
          for f in [kconfig, kbuild, init, dispatch, kumount, rules]:
              t = read(f)
              print(f"{f}: KSU_NEXT_SUSFS_BRIDGE_L21={t.count('KSU_NEXT_SUSFS_BRIDGE_L21')}, config KSU_SUSFS={t.count('config KSU_SUSFS')}, CONFIG_KSU_SUSFS={t.count('CONFIG_KSU_SUSFS')}")
          PY

          echo "===== VERIFY SUSFS SOURCE INTEGRATION ====="
          {
            echo "SUSFS_BRANCH=$SUSFS_BRANCH"
            echo "SUSFS_REPO=$SUSFS_REPO"
            echo "KSU_ROOT=$KSU_ROOT"
            echo "KERNEL_PATCH=$KERNEL_PATCH"
            echo ""
            echo "--- SuSFS files ---"
            ls -lah fs/susfs.c include/linux/susfs.h include/linux/sus_su.h fs/sus_su.c 2>/dev/null || true
            echo ""
            echo "--- KernelSU Next SuSFS bridge markers ---"
            grep -RIn "KSU_NEXT_SUSFS_BRIDGE_L21\|CONFIG_KSU_SUSFS\|config KSU_SUSFS\|CMD_SUSFS\|susfs" "$KSU_ROOT/kernel" drivers/kernelsu fs include/linux 2>/dev/null | head -500 || true
            echo ""
            echo "--- KernelSU Kconfig SuSFS lines ---"
            grep -n "KSU_SUSFS" "$KSU_ROOT/kernel/Kconfig" || true
          } | tee SuSFS-build-info.txt

          REQUIRED=(
            "fs/susfs.c"
            "include/linux/susfs.h"
          )

          for FILE in "${REQUIRED[@]}"; do
            if [ ! -s "$FILE" ]; then
              echo "ERROR: required SuSFS file missing or empty: $FILE"
              exit 1
            fi
          done

          if [ -f include/linux/susfs_def.h ]; then
            echo "[OK] optional include/linux/susfs_def.h exists"
          else
            echo "[OK] optional include/linux/susfs_def.h not present in this SuSFS 4.9 patchset; continue"
          fi

          if ! grep -Eq "^[[:space:]]*config[[:space:]]+KSU_SUSFS$|CONFIG_KSU_SUSFS" "$KSU_ROOT/kernel/Kconfig"; then
            echo "ERROR: KernelSU-Next Kconfig does not contain config KSU_SUSFS"
            grep -n "KSU_SUSFS" "$KSU_ROOT/kernel/Kconfig" || true
            exit 1
          fi

          if ! grep -q "susfs.o" fs/Makefile; then
            echo "ERROR: fs/Makefile does not build susfs.o"
            exit 1
          fi

          if ! grep -q "susfs_init" "$KSU_ROOT/kernel/core/init.c"; then
            echo "ERROR: susfs_init bridge missing from KernelSU-Next init"
            exit 1
          fi
          if ! grep -q "extern void susfs_init(void);" "$KSU_ROOT/kernel/core/init.c"; then
            echo "ERROR: susfs_init extern prototype missing from KernelSU-Next init"
            exit 1
          fi

          if ! grep -q "CMD_SUSFS_ADD_SUS_PATH" "$KSU_ROOT/kernel/supercall/dispatch.c"; then
            echo "ERROR: SUSFS command bridge missing from KernelSU-Next dispatch"
            exit 1
          fi

          echo "SuSFS bridge level 15 source integration passed."



      - name: Patch ksud robust tmpfs path L21
        shell: bash
        working-directory: kernel
        run: |
          set -e
          echo "===== PATCH KSUD ROBUST TMPFS PATH L21 ====="

          if [ -z "${KSU_ROOT:-}" ]; then
            for CANDIDATE in KernelSU-Next KernelSU; do
              if [ -d "$CANDIDATE/kernel" ]; then
                KSU_ROOT="$CANDIDATE"
                break
              fi
            done
          fi

          if [ -z "${KSU_ROOT:-}" ] || [ ! -d "$KSU_ROOT/kernel" ]; then
            echo "ERROR: KSU_ROOT not found" | tee ksud-robust-l21.log
            find . -maxdepth 4 -type d | sort | sed -n '1,180p' | tee -a ksud-robust-l21.log
            exit 1
          fi

          echo "KSU_ROOT=$KSU_ROOT" | tee ksud-robust-l21.log
          export KSU_ROOT

          python3 - <<'PY' 2>&1 | tee -a ksud-robust-l21.log
          from pathlib import Path
          import os
          import re

          ksu_root = Path(os.environ.get("KSU_ROOT", "KernelSU-Next"))
          src_candidates = [
              ksu_root / "kernel" / "runtime" / "ksud_integration.c",
              Path("drivers/kernelsu/runtime/ksud_integration.c"),
          ]
          src = next((p for p in src_candidates if p.exists()), None)
          if src is None:
              raise SystemExit("ERROR: ksud_integration.c not found")

          text = src.read_text(errors="ignore")
          original = text
          marker = "KSU_NEXT_KSUD_ROBUST_TMPFS_L21"

          # Add an optional alternate path macro. This is harmless if the RC string is not changed.
          if marker not in text:
              macro = "\n#ifndef KSUD_INIT_EXEC_PATH\n#define KSUD_INIT_EXEC_PATH \"/dev/ksu/ksud\"\n#endif\n/* KSU_NEXT_KSUD_ROBUST_TMPFS_L21 */\n"
              inc = '#include "ksud_boot.h"'
              pos = text.find(inc)
              if pos >= 0:
                  pos2 = pos + len(inc)
                  text = text[:pos2] + macro + text[pos2:]
              else:
                  pos = text.find('static const char KERNEL_SU_RC[]')
                  if pos >= 0:
                      text = text[:pos] + macro + text[pos:]
                  else:
                      print("[WARN] KERNEL_SU_RC not found; only adding no RC changes")

          # Robustly replace only RC exec usages, not every KSUD_PATH occurrence in C logic.
          # Handles both minified and normally formatted KERNEL_SU_RC strings.
          replaced = 0
          for phase in ("post-fs-data", "services", "boot-completed"):
              patterns = [
                  (f'KSUD_PATH " {phase}', f'KSUD_INIT_EXEC_PATH " {phase}'),
                  (f'KSUD_PATH" {phase}', f'KSUD_INIT_EXEC_PATH" {phase}'),
                  (f'KSUD_PATH "{phase}', f'KSUD_INIT_EXEC_PATH "{phase}'),
                  (f'KSUD_PATH"{phase}', f'KSUD_INIT_EXEC_PATH"{phase}'),
              ]
              for a, b in patterns:
                  if a in text:
                      text = text.replace(a, b)
                      replaced += 1

          prep_lines = [
              '" mkdir /dev/ksu 0700 root root\\n"',
              '" copy /data/adb/ksud /dev/ksu/ksud\\n"',
              '" chmod 0700 /dev/ksu/ksud\\n"',
              '" chown root root /dev/ksu/ksud\\n"',
          ]
          prep_block = "\n".join(prep_lines) + "\n"

          # Insert prep lines before each RC exec line if the line was converted.
          lines = text.splitlines(True)
          out = []
          inserted = 0
          for line in lines:
              if 'KSUD_INIT_EXEC_PATH' in line and any(ph in line for ph in ("post-fs-data", "services", "boot-completed")):
                  prev_text = "".join(out[-8:])
                  if 'copy /data/adb/ksud /dev/ksu/ksud' not in prev_text:
                      out.append(prep_block)
                      inserted += 1
              out.append(line)
          text = "".join(out)

          src.write_text(text)
          print(f"[INFO] {src}: RC exec replacements={replaced}, prep_insertions={inserted}")
          if replaced == 0:
              print("[WARN] No exact KSUD_PATH RC exec line was replaced. This workflow will continue using stable v33 behavior.")
          elif inserted == 0:
              print("[WARN] RC exec path changed but prep lines were not inserted; review source preview.")
          else:
              print(f"[PATCH] {src}: robust tmpfs ksud RC path L21 applied")

          rules_candidates = [
              ksu_root / "kernel" / "selinux" / "rules.c",
              Path("drivers/kernelsu/selinux/rules.c"),
          ]
          rules = next((p for p in rules_candidates if p.exists()), None)
          if rules is None:
              print("[WARN] KernelSU SELinux rules.c not found; skipping tmpfs policy block")
          else:
              rtext = rules.read_text(errors="ignore")
              rmarker = "KSU_NEXT_KSUD_ROBUST_TMPFS_POLICY_L21"
              policy_lines = [
                  "#ifdef CONFIG_KSU",
                  "\t/* KSU_NEXT_KSUD_ROBUST_TMPFS_POLICY_L21 */",
                  "\tksu_allow(db, \"ksu\", \"system_data_file\", \"dir\", \"getattr\");",
                  "\tksu_allow(db, \"ksu\", \"system_data_file\", \"dir\", \"search\");",
                  "\tksu_allow(db, \"ksu\", \"adb_data_file\", \"dir\", \"getattr\");",
                  "\tksu_allow(db, \"ksu\", \"adb_data_file\", \"dir\", \"search\");",
                  "\tksu_allow(db, \"ksu\", \"adb_data_file\", \"file\", \"getattr\");",
                  "\tksu_allow(db, \"ksu\", \"adb_data_file\", \"file\", \"read\");",
                  "\tksu_allow(db, \"ksu\", \"adb_data_file\", \"file\", \"open\");",
                  "\tksu_allow(db, \"ksu\", \"tmpfs\", \"dir\", \"getattr\");",
                  "\tksu_allow(db, \"ksu\", \"tmpfs\", \"dir\", \"search\");",
                  "\tksu_allow(db, \"ksu\", \"tmpfs\", \"file\", \"getattr\");",
                  "\tksu_allow(db, \"ksu\", \"tmpfs\", \"file\", \"read\");",
                  "\tksu_allow(db, \"ksu\", \"tmpfs\", \"file\", \"open\");",
                  "\tksu_allow(db, \"ksu\", \"tmpfs\", \"file\", \"map\");",
                  "\tksu_allow(db, \"ksu\", \"tmpfs\", \"file\", \"execute\");",
                  "\tksu_allow(db, \"ksu\", \"tmpfs\", \"file\", \"execute_no_trans\");",
                  "#endif",
              ]
              block = "\n" + "\n".join(policy_lines) + "\n"
              if rmarker in rtext:
                  print(f"[OK] {rules}: {rmarker} already present")
              else:
                  lines = rtext.splitlines(True)
                  insert_at = None
                  for i, line in enumerate(lines):
                      if re.search(r'struct\s+policydb\s+\*db\s*=', line) or re.search(r'struct\s+policydb\s+\*db\s*;', line):
                          insert_at = i + 1
                          break
                  if insert_at is None:
                      print("[WARN] could not locate policydb db line; skipping tmpfs policy block")
                  else:
                      lines.insert(insert_at, block + "\n")
                      rules.write_text("".join(lines))
                      print(f"[PATCH] {rules}: inserted {rmarker} policy block")

          print("===== KSUD ROBUST TMPFS L21 SOURCE PREVIEW =====")
          for p in [src, rules] if rules else [src]:
              if not p or not p.exists():
                  continue
              for i, line in enumerate(p.read_text(errors="ignore").splitlines(), start=1):
                  if "KSU_NEXT_KSUD_ROBUST" in line or "/dev/ksu/ksud" in line or "copy /data/adb/ksud" in line or "KSUD_INIT_EXEC_PATH" in line:
                      print(f"{p}:{i}: {line}")
          PY

          echo "===== VERIFY KSUD ROBUST TMPFS L21 =====" | tee ksud-robust-l21-verify.log
          grep -RIn "KSU_NEXT_KSUD_ROBUST\|/dev/ksu/ksud\|copy /data/adb/ksud\|KSUD_INIT_EXEC_PATH" "$KSU_ROOT/kernel/runtime" "$KSU_ROOT/kernel/selinux" drivers/kernelsu 2>/dev/null | tee -a ksud-robust-l21-verify.log || true

      - name: Verify KernelSU Next integration v35
        shell: bash
        working-directory: kernel
        run: |
          set -e

          echo "===== VERIFY KERNELSU NEXT INTEGRATION v35 ====="

          {
            echo "Device: ${DEVICE}"
            echo "Model: ${MODEL_NAME}"
            echo "Android: ${PLATFORM_VERSION}/${ANDROID_MAJOR_VERSION}"
            echo "Kernel release target: 4.9.220-G960NK-v35-ksunext-susfs-ksudrobust-l21"
            echo ""
          } > ksu-next-build-info.txt

          if [ -d "KernelSU-Next/.git" ]; then
            {
              echo "KernelSU Next directory: KernelSU-Next"
              echo "KernelSU Next branch: $(git -C KernelSU-Next rev-parse --abbrev-ref HEAD || true)"
              echo "KernelSU Next commit: $(git -C KernelSU-Next rev-parse HEAD || true)"
              echo "KernelSU Next short commit: $(git -C KernelSU-Next rev-parse --short HEAD || true)"
              echo "KernelSU Next latest commit:"
              git -C KernelSU-Next log -1 --oneline || true
            } >> ksu-next-build-info.txt
          elif [ -d "drivers/kernelsu/.git" ]; then
            {
              echo "KernelSU Next directory: drivers/kernelsu"
              echo "KernelSU Next branch: $(git -C drivers/kernelsu rev-parse --abbrev-ref HEAD || true)"
              echo "KernelSU Next commit: $(git -C drivers/kernelsu rev-parse HEAD || true)"
              echo "KernelSU Next short commit: $(git -C drivers/kernelsu rev-parse --short HEAD || true)"
              echo "KernelSU Next latest commit:"
              git -C drivers/kernelsu log -1 --oneline || true
            } >> ksu-next-build-info.txt
          else
            echo "KernelSU Next git directory not found; setup script may have used a symlink or copied tree." >> ksu-next-build-info.txt
          fi

          echo ""
          echo "===== REQUIRED SOURCE MARKERS =====" | tee -a ksu-next-build-info.txt

          REQUIRED_MARKERS=(
            "kernel/reboot.c:ksu_handle_sys_reboot"
            "fs/namespace.c:int path_umount(struct path *path, int flags)"
            "fs/exec.c:ksu_handle_execveat"
            "fs/open.c:ksu_handle_faccessat"
            "fs/read_write.c:ksu_handle_sys_read"
            "fs/stat.c:ksu_handle_stat"
          )

          for ITEM in "${REQUIRED_MARKERS[@]}"; do
            FILE="${ITEM%%:*}"
            MARKER="${ITEM#*:}"

            if grep -Fq "$MARKER" "$FILE"; then
              echo "[OK] $FILE contains $MARKER" | tee -a ksu-next-build-info.txt
            else
              echo "[WARN] $FILE missing $MARKER" | tee -a ksu-next-build-info.txt
            fi
          done

          echo ""
          echo "===== KSU MARKERS PREVIEW =====" | tee -a ksu-next-build-info.txt
          grep -RIn "CONFIG_KSU\|KSU_NEXT_MANUAL_HOOK\|KSU_NEXT_BACKPORT_PATH_UMOUNT\|ksu_handle_sys_reboot\|path_umount" \
            Kconfig Makefile drivers fs kernel 2>/dev/null > ksu-next-markers-v35.txt || true
          sed -n '1,260p' ksu-next-markers-v35.txt | tee -a ksu-next-build-info.txt || true

          if ! grep -q "ksu_handle_sys_reboot" kernel/reboot.c; then
            echo "ERROR: reboot manual hook is missing"
            exit 1
          fi

          if ! grep -q "int path_umount(struct path \*path, int flags)" fs/namespace.c; then
            echo "ERROR: path_umount backport is missing"
            exit 1
          fi

          echo "KernelSU Next v35 source verification passed."


      - name: Prepare defconfig
        shell: bash
        working-directory: kernel
        run: |
          set -e

          CONFIG_DIR="arch/arm64/configs"
          BASE_DEFCONFIG="$CONFIG_DIR/exynos9810_defconfig"
          DEVICE_CONFIG="$CONFIG_DIR/$DEVICE_DEFCONFIG"
          TEMP_CONFIG="$CONFIG_DIR/$TEMP_DEFCONFIG"

          if [ ! -f "$DEVICE_CONFIG" ]; then
            echo "Missing device defconfig: $DEVICE_CONFIG"
            exit 1
          fi

          rm -f "$TEMP_CONFIG"

          if [ -s "$BASE_DEFCONFIG" ]; then
            cat "$BASE_DEFCONFIG" > "$TEMP_CONFIG"
            printf '\n' >> "$TEMP_CONFIG"
            cat "$DEVICE_CONFIG" >> "$TEMP_CONFIG"
          else
            cp -f "$DEVICE_CONFIG" "$TEMP_CONFIG"
          fi

          printf '\n# GitHub Actions target: %s %s Android 10 Q\n' "$DEVICE" "$MODEL_NAME" >> "$TEMP_CONFIG"

          cat >> "$TEMP_CONFIG" <<'EOF'

          # KernelSU Next official legacy v35 SuSFS Bridge L21 manual hook
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KSU_KPROBES_HOOK is not set
          # CONFIG_KSU_KPROBE_HOOKS is not set

          # SuSFS level 1: keep useful core features, disable risky/extra features first
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          # CONFIG_KSU_SUSFS_SUS_OVERLAYFS is not set
          # CONFIG_KSU_SUSFS_SPOOF_UNAME is not set
          # CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG is not set
          # CONFIG_KSU_SUSFS_OPEN_REDIRECT is not set
          # CONFIG_KSU_SUSFS_SUS_SU is not set
          EOF

          echo "===== TEMP DEFCONFIG ====="
          ls -lah "$TEMP_CONFIG"
          tail -80 "$TEMP_CONFIG" || true

      - name: Build kernel and dtb.img
        shell: bash
        working-directory: kernel
        run: |
          set -eo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC="clang --target=aarch64-linux-gnu --prefix=/usr/bin/aarch64-linux-gnu- -no-integrated-as"
          export HOSTCC=gcc
          export HOSTCXX=g++
          export AS=aarch64-linux-gnu-as
          export LD=aarch64-linux-gnu-ld.bfd
          export AR=aarch64-linux-gnu-ar
          export NM=aarch64-linux-gnu-nm
          export OBJCOPY=aarch64-linux-gnu-objcopy
          export OBJDUMP=aarch64-linux-gnu-objdump
          export STRIP=aarch64-linux-gnu-strip
          export READELF=aarch64-linux-gnu-readelf
          export PLATFORM_VERSION="$PLATFORM_VERSION"
          export ANDROID_MAJOR_VERSION="$ANDROID_MAJOR_VERSION"
          export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          export KBUILD_BUILD_USER=khiconjk
          export KBUILD_BUILD_HOST=github-actions

          MAKE_ARGS=(
            V=0
            ARCH=arm64
            SUBARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
            "CC=clang --target=aarch64-linux-gnu --prefix=/usr/bin/aarch64-linux-gnu- -no-integrated-as"
            HOSTCC=gcc
            HOSTCXX=g++
            AS=aarch64-linux-gnu-as
            LD=aarch64-linux-gnu-ld.bfd
            AR=aarch64-linux-gnu-ar
            NM=aarch64-linux-gnu-nm
            OBJCOPY=aarch64-linux-gnu-objcopy
            OBJDUMP=aarch64-linux-gnu-objdump
            STRIP=aarch64-linux-gnu-strip
            READELF=aarch64-linux-gnu-readelf
            PLATFORM_VERSION="$PLATFORM_VERSION"
            ANDROID_MAJOR_VERSION="$ANDROID_MAJOR_VERSION"
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          )

          echo "===== COMPILER TEST ====="
          clang --target=aarch64-linux-gnu --prefix=/usr/bin/aarch64-linux-gnu- -no-integrated-as -x c -c /dev/null -o /tmp/clang-arm64-test.o
          file /tmp/clang-arm64-test.o

          echo "===== DEFCONFIG ====="
          make "${MAKE_ARGS[@]}" "$TEMP_DEFCONFIG" 2>&1 | tee defconfig.log

          echo "===== OLDDEFCONFIG ====="
          make "${MAKE_ARGS[@]}" olddefconfig 2>&1 | tee olddefconfig.log

          echo "===== CONFIG CHECK ====="
          grep -E "CONFIG_SOC_EXYNOS9810|CONFIG_CAMERA_STAR|CONFIG_CAMERA_STAR2|CONFIG_CAMERA_CROWN|CONFIG_EXYNOS_DTBTOOL|CONFIG_BUILD_ARM64_APPENDED|CONFIG_MODULES|CONFIG_ANDROID|CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS|CONFIG_KSU_KPROBES_HOOK|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS" .config || true

          if ! grep -q "^CONFIG_KSU=y" .config; then
            echo "ERROR: CONFIG_KSU was not enabled"
            exit 1
          fi

          if ! grep -q "^CONFIG_KSU_MANUAL_HOOK=y" .config; then
            echo "ERROR: CONFIG_KSU_MANUAL_HOOK was not enabled"
            exit 1
          fi
          if ! grep -q "^CONFIG_KSU_SUSFS=y" .config; then
            echo "ERROR: CONFIG_KSU_SUSFS was not enabled"
            grep -n "KSU_SUSFS" .config || true
            exit 1
          fi

          if [ ! -f fs/susfs.c ] || [ ! -f include/linux/susfs.h ]; then
            echo "ERROR: SuSFS files missing before build"
            ls -lah fs/susfs.c include/linux/susfs.h 2>/dev/null || true
            exit 1
          fi

          if ! grep -q "ksu_handle_sys_reboot" kernel/reboot.c; then
            echo "ERROR: manual reboot hook marker missing; KernelSU-Next Kbuild will reject manual mode"
            exit 1
          fi

          echo "===== BUILD IMAGE + DTBS + DTB.IMG ====="
          make -j"$(nproc --all)" "${MAKE_ARGS[@]}" Image Image.gz dtbs dtb.img 2>&1 | tee build.log

          echo "===== IF dtb.img IS STILL MISSING, TRY dtb.img AGAIN WITH V=1 ====="
          if [ ! -f "arch/arm64/boot/dtb.img" ]; then
            make -j"$(nproc --all)" "${MAKE_ARGS[@]}" V=1 dtb.img 2>&1 | tee -a build.log
          fi

          echo "===== OUTPUTS ====="
          ls -lah arch/arm64/boot || true
          find arch/arm64/boot -maxdepth 8 -type f \( -name "Image*" -o -name "*.dtb" -o -name "dtb.img" -o -name "*.ko" \) -print -exec ls -lh {} \; || true

      - name: Show useful errors
        if: failure()
        shell: bash
        working-directory: kernel
        run: |
          echo "===== ERROR LINES ====="
          grep -nEi "error:|fatal error:|undefined reference|ld.lld|ld:|No such file|No rule to make target|FAILED|recipe for target|Stop\.|not found|Permission denied|unrecognized option|unknown argument|unsupported option|Illegal option|dtb.img" \
            clean.log defconfig.log olddefconfig.log build.log 2>/dev/null | tail -350 || true

          echo "===== LAST 350 BUILD LINES ====="
          tail -350 build.log 2>/dev/null || true

          echo "===== LAST 180 DEFCONFIG LINES ====="
          tail -180 defconfig.log 2>/dev/null || true

          echo "===== BOOT OUTPUT TREE ====="
          find arch/arm64/boot -maxdepth 8 -type f -print -exec ls -lh {} \; 2>/dev/null || true

      - name: Prepare failure diagnostics files
        if: failure()
        shell: bash
        working-directory: kernel
        run: |
          set +e
          touch build.log
          {
            echo "===== KernelSU config snapshot ====="
            if [ -f .config ]; then
              grep -E "CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS|CONFIG_KSU_KPROBES_HOOK|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS" .config || true
            else
              echo ".config not generated yet"
            fi
          } > KernelSU-config.txt
          {
            echo "===== SuSFS build info snapshot ====="
            echo "workflow=v35-ksunext-susfs-ksudrobust-l21"
            echo "date=$(date -u)"
            echo "DEVICE=${DEVICE:-unknown}"
            echo "MODEL_NAME=${MODEL_NAME:-unknown}"
            echo "KSU_ROOT=${KSU_ROOT:-unknown}"
            echo "KERNEL_PATCH=${KERNEL_PATCH:-unknown}"
            echo ""
            echo "--- available susfs logs ---"
            ls -lah susfs-*.log susfs-*.txt 2>/dev/null || true
            echo ""
            echo "--- susfs markers ---"
            grep -RIn "KSU_NEXT_SUSFS_BRIDGE_L21|CONFIG_KSU_SUSFS|config KSU_SUSFS|CMD_SUSFS|susfs" KernelSU-Next drivers/kernelsu fs include/linux 2>/dev/null | head -500 || true
          } > SuSFS-build-info.txt
          ls -lah build.log KernelSU-config.txt SuSFS-build-info.txt || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ss-S9-${{ steps.target.outputs.device }}-${{ steps.target.outputs.model }}-failure-diagnostics-v35-ksunext-susfs-ksudrobust-l21
          path: |
            kernel/*.log
            kernel/*.txt
            kernel/.config
            kernel/**/*.rej
            kernel/**/*.orig
          if-no-files-found: ignore
          compression-level: 6

      - name: Collect kernel outputs
        shell: bash
        working-directory: kernel
        run: |
          set -e

          OUT_DIR="$GITHUB_WORKSPACE/out"
          RAW_DIR="$OUT_DIR/raw"

          mkdir -p "$RAW_DIR"

          echo "===== REQUIRED OUTPUT CHECK ====="

          if [ ! -f "arch/arm64/boot/Image" ]; then
            echo "ERROR: arch/arm64/boot/Image not found"
            find arch/arm64/boot -maxdepth 8 -type f -print || true
            exit 1
          fi

          if [ ! -f "arch/arm64/boot/dtb.img" ]; then
            echo "ERROR: arch/arm64/boot/dtb.img not found"
            echo "Available dtb files:"
            find arch/arm64/boot -maxdepth 8 -type f \( -name "*.dtb" -o -name "dtb.img" \) -print -exec ls -lh {} \; || true
            echo "CONFIG_EXYNOS_DTBTOOL:"
            grep -n "CONFIG_EXYNOS_DTBTOOL" .config || true
            exit 1
          fi

          cp -av "arch/arm64/boot/Image" "$RAW_DIR/Image"
          cp -av "arch/arm64/boot/Image" "$RAW_DIR/zImage"
          cp -av "arch/arm64/boot/dtb.img" "$RAW_DIR/dtb.img"

          [ -f "arch/arm64/boot/Image.gz" ] && cp -av "arch/arm64/boot/Image.gz" "$RAW_DIR/Image.gz" || true
          [ -f "arch/arm64/boot/Image.gz-dtb" ] && cp -av "arch/arm64/boot/Image.gz-dtb" "$RAW_DIR/Image.gz-dtb" || true

          find . -type f -name "*.ko" -print0 > "$OUT_DIR/modules.list" || true

          if [ -s "$OUT_DIR/modules.list" ]; then
            tar --null -czf "$OUT_DIR/modules-${DEVICE}-${MODEL_NAME}.tar.gz" --files-from "$OUT_DIR/modules.list"
          else
            echo "No .ko modules found" > "$OUT_DIR/modules-${DEVICE}-${MODEL_NAME}.txt"
          fi

          cp -av clean.log "$OUT_DIR/clean.log" || true
          cp -av defconfig.log "$OUT_DIR/defconfig.log" || true
          cp -av olddefconfig.log "$OUT_DIR/olddefconfig.log" || true
          cp -av build.log "$OUT_DIR/build.log" || true
          cp -av ksu-next-build-info.txt "$OUT_DIR/KernelSU-Next-build-info.txt" 2>/dev/null || true
          cp -av SuSFS-build-info.txt "$OUT_DIR/SuSFS-build-info.txt" 2>/dev/null || true
          cp -av susfs-*.log "$OUT_DIR/" 2>/dev/null || true
          cp -av susfs-*.txt "$OUT_DIR/" 2>/dev/null || true
          cp -av ksu-next-markers-v35.txt "$OUT_DIR/KernelSU-Next-markers-v35.txt" 2>/dev/null || true
          grep -RIn "KSU_NEXT_MANUAL_HOOK\|ksu_handle_sys_reboot\|ksu_handle_execveat\|ksu_handle_faccessat\|ksu_handle_sys_read\|ksu_handle_stat" fs/exec.c fs/open.c fs/read_write.c fs/stat.c kernel/reboot.c > "$OUT_DIR/KernelSU-manual-hooks.txt" 2>/dev/null || true
          grep -RIn "KSU_NEXT_BACKPORT_PATH_UMOUNT\|int path_umount(struct path \*path, int flags)\|ksu_next_can_umount" fs/namespace.c fs/internal.h > "$OUT_DIR/KernelSU-path-umount.txt" 2>/dev/null || true
          grep -RIn "CONFIG_KSU_SUSFS\|SUSFS\|susfs" fs include/linux KernelSU-Next drivers/kernelsu 2>/dev/null > "$OUT_DIR/SuSFS-markers.txt" || true
          cp -av .config "$OUT_DIR/kernel.config" || true
          for KSU_CANDIDATE in KernelSU-Next KernelSU drivers/kernelsu kernel/kernelsu; do
            if [ -e "$KSU_CANDIDATE" ]; then
              find "$KSU_CANDIDATE" -maxdepth 3 -type f | sort > "$OUT_DIR/KernelSU-files.txt" || true
              break
            fi
          done
          grep -E "CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS|CONFIG_KSU_KPROBES_HOOK|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS" .config > "$OUT_DIR/KernelSU-config.txt" || true

          echo "===== ARTIFACT TREE ====="
          find "$OUT_DIR" -maxdepth 3 -type f -print -exec ls -lh {} \;

      - name: Package AnyKernel3 zip
        shell: bash
        run: |
          set -e

          OUT_DIR="$GITHUB_WORKSPACE/out"
          RAW_DIR="$OUT_DIR/raw"
          AK_DIR="$GITHUB_WORKSPACE/AnyKernel3"
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          ZIP_NAME="ss-S9-${DEVICE}-${MODEL_NAME}-OneUI2.5-Q-v35-ksunext-susfs-ksudrobust-l21-${SHORT_SHA}.zip"

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 "$AK_DIR"

          cd "$AK_DIR"

          rm -rf .git .github
          rm -f Image Image.gz Image.gz-dtb Image-dtb zImage zImage-dtb dtb dtb.img dtbo.img
          cp -av "$RAW_DIR/zImage" ./zImage
          cp -av "$RAW_DIR/dtb.img" ./dtb.img

          rm -f anykernel.sh

          printf '%s\n' \
            "### AnyKernel3 Ramdisk Mod Script" \
            "## Auto-generated for ss-S9" \
            "## Target: Samsung Galaxy S9 ${MODEL_NAME} / ${DEVICE} / One UI 2.5 Android 10" \
            "" \
            "properties() { '" \
            "kernel.string=ss-S9 ${DEVICE} ${MODEL_NAME} OneUI2.5 Android10 Q v35 KernelSU Next SuSFS ksud RobustTmpfs L21" \
            "do.devicecheck=1" \
            "do.modules=0" \
            "do.systemless=1" \
            "do.cleanup=1" \
            "do.cleanuponabort=0" \
            "device.name1=${AK_DEVICE_1}" \
            "device.name2=${AK_DEVICE_2}" \
            "device.name3=${AK_DEVICE_3}" \
            "device.name4=${AK_DEVICE_4}" \
            "device.name5=${DEVICE}" \
            "supported.versions=" \
            "supported.patchlevels=" \
            "'; }" \
            "" \
            "BLOCK=boot" \
            "for CANDIDATE in \\" \
            "  /dev/block/platform/11120000.ufs/by-name/BOOT \\" \
            "  /dev/block/platform/11120000.ufs/by-name/boot \\" \
            "  /dev/block/bootdevice/by-name/boot \\" \
            "  /dev/block/by-name/boot" \
            "do" \
            '  if [ -e "$CANDIDATE" ]; then' \
            '    BLOCK="$CANDIDATE"' \
            "    break" \
            "  fi" \
            "done" \
            "" \
            "IS_SLOT_DEVICE=0" \
            "RAMDISK_COMPRESSION=auto" \
            "PATCH_VBMETA_FLAG=auto" \
            "" \
            ". tools/ak3-core.sh" \
            "" \
            "dump_boot" \
            "write_boot" \
            > anykernel.sh

          chmod +x anykernel.sh

          echo "===== anykernel.sh ====="
          cat anykernel.sh

          zip -r9 "$OUT_DIR/$ZIP_NAME" ./* -x "*.git*" "README.md"
          ls -lh "$OUT_DIR/$ZIP_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ss-S9-${{ steps.target.outputs.device }}-${{ steps.target.outputs.model }}-kernel-v35-ksunext-susfs-ksudrobust-l21
          path: |
            out/*.zip
            out/raw/*
            out/*.log
            out/kernel.config
            out/modules-*
            out/KernelSU-*.txt
            out/SuSFS-*.txt
            out/susfs-*.log
            out/susfs-*.txt
            out/KernelSU-manual-hooks.txt
            out/KernelSU-path-umount.txt
            out/KernelSU-Next-build-info.txt
            out/KernelSU-Next-markers-v35.txt
          if-no-files-found: error
          compression-level: 6
