name: Pixel Kernel Build - KSU NEXT + SuSFS + Ghost Uptime

on:
  workflow_dispatch:
    inputs:
      ref_to_build:
        description: "Git branch/tag"
        required: true
        default: "main"
      device:
        description: "Pixel codename"
        required: true
        default: "raven"
      kernel_name:
        description: "Kernel name"
        required: true
        default: "Pixel-KSU-SUSFS"
      enable_ksu:
        description: "Enable KernelSU Next"
        required: true
        default: "true"
      enable_susfs:
        description: "Enable SuSFS"
        required: true
        default: "true"
      enable_ghost_uptime:
        description: "Enable Ghost Uptime"
        required: true
        default: "true"

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      TZ: Asia/Ho_Chi_Minh
      KERNEL_NAME: ${{ github.event.inputs.kernel_name }}
      DEVICE: ${{ github.event.inputs.device }}
      DEFCONFIG: gki_defconfig
      ARCH: arm64
      SUBARCH: arm64
      PLATFORM_VERSION: 14
      ANDROID_MAJOR_VERSION: u
      LLVM: 1
      LLVM_IAS: 1

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref_to_build }}
          fetch-depth: 1

      - name: Show Environment
        run: |
          echo "DEVICE=$DEVICE"
          echo "KERNEL_NAME=$KERNEL_NAME"
          uname -a
          lscpu
          free -h
          df -h

      - name: Install Dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            git \
            curl \
            wget \
            zip \
            unzip \
            bc \
            bison \
            flex \
            cpio \
            kmod \
            ccache \
            lzop \
            libssl-dev \
            libelf-dev \
            build-essential \
            gcc \
            g++ \
            clang \
            lld \
            llvm \
            llvm-dev \
            llvm-runtime \
            python3 \
            python3-pip \
            rsync \
            jq \
            device-tree-compiler

      - name: Setup Ccache
        run: |
          ccache -M 20G
          ccache -s

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 \
            https://github.com/kdrag0n/proton-clang.git \
            clang

      - name: Export Toolchain
        run: |
          echo "${GITHUB_WORKSPACE}/clang/bin" >> $GITHUB_PATH

      - name: Add KernelSU Next
        if: github.event.inputs.enable_ksu == 'true'
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Add SuSFS
        if: github.event.inputs.enable_susfs == 'true'
        run: |
          git clone --depth=1 https://github.com/sidex15/susfs4ksu.git susfs4ksu

          cp -r susfs4ksu/kernel_patches/fs/* fs/
          cp -r susfs4ksu/kernel_patches/include/linux/* include/linux/

          if ! grep -q "CONFIG_KSU_SUSFS" fs/Kconfig; then
            cat susfs4ksu/kernel_patches/50_add_susfs_in_kernel-5.10.patch || true
          fi

      - name: Add Ghost Uptime
        if: github.event.inputs.enable_ghost_uptime == 'true'
        run: |
          mkdir -p kernel/ghost

          cat > kernel/ghost/ghost_uptime.c << 'EOF'
          #include <linux/kernel.h>
          #include <linux/timekeeping.h>
          #include <linux/sysinfo.h>
          #include <linux/uaccess.h>

          static u64 ghost_offset = 60ULL * 60ULL * 24ULL * 17ULL;

          u64 ghost_get_uptime_offset(void)
          {
              return ghost_offset;
          }

          u64 ghost_get_fake_uptime(void)
          {
              struct timespec64 ts;
              ktime_get_boottime_ts64(&ts);
              return ts.tv_sec + ghost_offset;
          }

          EXPORT_SYMBOL(ghost_get_fake_uptime);
          EXPORT_SYMBOL(ghost_get_uptime_offset);
          EOF

          if ! grep -q "ghost_uptime" kernel/Makefile; then
            echo 'obj-y += ghost/' >> kernel/Makefile
          fi

          cat > kernel/ghost/Makefile << 'EOF'
          obj-y += ghost_uptime.o
          EOF

      - name: Patch Kernel Config
        run: |
          mkdir -p arch/arm64/configs

          make O=out ARCH=arm64 ${DEFCONFIG}

          CONFIG_FILE=out/.config

          enable_config() {
            CONFIG_NAME=$1

            if grep -q "# ${CONFIG_NAME} is not set" "$CONFIG_FILE"; then
              sed -i "s/# ${CONFIG_NAME} is not set/${CONFIG_NAME}=y/g" "$CONFIG_FILE"
            elif grep -q "${CONFIG_NAME}=m" "$CONFIG_FILE"; then
              sed -i "s/${CONFIG_NAME}=m/${CONFIG_NAME}=y/g" "$CONFIG_FILE"
            elif ! grep -q "${CONFIG_NAME}=y" "$CONFIG_FILE"; then
              echo "${CONFIG_NAME}=y" >> "$CONFIG_FILE"
            fi
          }

          disable_config() {
            CONFIG_NAME=$1

            sed -i "/${CONFIG_NAME}=y/d" "$CONFIG_FILE" || true
            sed -i "/${CONFIG_NAME}=m/d" "$CONFIG_FILE" || true

            echo "# ${CONFIG_NAME} is not set" >> "$CONFIG_FILE"
          }

          enable_config CONFIG_KSU
          enable_config CONFIG_KSU_MANUAL_HOOK
          enable_config CONFIG_KPM
          enable_config CONFIG_KSU_SUSFS
          enable_config CONFIG_KSU_SUSFS_SUS_PATH
          enable_config CONFIG_KSU_SUSFS_SUS_MOUNT
          enable_config CONFIG_KSU_SUSFS_SUS_KSTAT
          enable_config CONFIG_KSU_SUSFS_TRY_UMOUNT
          enable_config CONFIG_TMPFS_XATTR
          enable_config CONFIG_OVERLAY_FS
          enable_config CONFIG_KALLSYMS
          enable_config CONFIG_KALLSYMS_ALL

          disable_config CONFIG_LTO_CLANG_FULL

          yes "" | make O=out ARCH=arm64 oldconfig

      - name: Show Important Config
        run: |
          grep -E "CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_TMPFS_XATTR|CONFIG_OVERLAY_FS" out/.config || true

      - name: Build Kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"

          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee build.log

      - name: Verify Build
        run: |
          ls -lah out/arch/arm64/boot/ || true

          test -f out/arch/arm64/boot/Image

      - name: Create AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          cp out/arch/arm64/boot/Image AnyKernel3/

          cd AnyKernel3

          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh || true
          sed -i 's/IS_SLOT_DEVICE=0/IS_SLOT_DEVICE=1/g' anykernel.sh || true

          zip -r9 "${KERNEL_NAME}-${DEVICE}.zip" * -x .git README.md

      - name: Generate Build Info
        run: |
          mkdir -p release

          cp build.log release/build.log || true
          cp out/.config release/KernelSU-config.txt || true

          echo "Kernel Name: ${KERNEL_NAME}" > release/build-info.txt
          echo "Device: ${DEVICE}" >> release/build-info.txt
          echo "Build Date: $(date)" >> release/build-info.txt
          echo "Git Commit: $(git rev-parse --short HEAD)" >> release/build-info.txt

          echo "===== KernelSU =====" >> release/build-info.txt
          grep CONFIG_KSU out/.config >> release/build-info.txt || true

          echo "===== SuSFS =====" >> release/build-info.txt
          grep CONFIG_KSU_SUSFS out/.config >> release/build-info.txt || true

      - name: Copy Release Files
        run: |
          cp AnyKernel3/*.zip release/ || true
          cp out/arch/arm64/boot/Image release/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelKernel-${{ github.event.inputs.device }}
          path: release/*
          compression-level: 0

      - name: Final Summary
        run: |
          echo "======================================"
          echo " Build Finished "
          echo "======================================"
          echo "Kernel Name: ${KERNEL_NAME}"
          echo "Device: ${DEVICE}"
          echo "Artifact Uploaded Successfully"
          echo "======================================"
