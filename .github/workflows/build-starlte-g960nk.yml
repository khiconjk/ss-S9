name: Build ss-S9 starlte G960NK Kernel

on:
  workflow_dispatch:
    inputs:
      ref_to_build:
        description: "Branch/ref cần build"
        required: true
        default: "test_kernel"
      device:
        description: "Device target"
        required: true
        default: "starlte"
        type: choice
        options:
          - starlte
          - star2lte
          - crownlte
  push:
    branches:
      - test_kernel
    paths:
      - ".github/workflows/build-starlte-g960nk.yml"
      - "arch/**"
      - "block/**"
      - "certs/**"
      - "crypto/**"
      - "drivers/**"
      - "firmware/**"
      - "fs/**"
      - "include/**"
      - "init/**"
      - "ipc/**"
      - "kernel/**"
      - "lib/**"
      - "mm/**"
      - "net/**"
      - "samples/**"
      - "scripts/**"
      - "security/**"
      - "sound/**"
      - "tools/**"
      - "usr/**"
      - "virt/**"
      - "Makefile"
      - "Kbuild"
      - "Kconfig"

permissions:
  contents: read

concurrency:
  group: ss-s9-starlte-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_VERSION: "10"
  ANDROID_MAJOR_VERSION: "q"
  ARCH: "arm64"
  SUBARCH: "arm64"
  TEMP_DEFCONFIG: "exynos9810_temp_defconfig"

jobs:
  build:
    name: Build starlte kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Free runner space
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/local/share/boost || true
          sudo apt-get clean || true
          df -h

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref_to_build || 'test_kernel' }}
          fetch-depth: 1
          path: kernel

      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            clang \
            cpio \
            flex \
            gcc \
            g++ \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            make \
            pahole \
            perl \
            python3 \
            python-is-python3 \
            rsync \
            unzip \
            zip

          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          clang --version
          aarch64-linux-gnu-gcc --version
          arm-linux-gnueabi-gcc --version

      - name: Configure target
        id: target
        run: |
          set -e

          DEVICE="${{ github.event.inputs.device || 'starlte' }}"

          case "$DEVICE" in
            starlte)
              DEVICE_DEFCONFIG="exynos9810-starlte_defconfig"
              MODEL_NAME="G960NK"
              AK_DEVICE_1="starlte"
              AK_DEVICE_2="starlteks"
              AK_DEVICE_3="starltekor"
              AK_DEVICE_4="SM-G960N"
              ;;
            star2lte)
              DEVICE_DEFCONFIG="exynos9810-star2lte_defconfig"
              MODEL_NAME="G965"
              AK_DEVICE_1="star2lte"
              AK_DEVICE_2="star2lteks"
              AK_DEVICE_3="star2ltekor"
              AK_DEVICE_4="SM-G965N"
              ;;
            crownlte)
              DEVICE_DEFCONFIG="exynos9810-crownlte_defconfig"
              MODEL_NAME="N960"
              AK_DEVICE_1="crownlte"
              AK_DEVICE_2="crownlteks"
              AK_DEVICE_3="crownltekor"
              AK_DEVICE_4="SM-N960N"
              ;;
            *)
              echo "Unsupported device: $DEVICE"
              exit 1
              ;;
          esac

          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          echo "DEVICE_DEFCONFIG=$DEVICE_DEFCONFIG" >> "$GITHUB_ENV"
          echo "MODEL_NAME=$MODEL_NAME" >> "$GITHUB_ENV"
          echo "AK_DEVICE_1=$AK_DEVICE_1" >> "$GITHUB_ENV"
          echo "AK_DEVICE_2=$AK_DEVICE_2" >> "$GITHUB_ENV"
          echo "AK_DEVICE_3=$AK_DEVICE_3" >> "$GITHUB_ENV"
          echo "AK_DEVICE_4=$AK_DEVICE_4" >> "$GITHUB_ENV"

          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "model=$MODEL_NAME" >> "$GITHUB_OUTPUT"

      - name: Show repository state
        working-directory: kernel
        run: |
          set -e

          echo "===== BRANCH / COMMIT ====="
          git branch --show-current || true
          git rev-parse --short HEAD

          echo "===== KERNEL VERSION FROM MAKEFILE ====="
          grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=" Makefile || true

          echo "===== DEFCONFIG FILES ====="
          ls -lah arch/arm64/configs | grep -E "exynos9810|starlte|star2lte|crownlte" || true

          echo "===== DEVICE TARGET ====="
          echo "DEVICE=$DEVICE"
          echo "DEVICE_DEFCONFIG=$DEVICE_DEFCONFIG"
          echo "MODEL_NAME=$MODEL_NAME"
          echo "PLATFORM_VERSION=$PLATFORM_VERSION"
          echo "ANDROID_MAJOR_VERSION=$ANDROID_MAJOR_VERSION"

      - name: Clean kernel tree
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export HOSTCC=gcc
          export PLATFORM_VERSION="${PLATFORM_VERSION}"
          export ANDROID_MAJOR_VERSION="${ANDROID_MAJOR_VERSION}"
          export CONFIG_SECTION_MISMATCH_WARN_ONLY=y

          make ARCH=arm64 mrproper || true

      - name: Prepare G960NK Android 10 defconfig
        working-directory: kernel
        run: |
          set -e

          CONFIG_DIR="arch/arm64/configs"
          BASE_DEFCONFIG="$CONFIG_DIR/exynos9810_defconfig"
          DEVICE_CONFIG="$CONFIG_DIR/$DEVICE_DEFCONFIG"
          TEMP_CONFIG="$CONFIG_DIR/$TEMP_DEFCONFIG"

          if [ ! -f "$DEVICE_CONFIG" ]; then
            echo "Missing device defconfig: $DEVICE_CONFIG"
            exit 1
          fi

          rm -f "$TEMP_CONFIG"

          if [ -s "$BASE_DEFCONFIG" ]; then
            echo "Using base defconfig: $BASE_DEFCONFIG"
            cat "$BASE_DEFCONFIG" > "$TEMP_CONFIG"
            echo "" >> "$TEMP_CONFIG"
            cat "$DEVICE_CONFIG" >> "$TEMP_CONFIG"
          else
            echo "Base defconfig not found/non-empty, using device defconfig only: $DEVICE_CONFIG"
            cp -f "$DEVICE_CONFIG" "$TEMP_CONFIG"
          fi

          {
            echo ""
            echo "# GitHub Actions target override"
            echo "# Target: Samsung Galaxy S9 G960NK / starlte / One UI 2.5 / Android 10"
          } >> "$TEMP_CONFIG"

          echo "===== TEMP DEFCONFIG READY ====="
          ls -lah "$TEMP_CONFIG"
          tail -80 "$TEMP_CONFIG" || true

      - name: Build kernel
        working-directory: kernel
        run: |
          set -eo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export HOSTCC=gcc
          export PLATFORM_VERSION="${PLATFORM_VERSION}"
          export ANDROID_MAJOR_VERSION="${ANDROID_MAJOR_VERSION}"
          export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          export KBUILD_BUILD_USER="khiconjk"
          export KBUILD_BUILD_HOST="github-actions"

          MAKE_ARGS=(
            ARCH=arm64
            SUBARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
            CC=clang
            HOSTCC=gcc
            PLATFORM_VERSION="${PLATFORM_VERSION}"
            ANDROID_MAJOR_VERSION="${ANDROID_MAJOR_VERSION}"
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          )

          echo "===== MAKE DEFCONFIG ====="
          make "${MAKE_ARGS[@]}" "$TEMP_DEFCONFIG" 2>&1 | tee defconfig.log

          echo "===== MAKE OLDDEFCONFIG ====="
          make "${MAKE_ARGS[@]}" olddefconfig 2>&1 | tee olddefconfig.log

          echo "===== CONFIG CHECK ====="
          grep -E "CONFIG_SOC_EXYNOS9810|CONFIG_CAMERA_STAR|CONFIG_CAMERA_STAR2|CONFIG_CAMERA_CROWN|CONFIG_LOCALVERSION|CONFIG_MODULES|CONFIG_ANDROID" .config || true

          echo "===== BUILD START ====="
          make -j"$(nproc --all)" "${MAKE_ARGS[@]}" 2>&1 | tee build.log

          echo "===== BUILD OUTPUT CHECK ====="
          ls -lah arch/arm64/boot || true
          find arch/arm64/boot -maxdepth 4 -type f \( -name "Image*" -o -name "*.dtb" -o -name "dtb.img" -o -name "*.ko" \) -print || true

      - name: Show real errors
        if: failure()
        working-directory: kernel
        run: |
          echo "===== ERROR LINES ====="
          grep -nEi \
            "error:|fatal error:|undefined reference|ld.lld|ld:|No such file|No rule to make target|FAILED|recipe for target|Stop\.|not found" \
            build.log defconfig.log olddefconfig.log 2>/dev/null | tail -250 || true

          echo "===== LAST 250 BUILD LINES ====="
          tail -250 build.log 2>/dev/null || true

          echo "===== LAST 120 DEFCONFIG LINES ====="
          tail -120 defconfig.log 2>/dev/null || true

      - name: Collect raw kernel outputs
        working-directory: kernel
        run: |
          set -e

          OUT_DIR="$GITHUB_WORKSPACE/out"
          RAW_DIR="$OUT_DIR/raw"
          MODULE_DIR="$OUT_DIR/modules"

          mkdir -p "$RAW_DIR" "$MODULE_DIR"

          echo "===== COPY RAW OUTPUTS ====="

          if [ ! -f "arch/arm64/boot/Image" ]; then
            echo "ERROR: arch/arm64/boot/Image not found"
            find arch/arm64/boot -maxdepth 4 -type f -print || true
            exit 1
          fi

          cp -av "arch/arm64/boot/Image" "$RAW_DIR/Image"
          cp -av "arch/arm64/boot/Image" "$RAW_DIR/zImage"

          if [ -f "arch/arm64/boot/dtb.img" ]; then
            cp -av "arch/arm64/boot/dtb.img" "$RAW_DIR/dtb.img"
          else
            echo "ERROR: arch/arm64/boot/dtb.img not found"
            find arch/arm64/boot -maxdepth 6 -type f \( -name "*.dtb" -o -name "dtb.img" \) -print || true
            exit 1
          fi

          if [ -f "arch/arm64/boot/Image.gz" ]; then
            cp -av "arch/arm64/boot/Image.gz" "$RAW_DIR/Image.gz"
          fi

          if [ -f "arch/arm64/boot/Image.gz-dtb" ]; then
            cp -av "arch/arm64/boot/Image.gz-dtb" "$RAW_DIR/Image.gz-dtb"
          fi

          find . -type f -name "*.ko" -print0 > "$OUT_DIR/modules.list" || true

          if [ -s "$OUT_DIR/modules.list" ]; then
            tar --null -czf "$OUT_DIR/modules-${DEVICE}-${MODEL_NAME}.tar.gz" --files-from "$OUT_DIR/modules.list"
          else
            echo "No .ko modules found" > "$OUT_DIR/modules-${DEVICE}-${MODEL_NAME}.txt"
          fi

          cp -av build.log "$OUT_DIR/build.log" || true
          cp -av defconfig.log "$OUT_DIR/defconfig.log" || true
          cp -av olddefconfig.log "$OUT_DIR/olddefconfig.log" || true
          cp -av .config "$OUT_DIR/kernel.config" || true

          echo "===== RAW ARTIFACTS ====="
          find "$OUT_DIR" -maxdepth 3 -type f -print -exec ls -lh {} \;

      - name: Package AnyKernel3 TWRP flashable zip
        run: |
          set -e

          OUT_DIR="$GITHUB_WORKSPACE/out"
          RAW_DIR="$OUT_DIR/raw"
          AK_DIR="$GITHUB_WORKSPACE/AnyKernel3"
          ZIP_NAME="ss-S9-${DEVICE}-${MODEL_NAME}-OneUI2.5-Q-${GITHUB_SHA::7}.zip"

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 "$AK_DIR"

          cd "$AK_DIR"

          rm -rf .git .github
          rm -f Image Image.gz Image.gz-dtb Image-dtb zImage zImage-dtb dtb dtb.img dtbo.img

          cp -av "$RAW_DIR/zImage" ./zImage
          cp -av "$RAW_DIR/dtb.img" ./dtb.img

          cat > anykernel.sh <<AK3_EOF
### AnyKernel3 Ramdisk Mod Script
## Auto-generated for khiconjk/ss-S9
## Target: Samsung Galaxy S9 ${MODEL_NAME} / ${DEVICE} / One UI 2.5 Android 10

properties() { '
kernel.string=ss-S9 ${DEVICE} ${MODEL_NAME} OneUI2.5 Android10 Q
do.devicecheck=1
do.modules=0
do.systemless=1
do.cleanup=1
do.cleanuponabort=0
device.name1=${AK_DEVICE_1}
device.name2=${AK_DEVICE_2}
device.name3=${AK_DEVICE_3}
device.name4=${AK_DEVICE_4}
device.name5=${DEVICE}
supported.versions=
supported.patchlevels=
'; }

# shell variables
BLOCK=boot
for CANDIDATE in \
  /dev/block/platform/11120000.ufs/by-name/BOOT \
  /dev/block/platform/11120000.ufs/by-name/boot \
  /dev/block/bootdevice/by-name/boot \
  /dev/block/by-name/boot
do
  if [ -e "\$CANDIDATE" ]; then
    BLOCK="\$CANDIDATE"
    break
  fi
done

IS_SLOT_DEVICE=0
RAMDISK_COMPRESSION=auto
PATCH_VBMETA_FLAG=auto

# import functions/variables and setup patching
. tools/ak3-core.sh

# boot install
dump_boot
write_boot
AK3_EOF

          chmod +x anykernel.sh

          echo "===== ANYKERNEL CONTENT ====="
          ls -lah
          echo "===== anykernel.sh ====="
          cat anykernel.sh

          zip -r9 "$OUT_DIR/$ZIP_NAME" ./* -x "*.git*" "README.md"

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          ls -lh "$OUT_DIR/$ZIP_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ss-S9-${{ steps.target.outputs.device }}-${{ steps.target.outputs.model }}-kernel
          path: |
            out/*.zip
            out/raw/*
            out/*.log
            out/kernel.config
            out/modules-*
          if-no-files-found: error
          compression-level: 6
